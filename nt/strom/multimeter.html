<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Multimeter">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Multimeter</title>
<style>
:root{
  /* Dieselben Werte wie in «Grössen», «Blackbox», «Fehlersuche» und
     «Knoten und Maschen» – die fünf Werkzeuge stehen oft nebeneinander. */
  --bg:#E6ECF1;--paper:#F8FAFB;--ink:#1D2935;--muted:#5A6672;--line:#C6D0D9;
  --acc:#2E6DB4;--acc-soft:#EEF4FD;
  --ok:#23794A;--ok-soft:#E6F6EC;--bad:#B8322A;--bad-soft:#FDECEC;--warn:#B7791F;--warn-soft:#FBF1DE;
  --btn:#FFFFFF;
  --h:60px;--rand:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
/* Spalte statt fester Höhen: So darf die Kopfzeile auf schmalen Geräten
   zweizeilig werden, ohne dass main seine Höhe falsch ausrechnet. */
body{display:flex;flex-direction:column}
button{font-family:inherit;color:inherit}

/* Kopfzeile – gleiche Form wie in den anderen vier Werkzeugen:
   Titel links, Stufen in der Mitte, rechts Übersicht · Vollbild · ⚙ · ?
   Sie bleibt IMMER einzeilig, weil main seine Höhe aus --h rechnet. Auf
   schmalen Geräten weichen darum die Wörter, nicht die Zeile. */
/* Breite wie in den anderen vier begrenzt und zentriert – auf einem sehr
   breiten Bildschirm liefe die Zeile sonst auseinander. */
/* Die Stufenzeile liegt IMMER auf einer eigenen Zeile – gleicher Kopf wie
   in den anderen fünf Werkzeugen, unabhängig von der Bildschirmbreite. */
header.top{flex:0 0 auto;min-height:var(--h);display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px 14px;
  padding:12px 0 0;background:transparent;
  width:min(1668px, calc(100% - 2*var(--rand)));margin-inline:auto}
.hl{grid-column:1;grid-row:1;display:flex;align-items:center;gap:10px;min-width:0}
.hr{grid-column:2;grid-row:1}
.stages{grid-column:1 / -1;grid-row:2;width:100%}
.hl h1{margin:0;font-size:1.5rem;line-height:1.45;font-weight:700;letter-spacing:-.01em;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.hbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font:inherit;font-size:.92rem;
  height:36px;flex:none;border:1px solid var(--line);background:var(--btn);color:var(--muted);
  padding:0 14px;border-radius:999px;cursor:pointer;text-decoration:none}
.hbtn:hover{border-color:var(--acc);color:var(--acc)}
.hbtn svg{width:18px;height:18px;display:block}
.hbtn.rund{width:36px;padding:0;border-radius:999px;font-weight:700}
.hbtn:active{transform:scale(.96)}
/* Die fünf Stufen: gleich breit, eigener Rand, aktive Stufe dunkel */
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;
  border:1px solid var(--line);border-radius:14px;padding:3px;background:var(--paper)}
.stg{border:0;background:transparent;color:var(--ink);height:38px;padding:0 8px;font-size:.9rem;
  display:flex;align-items:center;justify-content:center;gap:5px;border-radius:11px;
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg .n{font-weight:700}
.stg .n::after{content:' ·'}
.stg:hover:not(:disabled):not(.on){background:#EEF2F7}
.stg.on,.stg.on:hover{background:var(--ink);color:var(--paper)}
.stg:disabled{opacity:.45;cursor:default}
/* Reicht der Platz nicht, weichen zuerst die Wörter der nicht gewählten Stufen,
   danach die Wörter auf den runden Knöpfen – die Zeile bleibt eine Zeile. */
@media (max-width:700px){.stg:not(.on) .t{display:none}.stg .n::after{content:''}
  .stg.on .n::after{content:' ·'}}
@media (max-width:900px){.hbtn .wort{display:none}.hbtn{width:36px;padding:0}}
@media (max-width:620px){.hl h1{font-size:1.15rem}}
@media (max-width:430px){.hr{gap:8px}header.top{padding:0 10px;gap:8px}}
@media (max-width:360px){.hl h1{font-size:1rem}}
/* Handy: Die fünf Stufen bekommen eine eigene Zeile über die ganze Breite.
   Vorher teilten sie sich den Rest neben Titel und Knöpfen – jede Fläche
   war noch 29 px breit und mit dem Finger kaum zu treffen. */
@media (max-width:640px){
  header.top{padding:6px 0}
  .stages{display:flex}
  /* Die gewählte Stufe darf breiter sein – nur sie trägt ihr Wort. */
  .stg{flex:1 1 0;min-width:0;height:44px;padding:0 4px}
  .stg.on{flex:2.6 1 0}
  .stg:not(.on) .t{display:none}
  .stg .t{font-size:.86rem}
}

/* Hauptbereich */
/* main IST die Karte – eine weisse Fläche mit Rand und runden Ecken, darin
   links das Gerät und rechts der Text. Genau wie in den anderen vier Werkzeugen.
   Der untere Aussenabstand muss von der Höhe abgezogen werden, sonst wächst die
   Seite darüber hinaus und es entsteht eine Bildlaufleiste. */
main{flex:1 1 auto;min-height:0;margin:0 auto var(--rand);
  width:min(1668px, calc(100% - 2*var(--rand)));
  display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,430px);gap:14px;
  background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
@media (max-aspect-ratio:1/1) and (min-width:641px){main{grid-template-columns:minmax(0,1fr) 340px}}
@media (max-aspect-ratio:1/1){body.wide main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,47%)}}
@media (max-aspect-ratio:1/1) and (max-height:1000px){
  body.wide .panel{padding:2px 6px 2px 2px;gap:8px}body.wide .body{gap:8px}
  body.wide .task{font-size:18px}body.wide .seg button{padding:6px}
  body.wide .mc .btn{min-height:36px;padding:6px 12px;font-size:14px}body.wide .mc{gap:4px}
  body.wide .steps{font-size:14px}body.wide .steps li{margin-bottom:2px}
  body.wide .diag div{padding:5px 9px;font-size:14px}
  body.wide .merk{font-size:13px;padding:5px 9px}body.wide .sub{font-size:13px}
  body.wide .btn{min-height:38px}
}
@media (max-width:640px){
  :root{--rand:10px}
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,50%);padding:8px;gap:8px}
}
#devWrap{min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
#dev{width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#dev text{pointer-events:none}
#dev .hit{fill:transparent;cursor:pointer}
#dev.inert .hit{cursor:default}
#knob{transition:transform .25s ease;transform-box:view-box;transform-origin:210px 505px}
#knob.drag{transition:none}
.mk ring{}
.mk .r{fill:rgba(47,110,158,.18);stroke:#7FB6E0;stroke-width:2.5;stroke-dasharray:5 4}
.mk.done .r{fill:rgba(46,133,64,.18);stroke:#5FC27A;stroke-dasharray:none}
.mk.bad .r{fill:rgba(192,57,43,.35);stroke:#FF8A7A;stroke-dasharray:none}
.mk.blink .r{animation:blink .4s ease-in-out 4 alternate}
@keyframes blink{from{stroke:#FFD54A;fill:rgba(255,213,74,.15)}to{stroke:#FFD54A;fill:rgba(255,213,74,.55);stroke-width:4}}
.pulse{animation:pulse .9s ease-out forwards}
@keyframes pulse{from{opacity:1}to{opacity:0}}

/* Panel */
.panel{scrollbar-gutter:stable;background:transparent;border-radius:0;padding:2px 6px 2px 2px;
  display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;box-shadow:none}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;flex:none}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.body{display:flex;flex-direction:column;gap:12px;flex:0 0 auto}
.task{font-size:21px;font-weight:650;line-height:1.3}
.sub{color:var(--muted);font-size:14px;line-height:1.35}
.info h2{margin:0 0 4px;font-size:22px}
.info p{margin:0;font-size:16px;line-height:1.4}
.info .nn{color:var(--muted);font-size:14px;margin-top:6px}
.fb{border-radius:12px;padding:11px 14px;font-size:16px;line-height:1.38;display:none;border-left:5px solid}
.fb.show{display:block}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb.warn{background:var(--warn-soft);border-color:var(--warn)}
.fb.info{background:var(--acc-soft);border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sel{background:var(--acc-soft);border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600;line-height:1.2;
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chip small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.chip.sel{outline:3px solid var(--acc);outline-offset:1px}
.chip.ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-120%);box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:grabbing}
.chip.lift{opacity:.35}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:#D5DEE5}
.dot.ok{background:var(--ok)}.dot.warn{background:#E0A43A}.dot.cur{box-shadow:0 0 0 2px var(--acc)}
.inp{display:flex;flex-direction:column;gap:10px}
#num{height:52px;width:100%;font-size:24px;font-weight:650;border-radius:10px;border:2px solid var(--line);padding:0 12px;font-family:inherit;color:var(--ink);background:#fff}
#num:focus{outline:none;border-color:var(--acc)}
.units{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.units .btn{padding:0;font-size:17px}
.mc{display:flex;flex-direction:column;gap:6px}
.mc .btn{text-align:left;font-weight:500;padding:10px 14px}
.mc .btn.okb{background:var(--ok-soft);border-color:var(--ok)}
.mc .btn.okb:disabled{opacity:1}
.mc .btn.badb{background:var(--bad-soft);border-color:var(--bad)}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}
/* Merksatz in der Sandfarbe der ganzen Familie – in «Grössen», «Blackbox»,
   «Fehlersuche» und «Knoten und Maschen» sieht er genau so aus. */
.merk{margin-top:auto;background:#f6f2e9;border:0;border-left:4px solid #d9bd6a;border-radius:0 10px 10px 0;
  padding:8px 12px;font-size:15px;line-height:1.45;color:#4a4232;flex:none}
.merk>b:first-child{color:#4a4232;margin-right:4px}
.merk>b:first-child::before{content:'📌 '}
.diag{display:flex;flex-direction:column;gap:6px}
.diag div{border-radius:10px;padding:8px 11px;font-size:15px;line-height:1.35;border-left:4px solid}
.diag .ok{background:var(--ok-soft);border-color:var(--ok)}.diag .bad{background:var(--bad-soft);border-color:var(--bad)}
.diag .warn{background:var(--warn-soft);border-color:var(--warn)}.diag .info{background:#fff;border-color:var(--line)}
.steps{margin:0;padding-left:22px;font-size:16px;line-height:1.4}
.steps li{margin-bottom:6px;color:#A9B5BF}.steps li.on{color:var(--ink)}
.vs{border-collapse:collapse;width:100%;margin-top:6px}.vs td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:middle;font-size:14px;line-height:1.3}
.vs td.z{font-size:24px;font-weight:800;color:var(--acc);width:34px;text-align:center}
.lbl{display:inline-block;background:#3A3B3E;color:#fff;font-weight:700;border-radius:5px;padding:0 6px;font-size:.9em;line-height:1.4;white-space:nowrap;vertical-align:baseline}
.qbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.qbtns .btn{padding:0 6px}

/* Overlays */
.ov{position:fixed;inset:0;background:rgba(29,41,53,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.ov.show{display:flex}
.card{background:var(--paper);border-radius:16px;padding:20px 22px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.card h2{margin:0 0 10px;font-size:20px}
.card p,.card li{font-size:15px;line-height:1.45}
.card ul{padding-left:20px;margin:6px 0}
.card .row{justify-content:flex-end;margin-top:14px}
/* Handy: auch die Kopfknöpfe auf Fingergrösse. */
@media (max-width:640px){.hbtn{height:44px}.hbtn.rund{width:44px}}
@media (max-width:640px){.hbtn{width:44px}#modeSwitch button,.seg button{min-height:44px}}
/* Niedriger Bildschirm: Stufen etwas flacher – dieselben Stufen wie in
   den anderen Werkzeugen. */
@media (min-width:941px) and (max-height:900px){.stg{height:34px}}
@media (min-width:941px) and (max-height:820px){.stg{height:32px}}
@media (min-width:941px) and (max-height:900px){header.top{padding-top:8px;gap:6px 14px}}
@media (min-width:941px) and (max-height:820px){header.top{padding-top:6px;gap:5px 14px}}
</style>
</head>
<body>
<header class="top">
  <div class="hl">
    <h1 title="Stand 27.10.2026">Multimeter</h1>
  </div>
  <nav class="stages" id="stages"></nav>
  <div class="hr">
    <a class="hbtn" href="index.html" title="Zur Übersicht" aria-label="Zur Übersicht"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.65 12 2.45l9 7.2"/><path d="M5.6 8.45v10h12.8v-10"/><path d="M9.9 18.45v-5.2h4.2v5.2"/></svg><span class="wort">Übersicht</span></a>
    <button class="hbtn" id="bFull" title="Vollbild" aria-label="Vollbild"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="wort">Vollbild</span></button>
    <button class="hbtn rund" id="bSet" title="Einstellungen" aria-label="Einstellungen">⚙</button>
    <button class="hbtn rund" id="bHelp" title="Anleitung" aria-label="Anleitung">?</button>
  </div>
</header>

<main>
  <section id="devWrap"><svg id="dev" viewBox="0 0 420 800" preserveAspectRatio="xMidYMid meet" aria-label="Multimeter"></svg></section>
  <aside class="panel" id="panel"></aside>
</main>

<div class="ov" id="ovHelp"><div class="card"><h2 id="helpT"></h2><div id="helpB"></div><div class="row"><button class="btn pri" data-close>OK</button></div></div></div>
<div class="ov" id="ovSet"><div class="card"><h2>Einstellungen</h2>
  <p class="sub">Für die Lehrperson.</p>
  <div class="row" style="justify-content:flex-start">
    <button class="btn" id="bSolve">Lösung der aktuellen Aufgabe zeigen</button>
    <button class="btn" id="bShuffle">Aufgaben neu mischen</button>
  </div>
  <div class="row"><button class="btn pri" data-close>Schliessen</button></div>
</div></div>

<script>
'use strict';
/* ================= Grundlagen ================= */
const NS='http://www.w3.org/2000/svg';
const $=s=>document.querySelector(s);
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function tx(x,y,s,a,p){const t=el('text',Object.assign({x,y,'text-anchor':'middle'},a),p);t.textContent=s;return t}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const svg=$('#dev');
function svgPt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
const komma=s=>s.replace('.',',').replace('-','−');

/* ================= Geometrie ================= */
const C={x:210,y:505},RK=92,RD=106,RL=134;
const POS=[
  {id:'off',a:0},{id:'ohm',a:28},{id:'dio',a:52},{id:'cap',a:76},{id:'hfe',a:100},{id:'hz',a:124},
  {id:'vac',a:-28},{id:'vdc',a:-52},{id:'ua',a:-76},{id:'ma',a:-100},{id:'a',a:-124}];
const POSID=POS.map(p=>p.id);
const posA=id=>POS.find(p=>p.id===id).a;
function polar(a,r){const t=a*Math.PI/180;return{x:C.x+r*Math.sin(t),y:C.y-r*Math.cos(t)}}
const SOCK={a10:{x:80,y:690},ua:{x:165,y:718},com:{x:255,y:718},v:{x:340,y:690}};
const PARK={red:{x:150,y:842},black:{x:270,y:842}};
const TP={lcd:{x:210,y:146},range:{x:93,y:279},hold:{x:93,y:325},light:{x:171,y:325}};
POS.forEach(p=>TP[p.id]=polar(p.a,RL));
for(const k in SOCK)TP['s_'+k]=SOCK[k];
const REDFOR={vdc:'v',vac:'v',ohm:'v',ua:'ua',ma:'ua',a:'a10'};
const CT={bp:{x:510,y:272},bm:{x:510,y:438},l1:{x:655,y:190},l2:{x:745,y:190},b1:{x:752,y:530},b2:{x:648,y:530}};
const NODE={bp:0,l1:0,l2:1,b1:1,b2:2,bm:2};
const PPARK={red:{x:610,y:640},black:{x:790,y:640}};
const RI=0.5,RS={v:10e6,ua:1,a10:0.02,com:0};
for(const k in CT)TP['c_'+k]=CT[k];

/* ================= Texte ================= */
const NOTNT='Das brauchst du in NaTech nicht.';
const INFO={
  lcd:{n:'LCD-Display',t:'Hier liest du den Messwert ab – immer Zahl und Einheit.'},
  range:{n:'Messbereich ändern',k:'RANGE',t:'Normalerweise wählt das Multimeter den Messbereich selbst (AUTO). Mit RANGE stellst du ihn von Hand ein.'},
  light:{n:'Licht',k:'LIGHT',t:'Schaltet die Beleuchtung der Anzeige ein und aus.'},
  hold:{n:'Messwert halten',k:'HOLD',t:'Hält den Messwert auf der Anzeige fest (H). So kannst du ihn in Ruhe aufschreiben. Nochmals drücken löst ihn wieder.'},
  vac:{n:'Spannung U in V – Wechselspannung',c:'Spannung <i>U</i> in V',cs:'Wechselspannung',t:'Misst Wechselspannung, z. B. am Ausgang ~ des Netzgeräts. Auf der Anzeige steht AC.'},
  vdc:{n:'Spannung U in V – Gleichspannung',c:'Spannung <i>U</i> in V',cs:'Gleichspannung',t:'Misst Gleichspannung, z. B. von einer Batterie. Auf der Anzeige steht DC.'},
  ua:{n:'Stromstärke I in µA',c:'Stromstärke <i>I</i> in µA',cs:'Gleich-/Wechselstrom',t:'Misst sehr kleine Stromstärken, bis 4000 µA. µA heisst Mikroampere (µ, sprich «mü»): 1 000 000 µA = 1 A. Das rote Kabel gehört in die Buchse <span class="lbl">µA mA</span>.'},
  ma:{n:'Stromstärke I in mA',c:'Stromstärke <i>I</i> in mA',cs:'Gleich-/Wechselstrom',t:'Misst kleine Stromstärken, bis 400 mA. mA heisst Milliampere: 1000 mA = 1 A. Das rote Kabel gehört in die Buchse <span class="lbl">µA mA</span>.'},
  a:{n:'Stromstärke I in A',c:'Stromstärke <i>I</i> in A',cs:'Gleich-/Wechselstrom',t:'Misst grosse Stromstärken, bis 10 A. Das rote Kabel gehört in die Buchse <span class="lbl">10A</span>.'},
  off:{n:'Ausschalter',k:'OFF',t:'Schaltet das Multimeter aus. Nach dem Messen immer auf OFF drehen – sonst ist die Batterie bald leer.'},
  ohm:{n:'Widerstand',k:'Ω',t:'Misst den Widerstand in Ohm (Ω). Nur messen, wenn keine Batterie angeschlossen ist.'},
  s_a10:{n:'Eingangsbuchse 10A',t:'Für grosse Stromstärken bis 10 A – hier kommt das rote Kabel hinein. Der Drehschalter steht dann auf A.'},
  s_ua:{n:'Eingangsbuchse µA/mA',t:'Für kleine Stromstärken – hier kommt das rote Kabel hinein. Der Drehschalter steht dann auf µA oder mA.'},

    S.drag={plug:pl.dataset.plug,start:svgPt(e),pt:svgPt(e),moved:false,kind:'plug'};return}
  const t=e.target.closest('[data-part]');if(!t)return;

function chipDrag(c){

      if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px'}
    };

      c.removeEventListener('pointermove',mv);c.removeEventListener('pointerup',up);c.removeEventListener('pointercancel',up);

    };

  });

function parseNum(s){
  s=s.trim().replace(/[−–]/g,'-').replace(/[’' ]/g,'');
  const m=s.match(/^(-?\d+(?:[.,]\d+)?)(.*)$/);if(!m)return{v:NaN};
  let rest=m[2].trim().replace(/^u/,'µ').replace(/ohm$/i,'Ω').replace(/^kOhm$/i,'kΩ').replace(/^MOhm$/i,'MΩ');
  return{v:parseFloat(m[1].replace(',','.')),u:UNITS[rest]?rest:null};
}
function s2check(){
  if(P2.state!=='ask')return;
  const T=P2.list[P2.i];const r=parseNum($('#num').value);
  if(r.u&&!P2.unit){P2.unit=r.u;P.querySelectorAll('#units .btn').forEach(x=>x.classList.toggle('sel',x.dataset.u===r.u))}
  if(isNaN(r.v)){fb('warn','Gib zuerst die Zahl ein, so wie sie auf der Anzeige steht.');return}
  if(!P2.unit){fb('warn','Wähle noch die Einheit.');return}
  P2.tries++;
  const dv=parseFloat(T.d),[eb,ef]=UNITS[T.u],[gb,gf]=UNITS[P2.unit];
  const eq=(a,b)=>Math.abs(a-b)<=1e-9*Math.max(1,Math.abs(a),Math.abs(b));
  const G=GROESSE[eb]+(eb==='V'?(T.pos==='vac'?' (Wechselspannung)':' (Gleichspannung)'):'');
  if(gb===eb&&eq(r.v*gf,dv*ef)){
    const s=komma(T.d)+' '+T.u;
    if(P2.unit===T.u)fb('ok',`<b>Richtig: ${s}</b><br>Gemessen wird eine ${G}.`);
    else fb('ok',`<b>Richtig umgerechnet!</b> Einfacher ist es, so abzulesen, wie es angezeigt wird: ${s}.<br>Gemessen wird eine ${G}.`);
    P2.res[P2.i]=P2.tries===1?'ok':'warn';
    s2done();P2.state='done';
    if(T.neg)s2zusatz();else s2next();
    return;
  }
  let m;
  if(eq(r.v,-dv))m='Fast! Schau genau auf das Vorzeichen links vor der Zahl.';
  else if(eq(r.v,dv)&&gb===eb)m=`Die Zahl stimmt. Aber schau genau, was rechts unten neben der Zahl steht.`;
  else if(eq(r.v,dv))m=`Die Zahl stimmt. Aber die Einheit passt nicht zur Messung – schau, wo der Drehschalter steht.`;
  else m='Die Zahl stimmt noch nicht. Lies alle Ziffern ab – auch den Dezimalpunkt und das Vorzeichen.';
  if(P2.tries>=3)m+=`<br>Lösung: <b>${komma(T.d)} ${T.u}</b>`;
  fb('bad',m);
  if(P2.tries>=3){P2.res[P2.i]='warn';s2done();P2.state='done';if(T.neg)s2zusatz();else s2next()}
}

function s3verdict(){

  if(d==='off')return['bad','Das Multimeter ist noch ausgeschaltet. Dreh den Schalter.'];

  if(q!==T.q)return['bad',`Du sollst eine ${QN[T.q]} messen. Der Schalter steht aber auf ${QN[q]}.`];
  let warn=null;
  if(q==='U'){
    if(T.ac&&d==='vdc')return['bad','Am Ausgang ~ des Netzgeräts kommt Wechselspannung. Wähle V mit der Welle ~.'];
    if(!T.ac&&d==='vac')return['bad','Eine Batterie liefert Gleichspannung. Wähle V mit den geraden Strichen.'];
  }

    if(c<n)return['bad',`Dieser Bereich ist zu klein für ${T.t.match(/\(etwa ([^)]*)\)/)[1]}. Die Sicherung würde auslösen. Wähle einen grösseren Bereich.`];
    if(c>n){const rr=T.r[d];
      warn=rr&&parseFloat(rr[0])===0?`Es funktioniert, aber die Anzeige zeigt nur ${komma(rr[0])} ${rr[1]} – viel zu ungenau. Besser: ${({ua:'µA',ma:'mA'})[T.n]}.`
                                    :`Es funktioniert, aber genauer misst du mit ${({ua:'µA',ma:'mA'})[T.n]}.`}
  }
  if(!r&&!b)return['bad','Stecke noch die beiden Kabel ein.'];
  if(b!=='com'){if(r==='com')return['bad',b?'Rot und Schwarz sind vertauscht. Das schwarze Kabel gehört immer in <span class="lbl">COM</span>.':'In COM gehört das schwarze Kabel, nicht das rote.'];
    return['bad','Das schwarze Kabel gehört immer in die Buchse <span class="lbl">COM</span>.']}
  if(!r)return['bad','Stecke noch das rote Kabel ein.'];
  const want=REDFOR[d];
  if(r!==want){
    let m=`Das rote Kabel steckt in ${SNAME[r]}. Für ${q==='I'?'diesen Strombereich':(q==='U'?'Spannung':'Widerstand')} gehört es in ${SNAME[want]}.`;
    if(q!=='I'&&(r==='ua'||r==='a10'))m+=' Achtung: Die Strombuchsen haben fast keinen Widerstand – so gäbe es einen Kurzschluss!';

/* ================= Stromkreis: Modell ================= */
function solveC(mg,ma,mb,src,inj){
  const G=[[0,0,0],[0,0,0],[0,0,0]],I=[0,0,0];
  const add=(a,b,g)=>{if(a===b)return;G[a][a]+=g;G[b][b]+=g;G[a][b]-=g;G[b][a]-=g};
  add(0,2,1/RI);if(src){I[0]+=S.circ.U0/RI;I[2]-=S.circ.U0/RI}
  add(0,1,1/S.circ.R);if(S.bridge)add(1,2,1000);
  if(mg>0&&ma!=null&&mb!=null)add(ma,mb,mg);
  if(inj){I[inj[0]]+=1;I[inj[1]]-=1}
  for(let i=0;i<3;i++)G[i][i]+=1e-9;
  const a=G[0][0],b=G[0][1],c=G[1][0],d=G[1][1],det=a*d-b*c;
  return[(I[0]*d-b*I[1])/det,(a*I[1]-c*I[0])/det,0];
}
function fx(x,n){const s=x.toFixed(n);return /^-0\.?0*$/.test(s)?s.slice(1):s}
function fmtV(v){const a=Math.abs(v);
  if(a<0.0005)return{d:'0.000',u:'V'};
  if(a<0.4)return{d:fx(v*1000,1),u:'mV'};
  return{d:a<4?fx(v,3):a<40?fx(v,2):a<400?fx(v,1):fx(v,0),u:'V'}}
function fmtI(I,r){
  if(r==='ua'){const x=I*1e6,a=Math.abs(x);if(a>=4000)return{d:' OL ',u:'µA'};return{d:a<400?fx(x,1):fx(x,0),u:'µA'}}
  if(r==='ma'){const x=I*1e3,a=Math.abs(x);if(a>=400)return{d:' OL ',u:'mA'};return{d:a<40?fx(x,2):fx(x,1),u:'mA'}}
  const a=Math.abs(I);if(a>=10)return{d:' OL ',u:'A'};return{d:fx(I,2),u:'A'}}
function fmtR(R){if(R>40e6)return{d:' OL ',u:'MΩ'};if(R<400)return{d:fx(R,1),u:'Ω'};if(R<4e5)return{d:fx(R/1000,R<4000?3:R<4e4?2:1),u:'kΩ'};return{d:fx(R/1e6,3),u:'MΩ'}}
function simUpdate(){
  const r=S.plugs.red,b=S.plugs.black,pr=S.probes.red,pb=S.probes.black;
  const conn=!!(r&&b&&pr&&pb);
  const nr=conn?NODE[pr]:null,nb=conn?NODE[pb]:null;
  let Rm=conn?RS[r]+RS[b]:Infinity,fuse=false;
  const on=conn&&nr!==nb;
  let V=solveC(on?1/Rm:0,nr,nb,true);
  let Im=on?(V[nr]-V[nb])/Rm:0;
  if(on&&(r==='ua'||b==='ua')&&Math.abs(Im)>0.4){fuse=true;V=solveC(0,nr,nb,true);Im=0}
  const Vm=conn?V[nr]-V[nb]:0;
  const Inom=S.circ.U0/(S.circ.R+RI),Pn=Inom*Inom*S.circ.R;
  const Ib=(S.circ.U0-(V[0]-V[2]))/RI;
  S.sim={V,Im,Vm,fuse,lamp:(V[0]-V[1])**2/S.circ.R/Pn,Ib,conn,nr,nb};
  if(!(S.hold&&S.lcd))S.lcd=meterDisplay();
  renderLCD();drawCircuit();
}
function meterDisplay(){
  const d=S.dial,s=S.sim,r=S.plugs.red,b=S.plugs.black;
  if(d==='off')return null;
  const dir=k=>s.conn&&r===k&&b==='com'?1:(s.conn&&b===k&&r==='com'?-1:0);
  if(d==='vdc')return Object.assign(fmtV(dir('v')*s.Vm),{i:'DC'});
  if(d==='vac')return{d:'0.000',u:'V',i:'AC'};
  if(d==='ua'||d==='ma')return Object.assign(fmtI(dir('ua')*s.Im,d),{i:'DC'});
  if(d==='a')return Object.assign(fmtI(dir('a10')*s.Im,'a'),{i:'DC'});
  if(d==='ohm'){
    if(!dir('v')||s.nr===s.nb)return dir('v')&&s.nr===s.nb?{d:'0.0',u:'Ω'}:{d:' OL ',u:'MΩ'};
    if(Math.abs(s.Vm)>0.05)return{d:' OL ',u:'MΩ'};
    const Vt=solveC(0,null,null,false,[s.nr,s.nb]);return fmtR(Vt[s.nr]-Vt[s.nb]);
  }
  return IDLE[d];
}

    return['bad','Das schwarze Kabel gehört immer in die Buchse <span class="lbl">COM</span>.']}
  if(!r)return['bad','Stecke noch das rote Kabel ein.'];
  if(r!==REDFOR[d]){let m=`Das rote Kabel steckt in ${SNAME[r]}. Für ${q==='I'?'diesen Strombereich':'Spannung'} gehört es in ${SNAME[REDFOR[d]]}.`;
    if(s.fuse)m+=' Die Sicherung hat ausgelöst!';return['bad',m]}
  if(!S.probes.red||!S.probes.black)return['bad','Halte beide Messspitzen an den Stromkreis.'];
  if(s.nr===s.nb)return['bad','Beide Messspitzen berühren denselben Draht. Dazwischen gibt es keine Spannung und keinen Strom zu messen.'];
  const v=reading();
  if(T.q==='U'){
    const want=T.el==='batt'?[0,2]:[0,1];
    if(!sameSet(s.nr,s.nb,want[0],want[1]))return['bad',`Die Messspitzen müssen an die beiden Anschlüsse ${T.el==='batt'?'der Batterie':'des Lämpchens'}.`];
    if(T.el==='lamp'&&!S.bridge)return['bad','Der Stromkreis ist offen, das Lämpchen ist dunkel. Stecke das Verbindungskabel wieder ein.'];
    if(v<0)return['bad','Die Anzeige ist negativ: Die Messspitzen sind vertauscht. Rot gehört auf die Seite des Plus-Pols.'];
    return['ok',`Richtig gemessen: ${komma(S.lcd.d)} ${S.lcd.u}`,`Das Multimeter ist parallel geschaltet.<br><span class="sub">Warum nicht genau ${komma(String(S.circ.U0))} V? Sobald Strom fliesst, liefert eine Batterie etwas weniger Spannung als aufgedruckt.</span>`];
  }
  if(S.bridge)return['bad',sameSet(s.nr,s.nb,1,2)?'Der Stromkreis ist noch geschlossen: Der Strom fliesst durch das Verbindungskabel statt durch das Multimeter. Öffne den Stromkreis.'
                                               :'Das Multimeter ist parallel geschaltet – das gibt einen Kurzschluss! Für die Stromstärke: Stromkreis öffnen und die Messspitzen an die beiden Enden der Lücke.'];
  if(!sameSet(s.nr,s.nb,1,2))return['bad','Das Multimeter ist parallel geschaltet – das gibt einen Kurzschluss! Die Messspitzen gehören an die beiden Enden der Lücke.'];
  if(d==='ua')return['bad','Die Anzeige zeigt OL: Der Bereich µA ist zu klein. Wähle mA.'];
  if(v<0)return['bad','Die Anzeige ist negativ: Die Messspitzen sind vertauscht. Rot gehört auf die Seite, von der der Strom kommt (Plus-Pol über das Lämpchen).'];
  if(d==='a')return['warn',`Gemessen: ${komma(S.lcd.d)} ${S.lcd.u}. Es funktioniert, aber mit mA misst du genauer.`,'Das Multimeter ist in Serie geschaltet.'];
  return['ok',`Richtig gemessen: ${komma(S.lcd.d)} ${S.lcd.u}`,'Das Multimeter ist in Serie geschaltet.'];
}
function s4check(){
  if(P4.state!=='ask')return;P4.tries++;
  const [k,m,x]=s4verdict();
  if(k==='bad'){fb('bad',m);return}
  fb(k,`<b>${m}</b>${x?'<br>'+x:''}`);
  P4.res[P4.i]=(P4.tries===1&&k==='ok')?'ok':'warn';P4.state='done';
  $('#chk').parentElement.style.display='none';$('#hint4').style.display='none';H={};S.selPlug=null;S.selProbe=null;svg.classList.add('inert');drawCables();drawCircuit();
  $('#aft').innerHTML=`<button class="btn pri" id="nx">Weiter</button>`;$('#nx').onclick=()=>{P4.i++;s4task()};
}

/* ================= Stufe 5: Fehler finden ================= */
function diagnose(){
  const s=S.sim,r=S.plugs.red,b=S.plugs.black,d=S.dial,out=[];
  if(S.note){out.push(['info',S.note]);S.note=null}
  if(S.hold)out.push(['warn','<b>HOLD</b> ist an: Die Anzeige bleibt stehen, auch wenn sich etwas ändert. Nochmals HOLD drücken löst sie.']);
  out.push(['info',`Das Lämpchen ${s.lamp>0.6?'leuchtet':s.lamp>0.03?'leuchtet schwach':'ist dunkel'}.`]);
  if(s.Ib>2)out.push(['bad','<b>Kurzschluss!</b> Sehr viel Strom fliesst durch die Batterie – sie wird heiss.']);
  if(s.fuse)out.push(['bad','<b>Sicherung ausgelöst:</b> Durch die Buchse <span class="lbl">µA mA</span> floss zu viel Strom.']);
  const series=s.conn&&!S.bridge&&sameSet(s.nr,s.nb,1,2);
  if(!S.bridge&&!series)out.push(['info','Der Stromkreis ist offen.']);
  if(d==='off'){out.push(['info','Das Multimeter ist ausgeschaltet.']);return out}
  if(!r||!b){out.push(['info','Stecke beide Kabel ins Multimeter.']);return out}
  if(!s.conn){out.push(['info','Halte beide Messspitzen an den Stromkreis.']);return out}
  const lowR=RS[r]+RS[b]<100;
  if(s.nr===s.nb)out.push(['warn','Beide Messspitzen berühren denselben Draht – dazwischen gibt es nichts zu messen.']);
  else if(lowR){
    if(series)out.push(['ok','Das Multimeter ist <b>in Serie</b>: Der ganze Strom fliesst hindurch. So misst man die Stromstärke.']);
    else if(S.bridge&&sameSet(s.nr,s.nb,1,2))out.push(['warn','Das Multimeter ist parallel zum Verbindungskabel: Der Strom fliesst fast ganz durch das Kabel.']);
    else out.push(['bad','Das Multimeter ist über eine Strombuchse <b>parallel</b> geschaltet. Es hat fast keinen Widerstand – das gibt einen Kurzschluss.']);
  }else{
    if(series)out.push(['warn','Das Multimeter ist über die Buchse <span class="lbl">VΩHz</span> <b>in Serie</b>. Es lässt fast keinen Strom durch – das Lämpchen bleibt dunkel.']);
    else out.push(['ok','Das Multimeter ist <b>parallel</b> geschaltet. So misst man die Spannung.']);
  }
  const q=QOF[d],cur=r==='com'?b:r;
  if((q==='U'||q==='R')&&lowR)out.push(['warn',`Der Schalter steht auf ${QN[q]}, aber ein Kabel steckt in einer Strombuchse. Die Anzeige bleibt bei 0.`]);
  if(q==='I'&&!lowR)out.push(['warn','Der Schalter steht auf Stromstärke, aber das Kabel steckt in <span class="lbl">VΩHz</span>. Die Anzeige bleibt bei 0.']);
  else if(q==='I'&&REDFOR[d]!==cur)out.push(['warn','Schalter und Strombuchse passen nicht zusammen.']);
  if(d==='vac')out.push(['warn','Der Schalter steht auf Wechselspannung (V~). Eine Batterie liefert Gleichspannung.']);
  if(!q)out.push(['info','Diese Schalterstellung brauchst du in NaTech nicht.']);
  if(S.lcd&&S.lcd.d.trim()==='OL'&&q==='I')out.push(['warn','OL: Der Messwert ist zu gross für diesen Bereich.']);
  if(r==='com')out.push(['warn','Rot steckt in <span class="lbl">COM</span>: Die Kabel sind am Multimeter vertauscht.']);
  else if(S.lcd&&S.lcd.d.trim().startsWith('-'))out.push(['info','Minuszeichen: Die Messspitzen sind vertauscht. Rot gehört auf die Seite des Plus-Pols.']);
  return out;
}

function s5auf(){if(!P5.list)Object.assign(P5,{list:shuffle(P5POOL),i:0,res:Array(P5POOL.length).fill('')});s5task()}

/* ================= Stufen-Navigation ================= */
const STAGES=[{n:1,k:'kennenlernen',t:'Kennenlernen'},{n:2,k:'ablesen',t:'Ablesen'},{n:3,k:'einstellen',t:'Einstellen'},
  {n:4,k:'messen',t:'Messen'},{n:5,k:'fehler',t:'Fehler finden'}];
function buildTabs(){
  $('#stages').innerHTML=STAGES.map(s=>`<button class="stg" data-n="${s.n}" ${s.off?'disabled title="folgt"':''}><span class="n">${s.n}</span><span class="t">${s.t}</span></button>`).join('');
  $('#stages').querySelectorAll('.stg').forEach(b=>b.onclick=()=>setStage(+b.dataset.n));
}
function setStage(n){
  S.stage=n;
  $('#stages').querySelectorAll('.stg').forEach(b=>b.classList.toggle('on',+b.dataset.n===n));
  const st=STAGES[n-1];try{history.replaceState(null,'','#'+n+'-'+st.k)}catch(e){}
  enterStage();
}
function enterStage(){
  document.body.classList.toggle('wide',S.stage>=4);
  svg.setAttribute('viewBox',S.stage>=4?'0 0 920 890':(S.stage===3?'0 0 420 890':'0 0 420 800'));
  ANIM++;H={};svg.classList.remove('inert');
  const m=S.mode[S.stage];
  if(m==='auf')({1:()=>P1.order=null,2:()=>P2.list=null,3:()=>P3.list=null,4:()=>s4new(),5:()=>P5.list=null})[S.stage]();
  resetDevice();
  ({1:{erk:s1erk,auf:s1auf},2:{erk:s2erk,auf:s2auf},3:{erk:s3erk,auf:s3auf},4:{erk:s4erk,auf:s4auf},5:{erk:s5erk,auf:s5auf}})[S.stage][m]();
}
function stageFromHash(){
  const h=decodeURIComponent(location.hash.slice(1)).toLowerCase();if(!h)return 1;
  const n=parseInt(h,10);if(n>=1&&n<=5)return n;
  const s=STAGES.find(s=>!s.off&&h.includes(s.k));return s?s.n:1;
}
