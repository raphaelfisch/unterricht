<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U, I, R – Ohmsches Gesetz</title>
<style>
:root{
  color-scheme: light;
  --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#dfe3ea;
  --accent:#2f6fde; --accent-soft:#e6eefc;
  --ok:#1f9d55; --ok-soft:#e3f6ea; --bad:#d64545; --bad-soft:#fde8e8;
  --tri:#f4846a; --tri-dark:#c9573d; --tri-soft:#fde3da;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}

/* ---------- Kopfzeile ---------- */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .title{font-size:15px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;background:#eef0f4;padding:4px;border-radius:999px}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-size:15px;font-weight:600;color:#4b5563;white-space:nowrap}
.tabs button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tools{display:flex;justify-content:flex-end;gap:8px;align-items:center}
/* Zurück zur Übersicht – gleiche Stelle wie in den anderen Werkzeugen */
.heimbtn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line);background:#fff;color:inherit;text-decoration:none;font-size:15px;font-weight:600}
.heimbtn:hover{background:#f3f4f6}
.heimbtn svg{width:18px;height:18px;display:block;flex:none}
@media (max-width:860px){.heimbtn span{display:none}.heimbtn{padding:0;width:40px;justify-content:center}}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:700;display:grid;place-items:center}
.iconbtn:hover{background:#f3f4f6}

main{max-width:1100px;margin:0 auto;padding:22px 18px 40px}
section[hidden]{display:none!important}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;min-height:36px}
.task{font-size:24px;font-weight:700;line-height:1.3;margin:0}
.sub{color:var(--muted);font-size:15px;margin:4px 0 0}
.score{font-size:14px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;background:#eef0f4;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:#4b5563}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px 18px;font-size:17px;font-weight:600;min-height:48px}
.btn:hover:not(:disabled){background:#f3f4f6}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:#255fc4}
.btn:disabled{opacity:.38}
.btn.ok{background:var(--ok-soft);border-color:var(--ok);color:#156b3a}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:#a12f2f}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

.fb{min-height:28px;font-size:17px;line-height:1.45;margin-top:14px}
.fb.ok{color:#156b3a}.fb.bad{color:#a12f2f}
.fb b{font-weight:700}

/* Formeln */
.f{font-style:italic;font-weight:700;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;white-space:nowrap;display:inline-flex;align-items:center;gap:.28em}
.f .n{font-style:normal;font-weight:500}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05}
.frac>span{padding:0 .2em}
.frac>span:first-child{border-bottom:.09em solid currentColor;padding-bottom:.04em}

/* ---------- 1 Ordnen ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gh{font-size:14px;font-weight:700;color:var(--muted);text-align:center;padding:2px 4px 4px;display:flex;align-items:center;justify-content:center;line-height:1.25}
.cell{min-height:70px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.cell.given{background:#2b3446;color:#fff}
.slot{border:2px dashed #c4cad6;background:#fafbfc;transition:background .15s,border-color .15s}
.slot.target{border-color:var(--accent);background:var(--accent-soft)}
.slot.okm{border:2px solid var(--ok);background:var(--ok-soft)}
.slot.badm{border:2px solid var(--bad);background:var(--bad-soft)}
.pool{margin-top:18px;min-height:86px;padding:12px;border-radius:12px;background:#eef0f4;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.pool.target{outline:2px dashed var(--accent)}
.card{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border:1px solid #cfd5df;border-radius:10px;
  min-width:64px;padding:12px 16px;font-size:21px;font-weight:700;text-align:center;box-shadow:0 2px 0 #cfd5df;cursor:grab}
.slot .card{box-shadow:none;border-color:transparent;background:transparent;padding:8px 10px}
.card.sel{outline:3px solid var(--accent);outline-offset:2px}
.ghost{position:fixed;pointer-events:none;z-index:100;transform:translate(-50%,-50%) scale(1.06);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.ordfoot{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.merk{margin-top:18px;border-left:5px solid var(--ok);background:#fff}
.merk h3{margin:0 0 10px;font-size:18px}
.example{display:flex;align-items:flex-start;gap:28px;flex-wrap:wrap}
.ex-big{font-size:46px;font-weight:700;letter-spacing:.02em}
.ex-big .a{color:var(--accent)} .ex-big .b{color:#b4541f}
.ex-legend{font-size:16px;line-height:1.6}
.ex-legend .a{color:var(--accent);font-weight:700}.ex-legend .b{color:#b4541f;font-weight:700}
.summary{width:100%;border-collapse:collapse;margin-top:14px;font-size:17px}
.summary th,.summary td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:center;vertical-align:middle}
.summary th{font-size:13px;color:var(--muted);text-transform:none}

/* ---------- 2 Quiz ---------- */
.dots{display:flex;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;background:#d6dbe4}
.dot.cur{background:var(--accent)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.stmt{font-size:44px;font-weight:700;text-align:center;padding:18px 0 6px;letter-spacing:.03em}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:18px}
.opts .btn{font-size:20px;min-height:58px}
.qfoot{display:flex;justify-content:flex-end;margin-top:10px}
.result{text-align:center;padding:30px 10px}
.result .big{font-size:56px;font-weight:800}

/* ---------- 3 Dreieck ---------- */
.trilayout{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:26px;align-items:center}
.tri svg{width:100%;height:auto;display:block;touch-action:manipulation}
.tri .hit{cursor:pointer}
.tri .ring{opacity:0;transition:opacity .15s}
@media (hover:hover){.tri .hit:hover .ring{opacity:.9}}
.tri .hit.covered .ring{opacity:0!important}
.tri .cover{transform-box:fill-box;transform-origin:center;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
/* Feste Höhen: Eine Formel mit Bruchstrich ist doppelt so hoch wie eine
   ohne. Ohne feste Höhe wandert deshalb bei jedem Antippen die halbe
   Seite – und das Dreieck daneben gleich mit. */
.formula-out{font-size:52px;height:176px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.formula-out{flex-direction:column;gap:6px}
.formula-out .fline{height:120px;display:flex;align-items:center;justify-content:center}
.formula-out.empty{font-size:18px;color:var(--muted);font-style:normal}
.formula-out .units{font-size:17px;color:var(--muted);font-weight:500}
.formula-out .units b{color:#374151}
.rule{margin-top:16px;display:grid;grid-template-columns:76px 1fr;align-items:center;gap:10px 14px;font-size:17px;color:#374151}
.rule .rf{height:58px;border-radius:10px;background:var(--tri-soft);display:flex;align-items:center;justify-content:center;
  color:var(--tri-dark);font-weight:700;font-style:italic;font-size:22px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.rule .rx{display:inline-flex;align-items:center;gap:6px;padding-right:2px}
.rule .dotm{font-style:normal}
.rule .rfrac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;font-size:19px}
.rule .rfrac>span{padding:0 6px 0 4px}
.rule .rfrac>span:first-child{border-bottom:2.5px solid currentColor;padding-bottom:1px}
/* Immer drei gleich breite und gleich hohe Kästchen – egal ob in der
   Formel ein Bruchstrich steht oder nicht. */
.fopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.fopts .btn{font-size:28px;height:92px;min-height:0;padding:6px;display:flex;align-items:center;justify-content:center}
@media (max-width:640px){.fopts{grid-template-columns:1fr}.fopts .btn{height:80px}}
/* Platz für die Frage (bis zwei Zeilen) und die Rückmeldung (bis drei),
   damit beim Weiterklicken nichts wandert. */
#dreieck #triTask{min-height:2.6em}   /* zwei Zeilen */
#dreieck #triExpl{min-height:2.9em}   /* zwei Zeilen */
#dreieck #triFb{min-height:5.8em}     /* vier Zeilen */
@media (max-width:820px){#dreieck #triTask{min-height:3.9em}}
/* Auf schmalen Geräten darf die Frage nicht neben dem Umschalter
   eingeklemmt werden – sonst wird sie bis zu neunzeilig. Der Umschalter
   rückt eine Zeile tiefer, die Frage bekommt die ganze Breite. */
@media (max-width:700px){
  .bar{flex-wrap:wrap}
  .bar>div:first-child,.bar>.task{flex:1 1 100%}
  #dreieck #triTask{min-height:3.9em}
}
@media (max-width:360px){#dreieck #triFb{min-height:7.25em}}
.helpTri{display:flex;align-items:center;gap:10px;margin-top:6px}
.minitri{width:200px;margin:10px auto 0}

/* ---------- 4 Rechnen ---------- */
.story{font-size:22px;line-height:1.5;font-weight:600}
.story .val{background:#fff3c4;border-radius:6px;padding:1px 6px;white-space:nowrap}
.story .val.done{background:#e6eefc}
.calc{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.3fr);gap:18px;margin-top:18px}
.notes{background:#fafbfc;border:1px solid var(--line);border-radius:var(--r);padding:6px 18px;font-size:21px}
.notes .row{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.notes .row:first-child{border-top:0}
.notes .lbl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.notes .val2{display:flex;flex-direction:column;gap:6px;min-height:30px;justify-content:center}
.notes .ph{color:#b8bec9}
.notes .ln{display:flex;align-items:center;gap:8px}
.notes .row.active{background:var(--accent-soft);margin:0 -18px;padding:12px 18px;border-top-color:transparent}
.notes .row.active+.row{border-top-color:transparent}
.notes .res{color:var(--ok);font-weight:700}
.notes .ucheck{font-size:15px;color:var(--muted)}
.now h3{margin:0 0 12px;font-size:20px}
.now .btns{display:flex;gap:10px;flex-wrap:wrap}
.now .btns .btn{min-width:72px;font-size:24px}
.resrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:26px;font-weight:700}
.resrow input{width:130px;font:inherit;font-size:24px;padding:8px 10px;border:2px solid #c4cad6;border-radius:10px;text-align:right}
.resrow input:focus{outline:none;border-color:var(--accent)}
.unitbtns{display:flex;gap:6px}
.unitbtns .btn{min-width:56px;font-size:22px;padding:8px 12px}
.unitbtns .btn.on{background:var(--accent-soft);border-color:var(--accent)}
.stepinfo{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}

/* ---------- 5 Je – desto ---------- */
.jd-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 4px}
.jd-card{border:2px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;background:#fff}
.jd-card .L{font:italic 700 44px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.jd-card .B{font-size:14px;color:var(--muted);margin-top:2px}
.jd-card .S{margin-top:10px;font-size:18px;font-weight:700;min-height:26px}
.jd-card.target{border-color:var(--accent);background:var(--accent-soft)}
.up{color:#1f7a4d}.down{color:#b4541f}.eq{color:var(--muted)}
.jd-ex{margin-top:10px;font-size:16px;color:#374151;line-height:1.7}
.jd-ex .k{display:inline-block;width:86px;color:var(--muted)}
#jPanel .opts.five{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
#jPanel .opts.five .btn{font-size:17px;padding:10px 8px}

/* ---------- Hilfe ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,25,35,.45);display:grid;place-items:center;z-index:50;padding:16px}
.overlay[hidden]{display:none}
.dialog{background:#fff;border-radius:16px;max-width:620px;width:100%;padding:22px 24px;max-height:85vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog h2{margin:0 0 10px;font-size:21px}
.dialog p,.dialog li{font-size:16px;line-height:1.55}
.dialog .close{float:right}

/* Schmaler Bildschirm: Reiter auf eine eigene Zeile unter den Titel –
   gleiche Lösung wie im Multimeter, sonst wird «Je – desto» abgeschnitten. */
@media (max-width:820px){
  .top{grid-template-columns:1fr auto;padding:6px 10px}
  .tools{grid-column:2;grid-row:1}
  .tabs{grid-column:1 / -1;grid-row:2;justify-self:stretch;width:100%}
  .tabs button{flex:1 1 0;min-width:0;padding:8px 6px;font-size:14px;line-height:1.15}
  .trilayout,.calc{grid-template-columns:1fr}
  .grid{gap:6px}.cell{font-size:17px;min-height:58px}
  .card{font-size:17px;padding:10px 10px;min-width:48px}
  .gh{font-size:12px}
  .task{font-size:20px}
}
@media (max-width:560px){
  .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
  .tabs button{padding:8px 2px;font-size:13px}
  /* «Stromstärke» und «Widerstand» sind breiter als eine Spalte –
     auf dem Handy umbrechen statt abschneiden. */
  .grid .card,.grid .cell{white-space:normal;overflow-wrap:anywhere;text-align:center;line-height:1.15;font-size:15px}
}
@media (max-width:420px){
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* Auf sehr schmalen Geräten dürfen die vier Spalten nicht über den
     Rand hinauslaufen – lieber kleinere Karten als abgeschnittene. */
  main{padding:14px 8px 28px}
  .grid{gap:4px}
  .cell,.card{font-size:15px;min-width:0;padding:8px 4px}
  .cell{min-height:52px}
}
/* Handy: Reiter auf Fingergrösse. */
@media (max-width:640px){.tabs button{min-height:44px}}
/* Handy: auch die Kopfknöpfe auf Fingergrösse. */
@media (max-width:640px){.iconbtn{width:44px;height:44px}.heimbtn{height:44px;width:44px}}
</style>
</head>
<body>

<header class="top">
  <div class="title" title="Stand 27.10.2026">U · I · R und das Ohmsche Gesetz</div>
  <nav class="tabs" id="tabs">
    <button data-tab="ordnen" class="active">Ordnen</button>
    <button data-tab="quiz">Was ist was?</button>
    <button data-tab="dreieck">Dreieck</button>
    <button data-tab="rechnen">Rechnen</button>
    <button data-tab="jedesto">Je – desto</button>
  </nav>
  <div class="tools">
    <a class="heimbtn" href="index.html" title="Zur Übersicht" aria-label="Zur Übersicht"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.65 12 2.45l9 7.2"/><path d="M5.6 8.45v10h12.8v-10"/><path d="M9.9 18.45v-5.2h4.2v5.2"/></svg><span>Übersicht</span></a>
    <button class="iconbtn" id="btnFull" title="Vollbild">⛶</button>
    <button class="iconbtn" id="btnHelp" title="Hilfe">?</button>
  </div>
</header>

<main>
  <!-- ============ 1 ORDNEN ============ -->
  <section id="ordnen">
    <div class="bar">
      <div>
        <p class="task" id="ordTask">Ordne die Karten in die richtige Zeile und Spalte.</p>
        <p class="sub">Ziehe eine Karte in ein Feld – oder tippe zuerst die Karte, dann das Feld an.</p>
      </div>
      <span class="score" id="ordScore"></span>
    </div>
    <div class="panel">
      <div class="grid" id="ordGrid"></div>
      <div class="pool" id="ordPool"></div>
      <div class="ordfoot">
        <button class="btn primary" id="ordCheck" disabled>Prüfen</button>
        <button class="btn primary" id="ordNext" hidden>Neue Runde</button>
        <div class="fb" id="ordFb" style="margin:0"></div>
      </div>
    </div>
    <div class="panel merk" id="ordMerk" hidden></div>
  </section>

  <!-- ============ 2 QUIZ ============ -->
  <section id="quiz" hidden>
    <div class="bar">
      <div class="dots" id="qDots"></div>
      <span class="score" id="qScore"></span>
    </div>
    <div class="panel" id="qPanel"></div>
  </section>

  <!-- ============ 3 DREIECK ============ -->
  <section id="dreieck" hidden>
    <div class="bar">
      <div>
        <p class="task" id="triTask"></p>
        <p class="sub" id="triSub"></p>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="score" id="triScore"></span>
        <div class="seg" id="triMode">
          <button data-m="erkunden" class="on">Erkunden</button>
          <button data-m="ueben">Üben</button>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="trilayout">
        <div class="tri" id="triBox"></div>
        <div id="triRight"></div>
      </div>
    </div>
  </section>

  <!-- ============ 4 RECHNEN ============ -->
  <section id="rechnen" hidden>
    <div class="bar">
      <span class="score" id="cScore"></span>
      <div class="seg" id="cLevel">
        <button data-l="1" class="on">Ganze Zahlen</button>
        <button data-l="2">Mit Dezimalzahlen</button>
      </div>
    </div>
    <div class="panel">
      <div class="story" id="cStory"></div>
      <div class="calc">
        <div class="notes" id="cNotes"></div>
        <div class="now" id="cNow"></div>
      </div>
    </div>
  </section>
  <!-- ============ 5 JE – DESTO ============ -->
  <section id="jedesto" hidden>
    <div class="bar">
      <div class="dots" id="jDots"></div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="score" id="jScore"></span>
        <div class="seg" id="jLevel">
          <button data-l="1" class="on">Grösser oder kleiner?</button>
          <button data-l="2">Wie viel mal?</button>
        </div>
      </div>
    </div>
    <div class="panel" id="jPanel"></div>
  </section>
</main>

<div class="overlay" id="help" hidden>
  <div class="dialog">
    <button class="iconbtn close" id="helpClose" title="Schliessen">✕</button>
    <div id="helpBody"></div>
  </div>
</div>

<script>
/* =========================================================
   Daten
   ========================================================= */
const Q = {
  U:{k:'U', begriff:'Spannung',    art:'die', zeichen:'U', einheit:'Volt',   ez:'V', geraet:'Voltmeter'},
  I:{k:'I', begriff:'Stromstärke', art:'die', zeichen:'I', einheit:'Ampere', ez:'A', geraet:'Amperemeter'},
  R:{k:'R', begriff:'Widerstand',  art:'der', zeichen:'R', einheit:'Ohm',    ez:'Ω', geraet:null}
};
const KEYS = ['U','I','R'];
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const fmt = n => String(Math.round(n*1000)/1000);           // Dezimalpunkt
const $ = id => document.getElementById(id);

/* Formeln als Struktur {l, op:'mul'|'div', a, b} */
const CORRECT = { U:{l:'U',op:'mul',a:'R',b:'I'}, I:{l:'I',op:'div',a:'U',b:'R'}, R:{l:'R',op:'div',a:'U',b:'I'} };
const WRONG = {
  U:[{l:'U',op:'div',a:'R',b:'I'},{l:'U',op:'div',a:'I',b:'R'}],
  I:[{l:'I',op:'mul',a:'U',b:'R'},{l:'I',op:'div',a:'R',b:'U'}],
  R:[{l:'R',op:'mul',a:'U',b:'I'},{l:'R',op:'div',a:'I',b:'U'}]
};
const frac = (a,b) => `<span class="frac"><span>${a}</span><span>${b}</span></span>`;
function fHTML(f){
  const rhs = f.op==='mul' ? `${f.a} <span class="n">·</span> ${f.b}` : frac(f.a,f.b);
  return `<span class="f">${f.l} <span class="n">=</span> ${rhs}</span>`;
}
const unitLine = k => { const f = CORRECT[k], e = x => Q[x].ez;
  return `${e(f.l)} = ${e(f.a)} ${f.op==='mul'?'·':':'} ${e(f.b)}`; };
const sameF = (x,y) => x.l===y.l && x.op===y.op && x.a===y.a && x.b===y.b;

/* ---- Direktlinks: …#4-rechnen öffnet gleich den vierten Teil ----------
   replaceState statt location.hash – sonst sammelt der Zurück-Knopf
   jeden Reiterwechsel als eigenen Schritt. */
const TEILE = ['ordnen','quiz','dreieck','rechnen','jedesto'];
const KUERZEL = ['ordnen','wasistwas','dreieck','rechnen','jedesto'];
let stumm = false;
function adresse(){
  if (stumm) return;
  const i = TEILE.indexOf(curTab);
  if (i < 0) return;
  const h = '#' + (i+1) + '-' + KUERZEL[i];
  // In einer Vorschau (eingebettete Seite) darf die Adresse nicht geändert
  // werden – das Werkzeug soll deswegen nicht stehen bleiben.
  if (location.hash !== h) { try { history.replaceState(null, '', h); } catch (e) {} }
}
function ausAdresse(){
  const m = /^#?(\d)/.exec(location.hash || '');
  if (!m) return false;
  const i = Number(m[1]) - 1;
  if (i < 0 || i >= TEILE.length) return false;
  stumm = true; showTab(TEILE[i]); stumm = false; adresse();
  return true;
}
window.addEventListener('hashchange', ausAdresse);

/* =========================================================
   1  ORDNEN
   ========================================================= */
const COLS = [
  {c:'begriff', l:'Grösse'},
  {c:'zeichen', l:'Formelzeichen'},
  {c:'einheit', l:'Einheit'},
  {c:'ez',      l:'Abkürzung für die Einheit'}
];
const ANCHOR_SEQ = [0,1,3,2];
const ord = { round:0, anchor:0, rows:[], cards:[], placed:{}, marks:{}, sel:null, done:false, solved:0 };

function ordNew(){
  ord.anchor = ANCHOR_SEQ[ord.round % ANCHOR_SEQ.length];
  ord.rows = shuffle(KEYS);
  ord.cards = [];
  KEYS.forEach(k => COLS.forEach((col,ci) => {
    if (ci!==ord.anchor) ord.cards.push({id:k+'_'+col.c, k, c:col.c, text:Q[k][col.c]});
  }));
  ord.cards = shuffle(ord.cards);
  ord.placed = {}; ord.marks = {}; ord.sel = null; ord.done = false;
  $('ordFb').textContent = ''; $('ordFb').className='fb';
  $('ordMerk').hidden = true; $('ordNext').hidden = true; $('ordCheck').hidden = false;
  $('ordTask').textContent = `Gegeben ist die Spalte «${COLS[ord.anchor].l}». Ordne die übrigen Karten zu.`;
  ordRender();
}
const slotId = (k,c) => k+'|'+c;
const cardById = id => ord.cards.find(c => c.id===id);
const slotOf = id => Object.keys(ord.placed).find(s => ord.placed[s]===id);

function ordRender(){
  const g = $('ordGrid'); g.innerHTML='';
  COLS.forEach(col => { const h=document.createElement('div'); h.className='gh'; h.textContent=col.l; g.appendChild(h); });
  ord.rows.forEach(k => COLS.forEach((col,ci) => {
    const d = document.createElement('div');
    if (ci===ord.anchor){ d.className='cell given'; d.textContent = Q[k][col.c]; }
    else{
      const s = slotId(k,col.c);
      d.className = 'cell slot' + (ord.marks[s]==='ok'?' okm':ord.marks[s]==='bad'?' badm':'');
      d.dataset.slot = s;
      if (ord.placed[s]) d.appendChild(makeCard(cardById(ord.placed[s])));
      d.onclick = e => { if (e.target.closest('.card')) return; if (ord.sel && !ord.done){ ordPlace(ord.sel, s); } };
    }
    g.appendChild(d);
  }));
  const p = $('ordPool'); p.innerHTML='';
  ord.cards.filter(c => !slotOf(c.id)).forEach(c => p.appendChild(makeCard(c)));
  p.onclick = e => { if (e.target.closest('.card')) return; if (ord.sel && slotOf(ord.sel)) ordUnplace(ord.sel); };
  $('ordCheck').disabled = Object.keys(ord.placed).length < ord.cards.length || ord.done;
  $('ordScore').textContent = ord.solved ? `Gelöste Runden: ${ord.solved}` : '';
}
function makeCard(c){
  const el = document.createElement('div');
  el.className = 'card' + (ord.sel===c.id?' sel':'');
  el.textContent = c.text; el.dataset.id = c.id;
  el.addEventListener('pointerdown', cardDown);
  return el;
}
function ordPlace(id, s){
  const prev = slotOf(id); if (prev){ delete ord.placed[prev]; delete ord.marks[prev]; }
  ord.placed[s] = id; delete ord.marks[s];
  ord.sel = null; $('ordFb').textContent=''; ordRender();
}
function ordUnplace(id){
  const s = slotOf(id); if (s){ delete ord.placed[s]; delete ord.marks[s]; }
  ord.sel = null; $('ordFb').textContent=''; ordRender();
}

/* Ziehen oder Antippen */
let drag = null;
function cardDown(e){
  if (ord.done) return;
  e.preventDefault();
  const el = e.currentTarget;
  drag = {id:el.dataset.id, x0:e.clientX, y0:e.clientY, el, ghost:null, over:null};
  window.addEventListener('pointermove', cardMove);
  window.addEventListener('pointerup', cardUp);
  window.addEventListener('pointercancel', cardCancel);
}
function dropTargetAt(x,y){
  const t = document.elementFromPoint(x,y);
  return t ? (t.closest('.slot') || t.closest('.pool')) : null;
}
function cardMove(e){
  if (!drag) return;
  if (!drag.ghost){
    if (Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0) < 8) return;
    const g = drag.el.cloneNode(true); g.classList.add('ghost'); g.classList.remove('sel');
    g.style.width = drag.el.offsetWidth+'px';
    document.body.appendChild(g); drag.ghost = g; drag.el.style.opacity = .3;
  }
  drag.ghost.style.left = e.clientX+'px'; drag.ghost.style.top = e.clientY+'px';
  const t = dropTargetAt(e.clientX, e.clientY);
  if (t!==drag.over){ drag.over?.classList.remove('target'); t?.classList.add('target'); drag.over=t; }
}
function cardUp(e){
  if (!drag) return;
  const d = drag; cardCancel();
  if (d.ghost){
    const t = dropTargetAt(e.clientX, e.clientY);
    if (t?.dataset.slot) ordPlace(d.id, t.dataset.slot);
    else if (t?.classList.contains('pool')) ordUnplace(d.id);
    else ordRender();
    return;
  }
  // Antippen
  const inSlot = slotOf(d.id);
  if (ord.sel && ord.sel!==d.id && inSlot){ ordPlace(ord.sel, inSlot); return; }   // tauschen
  if (!ord.sel && inSlot){ ordUnplace(d.id); return; }                             // zurücklegen
  ord.sel = (ord.sel===d.id) ? null : d.id; ordRender();
}
function cardCancel(){
  if (!drag) return;
  drag.ghost?.remove(); drag.over?.classList.remove('target'); if (drag.el) drag.el.style.opacity='';
  drag = null;
  window.removeEventListener('pointermove', cardMove);
  window.removeEventListener('pointerup', cardUp);
  window.removeEventListener('pointercancel', cardCancel);
}

$('ordCheck').onclick = () => {
  let ok = 0;
  Object.keys(ord.placed).forEach(s => {
    const [k,c] = s.split('|'); const card = cardById(ord.placed[s]);
    const good = card.k===k && card.c===c; ord.marks[s] = good?'ok':'bad'; if (good) ok++;
  });
  const fb = $('ordFb');
  if (ok===ord.cards.length){
    ord.done = true; ord.solved++; ord.round++;
    fb.className='fb ok'; fb.innerHTML = '<b>Alles richtig!</b>';
    $('ordCheck').hidden = true; $('ordNext').hidden = false;
    ordMerk();
  } else {
    fb.className='fb bad';
    fb.innerHTML = `<b>${ok} von ${ord.cards.length}</b> stimmen. Tippe die Karten in den roten Feldern an, um sie zurückzulegen.`;
  }
  ordRender();
};
$('ordNext').onclick = ordNew;

/* =========================================================
   2  QUIZ «Was ist was?»
   ========================================================= */
const QN = 10;
const quiz = { n:0, score:0, res:[], cur:null, answered:false, rounds:0 };
const sampleVal = k => rnd({U:['1.5','3','4.5','6','9','12','230'], I:['0.2','0.5','1','2','3'], R:['5','10','22','47','100','220']}[k]);

function qGen(){
  const type = rnd(['tf','tf','tf','sym','sym','unitOf','qOfUnit','fz','ez','geraet']);
  const k = type==='geraet' ? rnd(['U','I']) : rnd(KEYS);
  const q = Q[k], v = sampleVal(k);
  const others = KEYS.filter(x=>x!==k);
  const correctNote = `${q.zeichen} = ${v} ${q.ez}`;
  const opt = (t,ok) => ({t,ok});

  if (type==='tf'){
    const variant = rnd(['ok','ok','unit','swap','vv']);
    let s, isOk = false, why;
    if (variant==='ok'){ s=correctNote; isOk=true; why=`${q.zeichen} ist das Formelzeichen für ${q.art} ${q.begriff}, ${q.ez} die Abkürzung für ${q.einheit}.`; }
    if (variant==='unit'){ const o=Q[rnd(others)]; s=`${q.zeichen} = ${v} ${o.ez}`; why=`${q.begriff} misst man in ${q.einheit} (${q.ez}), nicht in ${o.einheit}. Richtig wäre: <b>${correctNote}</b>`; }
    if (variant==='swap'){ s=`${q.ez} = ${v} ${q.zeichen}`; why=`Formelzeichen und Abkürzung für die Einheit sind vertauscht. Richtig: <b>${correctNote}</b>`; }
    if (variant==='vv'){ s=`${q.ez} = ${v} ${q.ez}`; why=`Vorne gehört das Formelzeichen hin, nicht die Abkürzung für die Einheit. Richtig: <b>${correctNote}</b>`; }
    return {prompt:'Ist das richtig notiert?', stmt:s, opts:[opt('Richtig',isOk),opt('Falsch',!isOk)], why, keep:true};
  }
  if (type==='sym'){
    if (Math.random()<.5){
      return {prompt:`Wofür steht «${q.zeichen}»?`, stmt:correctNote,
        opts:shuffle([opt(q.begriff,true), ...others.map(o=>opt(Q[o].begriff,false)), opt(q.einheit,false)]),
        why:`«${q.zeichen}» vorne ist das Formelzeichen: Es sagt, <b>welche Grösse</b> gemeint ist – ${q.art} ${q.begriff}.`};
    }
    return {prompt:`Wofür steht «${q.ez}»?`, stmt:correctNote,
      opts:shuffle([opt(q.einheit,true), ...others.map(o=>opt(Q[o].einheit,false)), opt(q.begriff,false)]),
      why:`«${q.ez}» hinter der Zahl ist die Abkürzung für <b>${q.einheit}</b>. Es sagt, worin gemessen wurde.`};
  }
  if (type==='unitOf'){
    return {prompt:`In welcher Einheit gibt man ${q.art} ${q.begriff} an?`,
      opts:shuffle(KEYS.map(x=>opt(Q[x].einheit, x===k))),
      why:`${cap(q.art)} ${q.begriff} gibt man in <b>${q.einheit}</b> (${q.ez}) an.`};
  }
  if (type==='qOfUnit'){
    return {prompt:`Welche Grösse gibt man in ${q.einheit} an?`,
      opts:shuffle(KEYS.map(x=>opt(Q[x].begriff, x===k))),
      why:`In ${q.einheit} gibt man ${q.art} <b>${q.begriff}</b> an.`};
  }
  if (type==='fz'){
    const d = {U:['V','S','I'], I:['A','S','U'], R:['Ω','W','I']}[k];
    return {prompt:`Welches Formelzeichen hat ${q.art} ${q.begriff}?`,
      opts:shuffle([opt(q.zeichen,true), ...d.map(x=>opt(x,false))]),
      why:`Das Formelzeichen für ${q.art} ${q.begriff} ist <b>${q.zeichen}</b>. Es kommt nicht vom deutschen Wort – darum nicht «${d[1]}».`};
  }
  if (type==='ez'){
    const d = [...others.map(o=>Q[o].ez), q.zeichen];
    return {prompt:`Was ist die Abkürzung für die Einheit ${q.einheit}?`,
      opts:shuffle([opt(q.ez,true), ...d.map(x=>opt(x,false))]),
      why:`${q.einheit} kürzt man mit <b>${q.ez}</b> ab. «${q.zeichen}» ist das Formelzeichen für ${q.art} ${q.begriff}.`};
  }
  // geraet
  const where = k==='U' ? 'Das Voltmeter wird parallel zur Lampe oder Batterie angeschlossen.' : 'Das Amperemeter wird in Serie eingebaut.';
  return {prompt:`Womit misst man ${q.art} ${q.begriff}?`,
    opts:shuffle([opt('Voltmeter',k==='U'), opt('Amperemeter',k==='I')]),
    why:`Mit dem <b>${q.geraet}</b>. ${where}`};
}

function quizStart(){ quiz.n=0; quiz.score=0; quiz.res=[]; quizNext(); }
function quizNext(){
  if (quiz.n>=QN){ quizEnd(); return; }
  let g; do { g=qGen(); } while (quiz.cur && g.prompt===quiz.cur.prompt && g.stmt===quiz.cur.stmt);
  quiz.cur = g; quiz.answered=false; quizRender();
}
function quizRender(){
  const g = quiz.cur;
  $('qDots').innerHTML = Array.from({length:QN},(_,i)=>`<span class="dot ${quiz.res[i]===true?'ok':quiz.res[i]===false?'bad':i===quiz.n?'cur':''}"></span>`).join('');
  $('qScore').textContent = `Frage ${quiz.n+1} von ${QN}`;
  $('qPanel').innerHTML = `
    <p class="task">${g.prompt}</p>
    ${g.stmt?`<div class="stmt">${g.stmt}</div>`:''}
    <div class="opts">${g.opts.map((o,i)=>`<button class="btn" data-i="${i}">${o.t}</button>`).join('')}</div>
    <div class="fb" id="qFb"></div>
    <div class="qfoot"><button class="btn primary" id="qNext" disabled>Weiter</button></div>`;
  $('qPanel').querySelectorAll('.opts .btn').forEach(b => b.onclick = () => quizAnswer(+b.dataset.i));
  $('qNext').onclick = () => { quiz.n++; quizNext(); };
}
function quizAnswer(i){
  if (quiz.answered) return; quiz.answered = true;
  const g = quiz.cur, ok = g.opts[i].ok;
  quiz.res[quiz.n] = ok; if (ok) quiz.score++;
  $('qPanel').querySelectorAll('.opts .btn').forEach((b,j) => {
    b.disabled = true; b.style.opacity = 1;
    if (g.opts[j].ok) b.classList.add('ok'); else if (j===i) b.classList.add('bad');
  });
  const fb = $('qFb'); fb.className = 'fb '+(ok?'ok':'bad');
  fb.innerHTML = (ok?'<b>Richtig.</b> ':'<b>Nicht ganz.</b> ') + g.why;
  $('qDots').children[quiz.n].className = 'dot '+(ok?'ok':'bad');
  const nb = $('qNext'); nb.disabled = false; nb.textContent = quiz.n===QN-1 ? 'Auswertung' : 'Weiter'; nb.focus();
}
function quizEnd(){
  quiz.rounds++;
  $('qScore').textContent = '';
  const msg = quiz.score===QN ? 'Perfekt!' : quiz.score>=8 ? 'Sehr gut!' : quiz.score>=5 ? 'Gut – nochmals üben lohnt sich.' : 'Schau dir den Reiter «Ordnen» nochmals an.';
  $('qPanel').innerHTML = `<div class="result"><div class="big">${quiz.score} / ${QN}</div><p class="task" style="margin-top:8px">${msg}</p>
    <p style="margin-top:22px"><button class="btn primary" id="qAgain">Neue Runde</button></p></div>`;
  $('qAgain').onclick = quizStart;
}

/* =========================================================
   Dreieck-Bauteil
   ========================================================= */
function makeTriangle(box, onPick, small){
  /* Ein Mittelpunkt pro Grösse – Kreis, Abdeckung und Buchstabe richten sich danach */
  const C = {U:[150,104], R:[98,200], I:[202,200]};
  const RAD = 33;
  box.innerHTML = `
  <svg viewBox="0 0 300 262" aria-label="Formeldreieck">
    <polygon points="150,14 293,254 7,254" fill="var(--tri-dark)" stroke="var(--tri-dark)" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="150,10 290,248 10,248" fill="var(--tri)" stroke="var(--tri)" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="150,32 270,236 30,236" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <line x1="86" y1="150" x2="214" y2="150" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="150" cy="200" r="4.5" fill="#fff"/>
    ${KEYS.map(k=>{ const [x,y]=C[k]; return `
      <g class="hit" data-k="${k}">
        <circle cx="${x}" cy="${y}" r="${RAD+6}" fill="transparent"/>
        <circle class="ring" cx="${x}" cy="${y}" r="${RAD}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="5 5"/>
        <text class="lt" x="${x}" y="${y}" dy="0.35em" text-anchor="middle" fill="#fff" font-size="56" font-weight="700" font-style="italic" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif">${k}</text>
        <g class="cover" style="display:none">
          <circle cx="${x}" cy="${y}" r="${RAD}" fill="#fff" stroke="var(--tri-dark)" stroke-width="2"/>
          <text x="${x}" y="${y}" dy="0.36em" text-anchor="middle" font-size="38">👆</text>
        </g>
      </g>`;}).join('')}
  </svg>`;
  // Kursivschrift optisch zentrieren: Buchstabe nach seiner tatsächlichen Form ausrichten
  box._align = () => box.querySelectorAll('.hit').forEach(g => {
    const t = g.querySelector('.lt'), [x] = C[g.dataset.k];
    if (t.style.display==='none') return;
    try {
      t.setAttribute('x', x);
      const b = t.getBBox(); if (!b.width) return;
      t.setAttribute('x', x - (b.x + b.width/2 - x));
    } catch(e){}
  });
  requestAnimationFrame(box._align);
  const api = {
    covered:null,
    set(k){
      api.covered = k;
      box.querySelectorAll('.hit').forEach(g => {
        const c = g.dataset.k===k; g.classList.toggle('covered', c);
        g.querySelector('.cover').style.display = c?'':'none';
        g.querySelector('.lt').style.display = c?'none':'';
      });
      box._align();
    }
  };
  box.querySelectorAll('.hit').forEach(g => g.addEventListener('click', () => {
    const k = g.dataset.k; api.set(api.covered===k ? null : k); onPick && onPick(api.covered);
  }));
  return api;
}

/* =========================================================
   3  DREIECK
   ========================================================= */
const tri = { mode:'erkunden', api:null, cur:null, answered:false, score:0, total:0, hide:false };
document.querySelectorAll('#triMode button').forEach(b => b.onclick = () => {
  tri.mode = b.dataset.m;
  document.querySelectorAll('#triMode button').forEach(x => x.classList.toggle('on', x===b));
  triSetup();
});
function triSetup(){
  if (tri.mode==='erkunden'){
    $('triTask').textContent = 'Tippe auf die Grösse, die du suchst.';
    $('triSub').textContent = 'Sie wird mit dem Finger abgedeckt – was übrig bleibt, ist die Formel.';
    $('triScore').textContent = '';
    $('triBox').style.visibility = 'visible';
    $('triRight').innerHTML = `<div class="formula-out empty" id="triOut">Noch nichts abgedeckt.</div>
      <div class="rule">
        <div class="rf"><span class="rx">R<span class="dotm">·</span>I</span></div><div>nebeneinander → <b>mal</b></div>
        <div class="rf"><span class="rfrac"><span>U</span><span>R</span></span></div><div>übereinander → <b>geteilt</b></div>
      </div>
      <div class="fb" id="triExpl"></div>`;
    tri.api = makeTriangle($('triBox'), k => {
      const out = $('triOut');
      if (!k){ out.className='formula-out empty'; out.textContent='Noch nichts abgedeckt.'; $('triExpl').textContent=''; return; }
      out.className='formula-out'; out.innerHTML = `<div class="fline">${fHTML(CORRECT[k])}</div><div class="units">Einheiten: <b>${unitLine(k)}</b></div>`;
      const q = Q[k];
      $('triExpl').innerHTML = k==='U'
        ? `Gesucht ist ${q.art} ${q.begriff}. R und I stehen <b>nebeneinander</b> → man rechnet <b>mal</b>.`
        : `Gesucht ist ${q.art} ${q.begriff}. U steht <b>über</b> ${k==='I'?'R':'I'} → man rechnet <b>geteilt</b>.`;
    });
  } else {
    triNewQ();
  }
}
function triNewQ(){
  const k = rnd(KEYS), q = Q[k];
  const type = Math.random()<.55 ? 'gesucht' : 'gegeben';
  let opts, task;
  if (type==='gesucht'){
    task = `Gesucht ist ${q.art} ${q.begriff} ${q.zeichen}. Welche Formel stimmt?`;
    opts = shuffle([CORRECT[k], ...WRONG[k]]);
  } else {
    const g = KEYS.filter(x=>x!==k);
    task = `Gegeben sind ${Q[g[0]].art} ${Q[g[0]].begriff} und ${Q[g[1]].art} ${Q[g[1]].begriff}. Welche Formel brauchst du?`;
    opts = shuffle(KEYS.map(x=>CORRECT[x]));
  }
  tri.cur = {k, type, opts}; tri.answered = false;
  $('triTask').textContent = task;
  $('triSub').textContent = 'Das Dreieck darfst du als Hilfe benutzen.';
  $('triScore').textContent = tri.total ? `${tri.score} von ${tri.total} richtig` : '';
  $('triRight').innerHTML = `<div class="fopts">${opts.map((f,i)=>`<button class="btn" data-i="${i}">${fHTML(f)}</button>`).join('')}</div>
    <div class="fb" id="triFb"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap">
      <button class="btn" id="triHide">${tri.hide?'Dreieck zeigen':'Ohne Dreieck üben'}</button>
      <button class="btn primary" id="triNext" disabled>Weiter</button></div>`;
  $('triBox').style.visibility = tri.hide ? 'hidden' : 'visible';
  tri.api = makeTriangle($('triBox'), null);
  $('triRight').querySelectorAll('.fopts .btn').forEach(b => b.onclick = () => triAnswer(+b.dataset.i));
  $('triHide').onclick = () => { tri.hide=!tri.hide; $('triBox').style.visibility = tri.hide?'hidden':'visible'; $('triBox')._align(); $('triHide').textContent = tri.hide?'Dreieck zeigen':'Ohne Dreieck üben'; };
  $('triNext').onclick = triNewQ;
}
function triAnswer(i){
  if (tri.answered) return; tri.answered = true;
  const c = tri.cur, ok = sameF(c.opts[i], CORRECT[c.k]);
  tri.total++; if (ok) tri.score++;
  $('triRight').querySelectorAll('.fopts .btn').forEach((b,j) => {
    b.disabled = true; b.style.opacity = 1;
    if (sameF(c.opts[j], CORRECT[c.k])) b.classList.add('ok'); else if (j===i) b.classList.add('bad');
  });
  const q = Q[c.k];
  let why = c.type==='gegeben'
    ? `Aus den beiden gegebenen Grössen kannst du ${q.art} ${q.begriff} (${q.zeichen}) berechnen. `
    : '';
  why += `Deck ${q.zeichen} im Dreieck ab: ` + (c.k==='U' ? 'R und I stehen nebeneinander → mal.' : `U steht über ${c.k==='I'?'R':'I'} → geteilt.`);
  const fb = $('triFb'); fb.className='fb '+(ok?'ok':'bad');
  fb.innerHTML = (ok?'<b>Richtig.</b> ':'<b>Nicht ganz.</b> ') + why;
  tri.api.set(c.k);
  if (tri.hide) $('triBox').style.visibility='visible';
  $('triScore').textContent = `${tri.score} von ${tri.total} richtig`;
  $('triNext').disabled = false;
}

/* =========================================================
   4  RECHNEN
   ========================================================= */
const OBJ = [
  {nom:'Ein Lämpchen', akk:'ein Lämpchen'},
  {nom:'Eine Glühlampe', akk:'eine Glühlampe'},
  {nom:'Ein Heizdraht', akk:'einen Heizdraht'},
  {nom:'Ein Lautsprecher', akk:'einen Lautsprecher'}
];
const calc = { level:1, t:null, step:0, tries:0, solved:0, unit:null };
document.querySelectorAll('#cLevel button').forEach(b => b.onclick = () => {
  calc.level = +b.dataset.l;
  document.querySelectorAll('#cLevel button').forEach(x => x.classList.toggle('on', x===b));
  calcNew();
});

function calcGen(){
  let R, I, U;
  if (calc.level===1){
    do { R = rnd([2,3,4,5,6,8,10,12,15,20,25,30,40,50]); I = rnd([1,2,3,4,5,6]); U = R*I; } while (U>240);
  } else {
    R = rnd([4,5,6,8,10,12,15,20,24,30,40,50,60,80,100]);
    I = rnd([0.1,0.2,0.25,0.4,0.5,0.75,1.5,2.5]);
    U = Math.round(R*I*100)/100;
  }
  const vals = {U,I,R};
  const unk = rnd(KEYS);
  const o = rnd(OBJ);
  const V = k => `<span class="val" data-k="${k}">${fmt(vals[k])} ${Q[k].ez}</span>`;
  let text, order;
  if (unk==='R'){ text = `${o.nom} ist an eine Spannung von ${V('U')} angeschlossen. Es fliesst ein Strom von ${V('I')}. Wie gross ist der Widerstand?`; order=['U','I']; }
  if (unk==='I'){ text = `${o.nom} hat einen Widerstand von ${V('R')}. Man legt eine Spannung von ${V('U')} an. Wie gross ist die Stromstärke?`; order=['R','U']; }
  if (unk==='U'){ text = `Durch ${o.akk} mit einem Widerstand von ${V('R')} fliesst ein Strom von ${V('I')}. Wie gross ist die Spannung?`; order=['R','I']; }
  return {vals, unk, text, order};
}
function calcNew(){
  calc.t = calcGen(); calc.step = 0; calc.tries = 0; calc.unit = null; calc.formOpts = shuffle([CORRECT[calc.t.unk], ...WRONG[calc.t.unk]]);
  $('cStory').innerHTML = calc.t.text;
  calcRender();
}
/* Schritte: 0,1 = Angaben bestimmen; 2 = gesucht; 3 = Formel; 4 = Resultat; 5 = fertig */
function calcRender(){
  const t = calc.t, s = calc.step, v = t.vals;
  $('cScore').textContent = calc.solved ? `Gelöste Aufgaben: ${calc.solved}` : '';
  document.querySelectorAll('#cStory .val').forEach(el => el.classList.toggle('done', t.order.indexOf(el.dataset.k) < s));

  // Notizen (wie auf Papier)
  const given = t.order.map((k,i) => i<s
      ? `<div class="ln"><b>${k}</b> = ${fmt(v[k])} ${Q[k].ez}</div>`
      : `<div class="ln"><span class="ph">? = ${fmt(v[k])} ${Q[k].ez}</span></div>`).join('');
  const f = CORRECT[t.unk];
  const rhs = f.op==='mul' ? `${fmt(v[f.a])} ${Q[f.a].ez} · ${fmt(v[f.b])} ${Q[f.b].ez}` : frac(`${fmt(v[f.a])} ${Q[f.a].ez}`, `${fmt(v[f.b])} ${Q[f.b].ez}`);
  const row = (lbl, html, active) => `<div class="row${active?' active':''}"><span class="lbl">${lbl}</span><div class="val2">${html}</div></div>`;
  const ph = '<span class="ph">…</span>';
  $('cNotes').innerHTML =
    row('Gegeben', given, s<=1) +
    row('Gesucht', s>2 ? `<div class="ln"><b>${t.unk}</b> = ?</div>` : ph, s===2) +
    row('Formel',  s>3 ? `<div class="ln">${fHTML(f)}</div>` : ph, s===3) +
    row('Rechnung', s>4 ? `<div class="ln"><b>${t.unk}</b> = ${rhs} = <span class="res">${fmt(v[t.unk])} ${Q[t.unk].ez}</span></div><div class="ucheck">Einheiten-Check: ${unitLine(t.unk).split(' = ').reverse().join(' = ')} ✓</div>` : ph, s===4);

  // Aktueller Schritt
  const now = $('cNow');
  const stepLabel = n => `<div class="stepinfo">Schritt ${n} von 4</div>`;
  if (s<=1){
    const k = t.order[s];
    now.innerHTML = `${stepLabel(1)}<h3>Welche Grösse ist «${fmt(v[k])} ${Q[k].ez}»?</h3>
      <div class="btns">${KEYS.map(x=>`<button class="btn" data-a="${x}">${x}</button>`).join('')}</div><div class="fb" id="cFb"></div>`;
    now.querySelectorAll('.btn').forEach(b => b.onclick = () => calcPick(b, b.dataset.a===k,
      `Schau auf die Abkürzung für die Einheit: ${Q[k].ez} steht für ${Q[k].einheit}. Welche Grösse misst man in ${Q[k].einheit}?`));
  } else if (s===2){
    now.innerHTML = `${stepLabel(2)}<h3>Was ist gesucht?</h3>
      <div class="btns">${KEYS.map(x=>`<button class="btn" data-a="${x}">${x}</button>`).join('')}</div><div class="fb" id="cFb"></div>`;
    now.querySelectorAll('.btn').forEach(b => b.onclick = () => calcPick(b, b.dataset.a===t.unk,
      'Lies die Frage am Ende der Aufgabe nochmals: Wonach wird gefragt?'));
  } else if (s===3){
    now.innerHTML = `${stepLabel(3)}<h3>Welche Formel brauchst du?</h3>
      <div class="fopts" style="margin-top:0">${calc.formOpts.map((ff,i)=>`<button class="btn" data-i="${i}">${fHTML(ff)}</button>`).join('')}</div>
      <div class="fb" id="cFb"></div>
      <button class="btn" id="cTriBtn" style="margin-top:6px">Dreieck als Hilfe</button>
      <div class="tri minitri" id="cTri" hidden></div>`;
    now.querySelectorAll('.fopts .btn').forEach(b => b.onclick = () => calcPick(b, sameF(calc.formOpts[+b.dataset.i], CORRECT[t.unk]),
      `Deck ${t.unk} im Dreieck ab. Nebeneinander heisst mal, übereinander heisst geteilt.`));
    $('cTriBtn').onclick = () => { const c=$('cTri'); c.hidden=!c.hidden; if(!c.hidden && !c.firstChild) makeTriangle(c,null); else if(!c.hidden) c._align(); };
  } else if (s===4){
    now.innerHTML = `${stepLabel(4)}<h3>Einsetzen und ausrechnen</h3>
      <div class="resrow"><span class="f">${t.unk}</span> = <input id="cIn" inputmode="decimal" autocomplete="off">
        <div class="unitbtns">${KEYS.map(x=>`<button class="btn" data-u="${Q[x].ez}">${Q[x].ez}</button>`).join('')}</div></div>
      <div style="margin-top:14px"><button class="btn primary" id="cCheck" disabled>Prüfen</button></div>
      <div class="fb" id="cFb"></div>`;
    const inp = $('cIn'), chk = $('cCheck');
    const upd = () => chk.disabled = !(inp.value.trim() && calc.unit);
    inp.oninput = upd;
    inp.onkeydown = e => { if (e.key==='Enter' && !chk.disabled) chk.click(); };
    now.querySelectorAll('.unitbtns .btn').forEach(b => {
      if (b.dataset.u===calc.unit) b.classList.add('on');
      b.onclick = () => { calc.unit=b.dataset.u; now.querySelectorAll('.unitbtns .btn').forEach(x=>x.classList.toggle('on',x===b)); upd(); };
    });
    chk.onclick = calcCheck;
    setTimeout(()=>inp.focus(), 30);
  } else {
    now.innerHTML = `<h3 style="color:#156b3a">Gelöst! ✓</h3>
      <p style="font-size:17px;line-height:1.5;margin:0 0 16px">Jetzt steht die ganze Lösung da: Gegeben, Gesucht, Formel, Rechnung. Genau so schreibst du sie auch auf Papier.</p>
      <button class="btn primary" id="cNext">Neue Aufgabe</button>`;
    $('cNext').onclick = calcNew; $('cNext').focus();
  }
}
function calcPick(btn, ok, hint){
  if (ok){ calc.step++; calc.tries=0; calcRender(); return; }
  btn.classList.add('bad','shake'); btn.disabled = true;
  setTimeout(()=>btn.classList.remove('shake'), 400);
  const fb = $('cFb'); fb.className='fb bad'; fb.textContent = hint;
}
function calcCheck(){
  const t = calc.t, ans = t.vals[t.unk], q = Q[t.unk];
  const x = parseFloat($('cIn').value.replace(',', '.').replace(/\s/g,''));
  const numOk = isFinite(x) && Math.abs(x-ans) <= Math.max(0.005, Math.abs(ans)*0.005);
  const unitOk = calc.unit === q.ez;
  const fb = $('cFb');
  if (numOk && unitOk){ calc.solved++; calc.step = 5; calcRender(); return; }
  calc.tries++;
  fb.className = 'fb bad';
  const f = CORRECT[t.unk], v = t.vals;
  const op = f.op==='mul' ? '·' : ':';
  if (!numOk && !unitOk) fb.innerHTML = `Zahl und Einheit stimmen noch nicht.`;
  else if (!numOk) fb.innerHTML = `Die Einheit stimmt, die Zahl noch nicht.`;
  else fb.innerHTML = `Die Zahl stimmt! Aber welche Einheit hat ${q.art} ${q.begriff}?`;
  if (!numOk) fb.innerHTML += calc.tries>=2
    ? ` Rechne: <b>${fmt(v[f.a])} ${op} ${fmt(v[f.b])}</b>`
    : ` Setze in die Formel ein: ${f.a} = ${fmt(v[f.a])}, ${f.b} = ${fmt(v[f.b])}.`;
  $('cIn').classList.add('shake'); setTimeout(()=>$('cIn').classList.remove('shake'), 400);
}

/* =========================================================
   5  JE – DESTO
   ========================================================= */
const FAK = {
  '2':  {m:2,   verb:'verdoppelt',             st:'↑ verdoppelt', eff:'doppelt so gross'},
  '1/2':{m:1/2, verb:'halbiert',               st:'↓ halbiert',   eff:'halb so gross'},
  '3':  {m:3,   verb:'verdreifacht',           st:'↑ verdreifacht', eff:'dreimal so gross'},
  '1/3':{m:1/3, verb:'auf einen Drittel verkleinert', st:'↓ ein Drittel', eff:'ein Drittel so gross'}
};
const INV = {'2':'1/2','1/2':'2','3':'1/3','1/3':'3'};
const jd = { level:1, n:0, score:0, res:[], cur:null, answered:false };
document.querySelectorAll('#jLevel button').forEach(b => b.onclick = () => {
  jd.level = +b.dataset.l;
  document.querySelectorAll('#jLevel button').forEach(x => x.classList.toggle('on', x===b));
  jdStart();
});
const val = (k,x) => `${k} = ${fmt(x)} ${Q[k].ez}`;
function jdGen(){
  const c = rnd(KEYS);                                   // wird verändert
  const t = rnd(KEYS.filter(x=>x!==c));                  // gesucht
  const f = KEYS.find(x=>x!==c && x!==t);                // bleibt gleich
  const fk = rnd(jd.level===1 ? ['2','1/2'] : ['2','1/2','3','1/3']);
  const same = (t==='U' || c==='U');                     // gleich- oder umgekehrt
  const tk = same ? fk : INV[fk];
  // Zahlenbeispiel mit glatten Werten suchen
  let ex = null;
  for (const R of shuffle([2,3,4,6,8,9,12])) for (const I of shuffle([1,2,3,4,6])){
    if (ex) break;
    const a = {U:R*I, I, R}, b = {...a};
    b[c] = a[c]*FAK[fk].m;
    b[t] = t==='U' ? b.R*b.I : t==='I' ? b.U/b.R : b.U/b.I;
    const ok = KEYS.every(k => Math.abs(b[k]-Math.round(b[k]))<1e-9 && b[k]>=1 && b[k]<=200);
    if (ok) ex = {a,b};
  }
  return {c,t,f,fk,tk,same,ex};
}
function jdStart(){ jd.n=0; jd.score=0; jd.res=[]; jdNext(); }
function jdNext(){
  if (jd.n>=QN){ jdEnd(); return; }
  let g; do { g = jdGen(); } while (jd.cur && g.c===jd.cur.c && g.t===jd.cur.t && g.fk===jd.cur.fk);
  jd.cur = g; jd.answered = false; jdRender();
}
function jdOptions(){
  if (jd.level===1) return [{t:'wird grösser',v:'up'},{t:'bleibt gleich',v:'eq'},{t:'wird kleiner',v:'down'}];
  return [{t:'dreimal so gross',v:'3'},{t:'doppelt so gross',v:'2'},{t:'bleibt gleich',v:'eq'},{t:'halb so gross',v:'1/2'},{t:'ein Drittel so gross',v:'1/3'}];
}
function jdRender(){
  const g = jd.cur, qc = Q[g.c], qt = Q[g.t], qf = Q[g.f];
  $('jDots').innerHTML = Array.from({length:QN},(_,i)=>`<span class="dot ${jd.res[i]===true?'ok':jd.res[i]===false?'bad':i===jd.n?'cur':''}"></span>`).join('');
  $('jScore').textContent = `Frage ${jd.n+1} von ${QN}`;
  const card = k => {
    let st, cls='';
    if (k===g.c){ st = FAK[g.fk].st; cls = FAK[g.fk].m>1?'up':'down'; }
    else if (k===g.f){ st = '= bleibt gleich'; cls='eq'; }
    else st = '?';
    return `<div class="jd-card${k===g.t?' target':''}" data-k="${k}"><div class="L">${k}</div><div class="B">${Q[k].begriff}</div><div class="S ${cls}">${st}</div></div>`;
  };
  $('jPanel').innerHTML = `
    <p class="task">Bei einem Lämpchen wird ${qc.art} ${qc.begriff} <u>${FAK[g.fk].verb}</u>.
      ${cap(qf.art)} ${qf.begriff} bleibt gleich. Was passiert mit ${qt.art==='der'?'dem':'der'} ${qt.begriff}?</p>
    <div class="jd-cards">${KEYS.map(card).join('')}</div>
    <div class="opts${jd.level===2?' five':''}">${jdOptions().map((o,i)=>`<button class="btn" data-i="${i}">${o.t}</button>`).join('')}</div>
    <div class="fb" id="jFb"></div>
    <div class="qfoot"><button class="btn primary" id="jNext" disabled>Weiter</button></div>`;
  $('jPanel').querySelectorAll('.opts .btn').forEach(b => b.onclick = () => jdAnswer(+b.dataset.i));
  $('jNext').onclick = () => { jd.n++; jdNext(); };
}
function jdAnswer(i){
  if (jd.answered) return; jd.answered = true;
  const g = jd.cur, opts = jdOptions();
  const right = jd.level===1 ? (FAK[g.tk].m>1?'up':'down') : g.tk;
  const ok = opts[i].v===right;
  jd.res[jd.n] = ok; if (ok) jd.score++;
  $('jPanel').querySelectorAll('.opts .btn').forEach((b,j) => {
    b.disabled = true; b.style.opacity = 1;
    if (opts[j].v===right) b.classList.add('ok'); else if (j===i) b.classList.add('bad');
  });
  // Zielkarte auflösen
  const tc = $('jPanel').querySelector(`.jd-card[data-k="${g.t}"] .S`);
  tc.className = 'S '+(FAK[g.tk].m>1?'up':'down');
  tc.textContent = (FAK[g.tk].m>1?'↑ ':'↓ ') + FAK[g.tk].eff;
  const qc = Q[g.c], qt = Q[g.t];
  const je = `Je grösser ${qc.art} ${qc.begriff}, desto ${g.same?'grösser':'kleiner'} ${qt.art} ${qt.begriff}.`;
  let ex = '';
  if (g.ex){
    const {a,b} = g.ex;
    ex = `<div class="jd-ex"><span class="k">Vorher:</span>${val(g.c,a[g.c])}, ${val(g.f,a[g.f])} → <b>${val(g.t,a[g.t])}</b><br>
      <span class="k">Nachher:</span>${val(g.c,b[g.c])}, ${val(g.f,b[g.f])} → <b>${val(g.t,b[g.t])}</b></div>`;
  }
  const fb = $('jFb'); fb.className = 'fb '+(ok?'ok':'bad');
  fb.innerHTML = (ok?'<b>Richtig.</b> ':'<b>Nicht ganz.</b> ') + `${cap(qt.art)} ${qt.begriff} wird <b>${FAK[g.tk].eff}</b>. ${je}` + ex;
  $('jDots').children[jd.n].className = 'dot '+(ok?'ok':'bad');
  const nb = $('jNext'); nb.disabled = false; nb.textContent = jd.n===QN-1 ? 'Auswertung' : 'Weiter';
}
function jdEnd(){
  $('jScore').textContent = '';
  const msg = jd.score===QN ? 'Perfekt!' : jd.score>=8 ? 'Sehr gut!' : jd.score>=5 ? 'Gut – nochmals üben lohnt sich.' : 'Tipp: Schau dir die Zahlenbeispiele genau an.';
  $('jPanel').innerHTML = `<div class="result"><div class="big">${jd.score} / ${QN}</div><p class="task" style="margin-top:8px">${msg}</p>
    <p style="margin-top:22px"><button class="btn primary" id="jAgain">Neue Runde</button></p></div>`;
  $('jAgain').onclick = jdStart;
}

/* =========================================================
   Start
   ========================================================= */
ordNew();
quizStart();
triSetup();
calcNew();
jdStart();
if (!ausAdresse()) adresse();
</script>
