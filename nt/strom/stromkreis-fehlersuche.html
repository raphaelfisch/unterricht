<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fehlersuche">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Fehlersuche im Stromkreis</title>
<style>
:root{--bg:#E6ECF1;--paper:#F8FAFB;--ink:#1D2935;--muted:#5A6672;--line:#C6D0D9;--btn:#FFFFFF;
  --accent:#2E6DB4;--ok:#23794A;--bad:#B8322A}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* hidden muss hidden bleiben: sonst gewinnt .fsbtn{display:inline-flex} und
   es steht ein leerer Kreis neben dem «?». */
[hidden]{display:none !important}
button{font:inherit}
html,body{height:100%}
body{margin:0;font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;font-size:16px;line-height:1.45;
  background:var(--bg);color:var(--ink);overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header,.top,.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wrap{max-width:1700px;margin:0 auto;padding:12px 16px 16px;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:18px;box-sizing:border-box}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px 14px;flex:0 0 auto}
.top h1{grid-column:1;grid-row:1;justify-self:start}
.top .tabs{grid-column:2;grid-row:1;justify-self:center}
.top .tools{grid-column:3;grid-row:1;justify-self:end}
.top h1{justify-self:start}
.top .fsbtn{justify-self:end}
h1{font-size:1.5rem;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
/* Die sechs Stufen: gleich breit, jede mit eigenem Rand */
.top .tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;margin:0;
  border:1px solid var(--line);border-radius:14px;padding:3px;background:var(--paper)}
.top .tabs .tab{border:0;background:transparent;color:var(--ink);height:38px;padding:0 8px;font-size:.9rem;
  display:flex;align-items:center;justify-content:center;border-radius:11px;
  white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis}
.top .tabs .tab:hover{background:#EEF2F7}
.top .tabs .tab.on{background:var(--ink);color:var(--paper)}
.subtabs{display:flex;gap:6px;margin:0 0 2px}
.tools{display:flex;align-items:center;gap:12px}
.fsbtn{margin-left:0;display:inline-flex;align-items:center;justify-content:center;gap:7px;font:inherit;font-size:.92rem;height:36px;
  border:1px solid var(--line);background:var(--btn);color:var(--muted);padding:0 14px;border-radius:999px;cursor:pointer}
.fsbtn:hover{border-color:var(--accent);color:var(--accent)}
.hilfebtn{width:36px;height:36px;padding:0;border-radius:999px;font-weight:700;font-size:.92rem;justify-content:center}
/* Zurück zur Übersicht – gleiche Form wie «?» */
/* Haus statt Pfeil: Ein Pfeil kann auch «einen Schritt zurück» heissen.
   Als Zeichnung statt als Schriftzeichen, damit es auf jedem Gerät gleich
   sitzt. Spiegelsymmetrisch, also waagrecht von selbst mittig; senkrecht ist
   die Zeichnung leicht angehoben, weil Wände und Tür mehr Tinte tragen als das Dach. */
.heim{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.heim svg{display:block}
/* Wie beim Vollbild-Knopf: Solange Platz ist, steht das Wort dabei –
   ein Pfeil allein sagt nicht, wohin er führt, und auf dem Tablet
   gibt es keinen Mauszeiger, der den Tooltip zeigt. */
@media (max-width:767px){.heim{width:36px;padding:0;border-radius:999px}.heim span{display:none}}
/* Ganz schmale Geraete: Die vier runden Knoepfe muessen neben den Titel passen. */
@media (max-width:430px){.tools{gap:8px}}
.stagewrap{position:relative}
.zoombtn{display:none;position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;
  border:1.5px solid var(--ink);background:#fff;font-size:1.1rem;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#stage.zoom{overflow:auto}
#stage.zoom svg{width:210%;height:auto;max-height:none}
.modal{position:fixed;inset:0;z-index:60;background:rgba(18,24,30,.45);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.mcard{background:var(--paper);border-radius:14px;padding:14px 16px 16px;max-width:440px;width:100%;
  max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.mhead b{font-size:1.05rem}
.mcard p{margin:7px 0;line-height:1.5}
.fsmode .wrap{max-width:none}
@media (max-width:1400px){
  .top{grid-template-columns:1fr auto}
  .top .tools{grid-column:2}
  .top .tabs{grid-column:1 / -1;grid-row:2;justify-self:stretch;width:100%}
}

@media (max-width:960px){
  .top .tabs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .top .tabs .tab{padding:0 4px}
}
.tab{border:1px solid var(--line);background:var(--btn);border-radius:999px;padding:7px 13px;font-size:.92rem;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab:disabled{opacity:.45;cursor:default}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;
  flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.stagewrap{flex:0 0 auto;min-height:0}
.side{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
#stage{min-height:0;width:100%;height:100%}
.panel{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:4px;margin:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;flex:0 0 auto}
.bar .t{font-weight:600;color:var(--muted)}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:.8rem;cursor:pointer;color:var(--ink)}
.dot.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.icon{border:none;background:none;font-size:.95rem;font-weight:600;cursor:pointer;padding:4px 6px;color:var(--muted)}
#stage svg{width:100%;height:100%;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
[data-el],[data-sw]{cursor:pointer}
.lead{margin:6px 0;font-size:1.02rem;line-height:1.45}
.msg{padding:8px 11px;border-radius:12px;margin:6px 0;line-height:1.45}
.msg.ok{background:#e6f6ec;color:#11683a}
.msg.bad{background:#fdecec;color:#9b1c1c}
.msg.info{background:#eef4fd;color:#1d4d99}
.hint{background:#fff7e0;color:#7a5600;padding:8px 11px;border-radius:12px;margin:6px 0}
/* Merksatz – gleiche Bauform und Farbe wie in «Grössen» und in der «Blackbox» */
.merke{background:#f6f2e9;border-left:4px solid #d9bd6a;border-radius:0 10px 10px 0;padding:8px 12px;margin:8px 0;line-height:1.45;color:#4a4232}
.mc{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.opt{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--btn);font-size:.97rem;cursor:pointer;color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:#e6f6ec}
.opt.wrongsel{border-color:var(--bad);background:#fdecec}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--btn);font:inherit;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
ul.res{margin:4px 0;padding-left:20px;line-height:1.5}
.complaint{font-size:1.1rem;font-weight:700;margin:4px 0 6px}
.proto{background:#f6f8fa;border-radius:12px;padding:8px 11px;margin:8px 0}
.proto ul{list-style:none;margin:4px 0 0;padding:0}
.proto li{padding:3px 0;line-height:1.4}
.proto .res.good{color:#11683a;font-weight:600}
.proto .res.badr{color:#9b1c1c;font-weight:600}
.proto .res.neutral{color:#7b8792}
.sub{font-weight:700;color:var(--muted);font-size:.9rem;margin:10px 0 4px}
.weg{background:#eef4fd;border-radius:12px;padding:8px 12px 10px;margin:8px 0}
.wegtitel{font-weight:700;font-size:.9rem;color:#1d4d99;margin-bottom:2px}
.wegtext{line-height:1.45;color:var(--ink)}
.rechnung{margin:2px 0 8px}
.rechnung summary{cursor:pointer;color:var(--muted);font-size:.9rem;list-style:none}
.rechnung summary::-webkit-details-marker{display:none}
.rechnung summary::before{content:"▸ "}
.rechnung[open] summary::before{content:"▾ "}

.weg li{color:#7b8792;line-height:1.4;padding:2px 0}
.weg li.on{color:var(--ink);font-weight:600}
.weg li.ab{text-decoration:line-through;opacity:.6}
.einst{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.einst summary{cursor:pointer;color:var(--muted);font-size:.92rem;font-weight:600;list-style:none}
.einst summary::-webkit-details-marker{display:none}
.einst summary::before{content:"▸ "}
.einst[open] summary::before{content:"▾ "}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.tbtn{text-align:left;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--btn);font-size:.95rem;cursor:pointer;color:var(--ink);line-height:1.3}
.tbtn:hover{border-color:var(--accent)}
.meter{margin:10px 0 6px}
.mbar{position:relative;height:26px;border-radius:9px;background:#eceff2;overflow:hidden}
.mscale{position:relative;height:15px;font-size:.76rem;color:var(--muted)}
.mover{position:absolute;right:8px;top:0;height:100%;display:flex;align-items:center;color:#fff;font-size:.9rem;letter-spacing:2px}
.mzone{position:absolute;top:0;left:80%;right:0;height:100%;background:repeating-linear-gradient(45deg,#fbe3e3,#fbe3e3 7px,#f6d2d2 7px,#f6d2d2 14px)}
.mfill{position:absolute;top:0;left:0;height:100%;border-radius:9px 0 0 9px;transition:width .25s}
.mlimit{position:absolute;top:0;left:80%;width:3px;height:100%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.mtick{position:absolute;left:80%;transform:translateX(-50%);white-space:nowrap;font-weight:700;color:#9b1c1c}
.heat{height:7px;border-radius:4px;background:#f1e3cd;margin-top:6px;overflow:hidden}
.hfill{height:100%;background:#f08c00;transition:width .2s}
.mval{font-weight:700;margin-top:5px;font-size:1.05rem}
.dlist{font-size:.93rem;color:#4a5560;line-height:1.55;margin:4px 0}
.dlist .sum{font-weight:700;color:var(--ink);border-top:1px solid var(--line);display:inline-block;padding-top:3px;margin-top:3px}
.blink{animation:blink .7s}
@keyframes blink{0%,100%{opacity:.6}50%{opacity:.08}}
@media (min-width:941px) and (max-height:900px){.wrap{padding-top:8px;gap:12px;padding-bottom:10px}.top{gap:6px 14px}.top .tabs .tab{height:34px}}
@media (min-width:941px) and (max-height:820px){.wrap{padding-top:6px;gap:10px;padding-bottom:8px}.top{gap:5px 14px}.top .tabs .tab{height:32px}
  .msg,.hint{font-size:.93rem;line-height:1.38}}
@media (min-width:941px) and (max-height:720px){.msg,.hint{font-size:.88rem;line-height:1.32}}
@media (min-width:941px) and (max-height:670px){.wrap{padding-top:5px;gap:10px;padding-bottom:8px}}
@media (min-width:700px) and (min-aspect-ratio:11/10){
  .card{flex-direction:row;gap:14px}
  /* Bildbreite folgt der Bildschirmhöhe (Seitenverhältnis 5:3), begrenzt durch den Platz für den Text */
  .stagewrap{flex:0 0 auto;min-width:0;height:100%;
    width:min(calc((100vh - 104px) * 5 / 3), calc(100% - clamp(320px, 28%, 430px) - 14px));
    width:min(calc((100dvh - 104px) * 5 / 3), calc(100% - clamp(320px, 28%, 430px) - 14px))}
  .side{flex:1 1 0;min-width:0}
}
@media (max-width:699px){.zoombtn{display:block}}
@media (max-width:699px), (max-aspect-ratio:11/10){
  .stagewrap{width:100%;height:min(38vh, calc((100vw - 48px) * 0.6));height:min(38dvh, calc((100vw - 48px) * 0.6))}
}
@media (max-width:600px){
  .fsbtn span{display:none}
  .fsbtn{width:36px;padding:0;border-radius:999px}
  h1{font-size:1.15rem}
  .h1lg{display:none}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;font-size:.86rem;padding:6px 10px}
  .wrap{padding:12px 12px 16px}
  .stagewrap{height:min(34vh, calc((100vw - 40px) * 0.6));height:min(34dvh, calc((100vw - 40px) * 0.6))}
}
@media (max-width:520px){.top .tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Sehr schmale Telefone (320 px): Der Titel weicht, damit die vier Knöpfe
   vollständig danebenpassen und keiner abgeschnitten wird. Steht zuunterst,
   weil sonst die 600-px-Regel weiter unten gewinnen würde. */
@media (max-width:360px){h1{font-size:1rem}}
/* Handy: Reiter auf Fingergrösse. */
@media (max-width:640px){.tab{min-height:44px;display:inline-flex;align-items:center}}
/* Handy: auch die Kopfknöpfe auf Fingergrösse. */
@media (max-width:640px){.fsbtn{height:44px}.hilfebtn,.fsbtn.rund{width:44px}}
@media (max-width:640px){.heim{width:44px}.zoombtn{width:44px;height:44px}.dot{width:40px;height:40px}}
@media (max-width:640px){.fsbtn{min-width:44px}.dot{width:44px;height:44px}.icon{min-width:40px;min-height:40px}}
</style>

<body>
<div class="wrap">
  <div class="top">
    <h1 title="Stand 27.10.2026">Fehlersuche<span class="h1lg"> im Stromkreis</span></h1>
    <div class="tabs" id="tabs"></div>
    <div class="tools">
      <a class="fsbtn heim" href="index.html" title="Zur Übersicht" aria-label="Zur Übersicht"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.65 12 2.45l9 7.2"/><path d="M5.6 8.45v10h12.8v-10"/><path d="M9.9 18.45v-5.2h4.2v5.2"/></svg><span>Übersicht</span></a>
      <button class="fsbtn" id="fsBtn" hidden aria-label="Vollbild"></button>
      <button class="fsbtn hilfebtn" id="einstBtn" aria-label="Einstellungen" title="Einstellungen">⚙</button>
      <button class="fsbtn hilfebtn" id="helpBtn" aria-label="Anleitung" title="Anleitung">?</button>
    </div>
  </div>
  <div class="card">
    <div class="stagewrap"><div id="stage"></div><button class="zoombtn" id="zoomBtn" title="Bild vergrössern">🔍</button></div>
    <div class="side">
      <div class="bar" id="bar"></div>
      <div class="panel" id="panel"></div>
    </div>
  </div>
</div>
<div id="einst" class="modal" hidden>
  <div class="mcard">
    <div class="mhead"><b>⚙ Einstellungen</b><button class="icon" data-einst="zu" aria-label="Schliessen">✕</button></div>
    <div id="einstText"></div>
    <div class="row"><button class="btn primary" data-einst="zu">Fertig</button></div>
  </div>
</div>
<div id="hilfe" class="modal" hidden>
  <div class="mcard">
    <div class="mhead"><b id="hilfeTitel"></b><button class="icon" data-hilfe="zu" aria-label="Schliessen">✕</button></div>
    <div id="hilfeText"></div>
    <div class="row"><button class="btn primary" data-hilfe="zu">Alles klar</button></div>
  </div>
</div>

<script>
// CORE-START
/* ---------- Schaltungsmodell ----------
   Bauteile: battery (Pole p/n), lamp (Anschlüsse a/b), switch (a/b)
   Kabel: verbinden zwei Anschlüsse (oder enden lose: free)
   Das Modell berechnet mit Knotenanalyse, welche Lämpchen leuchten
   und ob ein Kurzschluss vorliegt. */
const V=4.5, R_LAMP=10, R_WIRE=0.001, R_INT=0.05;

function termPos(c,t){
  if(c.type==='battery') return t==='p'?[c.x-45,c.y-43]:[c.x+45,c.y-43];
  return t==='a'?[c.x-50,c.y]:[c.x+50,c.y];
}
function comp(circ,id){return circ.comps.find(c=>c.id===id);}

function gauss(A,b){
  const n=b.length; A=A.map(r=>r.slice()); b=b.slice();
  for(let i=0;i<n;i++){
    let m=i; for(let k=i+1;k<n;k++) if(Math.abs(A[k][i])>Math.abs(A[m][i])) m=k;
    [A[i],A[m]]=[A[m],A[i]]; [b[i],b[m]]=[b[m],b[i]];
    const p=A[i][i]||1e-30;
    for(let k=i+1;k<n;k++){const f=A[k][i]/p; if(!f) continue; for(let j=i;j<n;j++) A[k][j]-=f*A[i][j]; b[k]-=f*b[i];}
  }
  const x=new Array(n).fill(0);
  for(let i=n-1;i>=0;i--){let s=b[i]; for(let j=i+1;j<n;j++) s-=A[i][j]*x[j]; x[i]=s/(A[i][i]||1e-30);}
  return x;
}

function simulate(circ,broken,sw){
  const bat=circ.comps.find(c=>c.type==='battery');
  const P=bat.id+'.p', GND=bat.id+'.n';
  const els=[];
  circ.wires.forEach(w=>{ if(!broken.has(w.id)) els.push([w.from, w.to||('free:'+w.id), R_WIRE]); });
  circ.comps.forEach(c=>{
    if(c.type==='lamp' && !broken.has(c.id)) els.push([c.id+'.a',c.id+'.b',R_LAMP]);
    if(c.type==='switch' && sw[c.id] && !broken.has(c.id)) els.push([c.id+'.a',c.id+'.b',R_WIRE]);
  });
  const keys=new Set([P]);
  els.forEach(e=>{keys.add(e[0]);keys.add(e[1]);});
  circ.comps.forEach(c=>{ if(c.type!=='battery'){keys.add(c.id+'.a');keys.add(c.id+'.b');} });
  keys.delete(GND);
  const list=[...keys], map={}; list.forEach((k,i)=>map[k]=i);
  const n=list.length, G=list.map(()=>new Array(n).fill(0)), I=new Array(n).fill(0);
  const add=(a,b,g)=>{const i=map[a],j=map[b];
    if(i!==undefined) G[i][i]+=g; if(j!==undefined) G[j][j]+=g;
    if(i!==undefined&&j!==undefined){G[i][j]-=g;G[j][i]-=g;}};
  els.forEach(([a,b,R])=>add(a,b,1/R));
  add(P,GND,1/R_INT); I[map[P]]+=V/R_INT;
  for(let i=0;i<n;i++) G[i][i]+=1e-9;
  const v=gauss(G,I), volt=k=>k===GND?0:v[map[k]];
  const lamps={};
  circ.comps.filter(c=>c.type==='lamp').forEach(c=>{
    lamps[c.id]=!broken.has(c.id) && Math.abs(volt(c.id+'.a')-volt(c.id+'.b'))>0.3*V;
  });
  return {lamps, short: volt(P)<0.5*V};
}

function swCombos(circ){
  const ids=circ.comps.filter(c=>c.type==='switch').map(c=>c.id), out=[];
  for(let m=0;m<(1<<ids.length);m++){const s={}; ids.forEach((id,i)=>s[id]=!!(m&(1<<i))); out.push(s);}
  return out;
}
function signature(circ,broken){
  return JSON.stringify(swCombos(circ).map(sw=>simulate(circ,broken,sw)));
}
function candidates(t){
  const circ=t.circuit, target=signature(circ,new Set([t.hidden])), out=new Set();
  const ids=[...circ.wires.map(w=>w.id), ...circ.comps.filter(c=>c.type==='lamp').map(c=>c.id)];
  ids.forEach(id=>{ if(signature(circ,new Set([id]))===target) out.add(id); });
  return out;
}
function applyFix(circ,fix){
  if(!fix) return circ;
  const wires=[];
  circ.wires.forEach(w=>{
    if(!(w.id in fix)) wires.push(w);
    else if(fix[w.id]!==null) wires.push(Object.assign({},w,fix[w.id]));
  });
  return {comps:circ.comps, wires};
}

/* ---------- Aufgaben ---------- */
const BAT={id:'B',type:'battery',x:400,y:415,name:'die Batterie'};
const lamp=(id,x,y,name,label)=>({id,type:'lamp',x,y,name:name||('Lämpchen '+id),label:label===undefined?id:label});
const swc=(id,x,y)=>({id,type:'switch',x,y,closed:true,name:'der Schalter'});

function rpath(pts,r=18){

    const d1=Math.hypot(x1-x0,y1-y0), d2=Math.hypot(x2-x1,y2-y1);
    if(!d1||!d2){d+=` L${x1},${y1}`;continue;}
    const rr=Math.min(r,d1/2,d2/2);
    d+=` L${x1+(x0-x1)/d1*rr},${y1+(y0-y1)/d1*rr} Q${x1},${y1} ${x1+(x2-x1)/d2*rr},${y1+(y2-y1)/d2*rr}`;

function circBox(circ){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const put=(x,y)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);};
  circ.comps.forEach(c=>{
    if(c.type==='battery'){ put(c.x-84,c.y-54); put(c.x+84,c.y+44); }
    else if(c.type==='lamp'){ put(c.x-48,c.y-74); put(c.x+48,c.y+44); }
    else { put(c.x-54,c.y-52); put(c.x+54,c.y+44); } });
  circ.wires.forEach(w=>wirePts(circ,w).forEach(pt=>put(pt[0],pt[1])));
  const m=30; return {x:x0-m,y:y0-m,w:(x1-x0)+2*m,h:(y1-y0)+2*m};
}

function whyNot(t,e){
  const circ=t.circuit, hasSw=circ.comps.some(c=>c.type==='switch');
  for(const sw of swCombos(circ)){
    const a=simulate(circ,new Set([t.hidden]),sw), h=simulate(circ,new Set([e]),sw);
    for(const L in a.lamps) if(a.lamps[L]!==h.lamps[L]){
      const swT=hasSw?(Object.values(sw)[0]?' bei geschlossenem Schalter':' bei offenem Schalter'):'';
      return `<b>${cap(nameOf(t,e))}</b>: Wäre es kaputt, würde ${L}${swT} ${h.lamps[L]?'leuchten':'nicht leuchten'}. ${L} ${a.lamps[L]?'leuchtet aber':'leuchtet aber nicht'}.`;
    }
  }
  return cap(nameOf(t,e));
}
function nextBtn(t){
  const n=cur+1<TASKS.length?cur+1:null;
  if(n===null) return '<div class="row"><button class="btn primary" data-stufe="4">Weiter zu Stufe 4 →</button></div>';
  const lbl=TASKS[n].stufe!==t.stufe?`Weiter zu Stufe ${TASKS[n].stufe} →`:'Nächste Aufgabe →';
  return `<div class="row"><button class="btn primary" data-act="next">${lbl}</button></div>`;

const merke=t=>`<div class="merke">📌 <b>Merke:</b> ${t}</div>`;
function repairedMsg(st){
  const open=Object.values(st.sw).some(v=>!v);
  return `<p class="msg ok">🔧 Repariert!${open?' Schliesse den Schalter und schau, was passiert.':''}</p>`;
}
function renderPanel(){
  const t=TASKS[cur], st=S[cur]; let h='';
  if(t.stufe<3){
    if(st.phase==='predict'){
      h+=`<p class="lead">Schau dir den Stromkreis genau an: <b>Welche Lämpchen leuchten?</b> Tippe sie an. Wenn keines leuchtet, tippe keines an.</p>`;
      if(st.msg) h+=`<p class="msg info">${st.msg}</p>`;
      return h+`<div class="row"><button class="btn primary" data-act="predict">Prüfen</button></div>`;
    }
    if(st.predRes){const all=Object.values(st.predRes).every(v=>v);
      h+=`<p class="msg ${all?'ok':'bad'}">${all?'Deine Vorhersage stimmt!':'Deine Vorhersage stimmt nicht ganz – schau, welche Lämpchen wirklich leuchten.'}</p>`;}
    if(st.phase==='find'){
      h+=`<p class="lead">${t.stufe===1?'Das Lämpchen sollte leuchten – tut es aber nicht.':'Eigentlich sollten alle Lämpchen leuchten.'} <b>Tippe auf die Stelle mit dem Fehler.</b></p>`;
      if(st.msg) h+=`<p class="msg bad">${st.msg}</p>`;
      if(st.wrong>=2) h+=`<p class="hint">💡 Tipp: ${t.hint}</p>`;
      return h;
    }
    h+=`<p class="msg ok">✅ Gefunden: ${nameOf(t,t.fault)}.</p><p class="lead"><b>${t.mc.q}</b></p><div class="mc">`;
    t.mc.opts.forEach((o,i)=>{let cl='opt'; if(st.mc!==null){if(i===t.mc.c) cl+=' right'; else if(i===st.mc) cl+=' wrongsel';}
      h+=`<button class="${cl}" data-act="mc" data-i="${i}" ${st.mc!==null?'disabled':''}>${o}</button>`;});
    h+='</div>';
    if(st.mc!==null){
      const richtig=st.mc===t.mc.c;
      // Bei richtiger Antwort ist die Erklärung ein Merksatz, bei falscher eine Korrektur.
      h+= richtig ? `<p class="msg ok">Richtig!</p>`+merke(t.mc.expl)
                  : `<p class="msg bad">Nicht ganz. ${t.mc.expl}</p>`;
      h+= st.phase==='done' ? repairedMsg(st)+nextBtn(t) : `<div class="row"><button class="btn primary" data-act="repair">🔧 Reparieren</button></div>`;
    }
    return h;
  }
  // Stufe 3
  if(st.phase==='mark'){
    h+=`<p class="lead">Alle Kabel sehen richtig aus – aber irgendwo ist etwas im Innern kaputt. Probiere den Schalter aus. <b>Markiere dann alle Stellen, an denen der Fehler sein könnte.</b></p>`;
    if(st.msg) h+=`<p class="msg info">${st.msg}</p>`;
    return h+`<div class="row"><button class="btn primary" data-act="check" ${st.marks.size?'':'disabled'}>Prüfen (${st.marks.size} markiert)</button></div>`;
  }
  const cands=st.check, ok=[...st.marks].filter(x=>cands.has(x)), bad=[...st.marks].filter(x=>!cands.has(x)), miss=[...cands].filter(x=>!st.marks.has(x));
  const perfect=!bad.length&&!miss.length;
  if(st.phase==='checked'){
    h+= perfect?`<p class="msg ok">🎯 Perfekt eingegrenzt!</p>`:`<p class="msg bad">Noch nicht ganz.</p>`;
    if(ok.length) h+=`<p class="lead">✓ Passt: ${ok.map(x=>nameOf(t,x)).join(', ')}</p>`;
    if(bad.length) h+=`<ul class="res">${bad.map(x=>`<li>${whyNot(t,x)}</li>`).join('')}</ul>`;
    if(miss.length) h+=`<p class="lead">○ Übersehen: ${miss.map(x=>nameOf(t,x)).join(', ')} – auch dann würde alles genau so aussehen.</p>`;
    if(perfect) h+=merke(t.lesson);
    return h+`<div class="row">${perfect?'':'<button class="btn" data-act="retry">Nochmals versuchen</button>'}<button class="btn primary" data-act="reveal">Auflösen</button></div>`;
  }
  h+=`<p class="msg info">🔍 ${t.reveal}</p>`;
  if(!perfect) h+=merke(t.lesson);
  return h+(st.phase==='done'?repairedMsg(st)+nextBtn(t):`<div class="row"><button class="btn primary" data-act="repair">🔧 Reparieren</button></div>`);
}

/* ---------- Haushalt: Panel ---------- */
function houseWhyNot(h,id){
  const o=allObs(h).filter(o=>!o.info).find(o=>o.T.includes(id)!==o.bad);
  if(!o) return '';
  return o.bad ? `«${o.text}» – damit hat ${HE[id].name} nichts zu tun. Der Fehler muss woanders liegen.`
               : `«${o.text}» – dafür muss ${HE[id].name} in Ordnung sein.`;
}
function housePanel(h){
  const L=LEVELS[h.lv]; let p='';
  p+=`<p class="complaint">📢 ${complaintOf(h)}</p>`;

    p+= h.lv===4
      ? `<p class="lead">Genau <b>ein</b> Teil ist kaputt. Du siehst den Raum von Weitem – kleine Einzelheiten musst du aus der Nähe prüfen. Wähle Prüfschritte, bis du sicher bist, und tippe dann im Bild auf das kaputte Teil. <span style="color:#1a9e55;font-weight:600">✓ = sicher in Ordnung</span></p>`
      : `<p class="lead">Genau <b>ein</b> Teil ist kaputt. Schau zuerst genau hin, was noch funktioniert – das verrät schon viel. Kleine Einzelheiten siehst du von hier aus nicht, die musst du aus der Nähe prüfen. Tippe im Bild auf das kaputte Teil, sobald du sicher bist.</p>`;
  }
  const obs=allObs(h);
  p+=`<div class="proto"><div class="sub" style="margin-top:0">📋 Beobachtungen</div><ul>`+
     obs.map(o=>`<li>${o.icon} ${o.label?o.label+': ':''}<span class="res ${o.info?'neutral':o.bad?'badr':'good'}">${o.text}</span></li>`).join('')+`</ul></div>`;
  if(h.phase==='search'){
    if(h.msg) p+=`<p class="msg ${h.msgType}">${h.msg}</p>`;
    if(h.sel){
      p+=`<div class="row"><button class="btn primary" data-act="hanswer">🔎 ${HE[h.sel].label}: Hier ist der Fehler!</button><button class="btn" data-act="hunsel">Abbrechen</button></div>`;
    }
    const av=availTests(h);
    if(av.length){
      p+=`<div class="sub">Prüfschritte (${h.done.length} gemacht)</div><div class="tgrid">`+
         av.map(t=>`<button class="tbtn" data-act="htest" data-t="${t.id}">${t.icon} ${t.label}</button>`).join('')+`</div>`;
    }
    const extra=[];
    if(h.lv===5) extra.push(`<button class="btn" data-act="hhelp">${h.help?'🙈 Hilfe ausblenden':'💡 Hilfe: Was ist sicher in Ordnung?'}</button>`);
    if(h.wrong>=2) extra.push(`<button class="btn" data-act="hgiveup">🔍 Zeig mir die Lösung</button>`);
    if(extra.length) p+=`<div class="row">${extra.join('')}</div>`;
    return p;
  }
  const n=h.done.length;
  p+= h.gaveup
    ? `<p class="msg info">🔍 Die Lösung: ${HE[h.fault].what||cap(HE[h.fault].name)+' ist kaputt.'}</p>`
    : `<p class="msg ok">✅ Richtig: ${HE[h.fault].what||cap(HE[h.fault].name)+' ist kaputt.'}</p>`;
  if(h.gaveup) p+=`<p class="lead">Schau dir an, welche Beobachtungen dazu passen. Beim nächsten Fall hilft dir das weiter.</p>`;
  else if(h.lucky) p+=`<p class="msg bad">Aber Achtung: Nach deinen Beobachtungen ${h.lucky.startsWith('noch')?'kamen '+h.lucky:'kam auch '+h.lucky} in Frage. Da hattest du Glück!</p>`;
  else if(!h.gaveup) p+=`<p class="msg ok">🎯 Und du konntest es sicher wissen – sauber eingegrenzt!</p>`;
  p+= h.pro===0
    ? `<p class="lead">Hier hättest du es sogar <b>ohne Prüfschritt</b> herausfinden können – nur durch genaues Hinschauen. Du hast ${n} gebraucht.</p>`
    : `<p class="lead">Du hast <b>${n}</b> Prüfschritt${n===1?'':'e'} gebraucht. Mit einer guten Strategie genügen höchstens <b>${h.pro}</b>.</p>`;
  if(h.phase==='solved') return p+`<div class="row"><button class="btn primary" data-act="hrepair">🔧 Reparieren</button></div>`;
  return p+`<p class="msg info">🔧 ${HE[h.fault].fix}</p><div class="row"><button class="btn primary" data-act="hnew">Neuer Fall →</button></div>`;
}
function houseClick(id){
  const h=HS[mode]; if(h.phase!=='search') return;
  if(id==='bild'){ h.msg='Der Bildschirm ist in Ordnung – er zeigt dir aber, ob bei der Steckerleiste Strom ankommt.'; h.msgType='info'; h.sel=null; return; }
  if(id==='tlamp'&&h.lv===4){ h.msg='Die Prüflampe funktioniert sicher – sie ist dein Werkzeug.'; h.msgType='info'; h.sel=null; return; }

function houseAct(act,b){
  const h=HS[mode];
  switch(act){
    case 'htest': { const t=LEVELS[h.lv].tests.find(t=>t.id===b.dataset.t);
      h.done.push(t.id); if(t.swap) h.swapped.push(t.swap); if(t.light) h.lightOn=true;
      if(t.turnOn) h.off=h.off.filter(x=>x!==t.turnOn); h.msg=''; break; }
    case 'hunsel': h.sel=null; h.msg=''; break;
    case 'hhelp': h.help=!h.help; break;
    case 'hanswer': {
      const c=hCands(h), id=h.sel;
      if(id===h.fault){
        const others=c.filter(x=>x!==id);
        h.lucky=!others.length?false:others.length>2?`noch ${others.length} andere Teile`:others.map(x=>HE[x].name).join(' oder ');
        h.phase='solved'; h.solved++; h.sel=null; h.msg='';
      } else if(!c.includes(id)){
        h.wrong++; h.msg='Das kann nicht sein: '+houseWhyNot(h,id); h.msgType='bad';
      } else {
        h.wrong++;
        h.msg=`${cap(HE[id].name)} hätte es sein können – ist es aber nicht. Mit deinen Beobachtungen konntest du das noch nicht wissen. Mach einen weiteren Prüfschritt!`; h.msgType='bad';
      }
      break; }
    case 'hgiveup': h.phase='solved'; h.gaveup=true; h.lucky=false; h.sel=null; h.msg=''; break;
    case 'hrepair': h.phase='repaired'; break;
    case 'hnew': HS[mode]=newCase(mode,h); break;
  }
}

/* ---------- Stufe 6: Küche – Leistung, Stromstärke, Überlastung ---------- */
const U_NETZ=230, I_OPTS=[10,13,16], I_DEF=13;
const KD={
 kuehl:{name:'Kühlschrank',art:'Der',w:150,always:true},
 lampe:{name:'Deckenlampe',art:'Die',w:10},
 wasser:{name:'Wasserkocher',art:'Der',w:2000},
 kaffee:{name:'Kaffeemaschine',art:'Die',w:1450},
 toast:{name:'Toaster',art:'Der',w:900},
 mikro:{name:'Mikrowelle',art:'Die',w:1200}
};
const KIDS=Object.keys(KD), KURZ=['toast','wasser','kaffee','mikro'];
const amp=w=>w/U_NETZ, fmt=(n,d)=>n.toFixed(d).replace('.',',');
let K=null;
function kWatt(k){ return KIDS.filter(id=>k.on[id]).reduce((s,id)=>s+KD[id].w,0); }
function kIds(k){ return KIDS.filter(id=>k.on[id]); }
function kRatio(k){ return amp(kWatt(k))/k.imax; }
function kTrip(k,kind){ k.fuse=false; k.heat=0; k.trip={kind,watt:kWatt(k),ids:kIds(k)}; }
function kEval(k){   // nur der Kurzschluss löst sofort aus
  if(!k.fuse) return;
  if(k.fault&&k.fault.type==='kurz'&&k.on[k.fault.dev]) kTrip(k,'kurz');
}
/* Überlast wirkt träge: der Bimetallstreifen muss zuerst warm werden. */
function kTick(dt){
  if(!K) return false;
  if(!K.fuse){ if(K.heat>0){ K.heat=0; return true; } return false; }
  const r=kRatio(K);
  if(r>1.002){ const tt=r>=1.45?1.6:5.5; K.heat=Math.min(1,K.heat+dt/tt);
    if(K.heat>=1){ kTrip(K,'last'); K.msg=''; } return true; }
  if(K.heat>0){ K.heat=Math.max(0,K.heat-dt/5); return true; }
  return false;
}
function newKitchen(tab,prev){
  const k={tab:tab||'erk',on:{},fuse:true,trip:null,fault:null,phase:'search',pick:null,msg:'',heat:0,wrong:0,gaveup:false,why:null,
           imax:prev?prev.imax:I_DEF,typ:prev?prev.typ:'ls',spare:prev?prev.spare:3,
           geloest:prev?prev.geloest||0:0,fuehrung:prev?prev.fuehrung!==false:true,resets:0,modus:null,
           erk:1,erkFertig:prev?!!prev.erkFertig:false,
           caseNo:prev&&prev.tab==='fall'?prev.caseNo+1:1};
  KIDS.forEach(id=>k.on[id]=!!KD[id].always); k.on.lampe=true;
  if(k.tab==='fall'){
    if(Math.random()<0.5){
      let d; do{ d=KURZ[Math.floor(Math.random()*KURZ.length)]; }while(prev&&prev.fault&&prev.fault.dev===d);
      k.fault={type:'kurz',dev:d}; k.on[d]=true;
      KURZ.filter(x=>x!==d).forEach(x=>{ if(Math.random()<0.3&&KD[x].w+kWatt(k)<k.imax*U_NETZ) k.on[x]=true; });
    } else {
      k.fault={type:'last'};
      const combos=[];
      for(let m=1;m<(1<<KURZ.length);m++){
        const set=KURZ.filter((_,i)=>m&(1<<i));
        const w=160+set.reduce((s,id)=>s+KD[id].w,0);
        if(set.length>1&&amp(w)>k.imax*1.25) combos.push(set);
      }
      const pick=combos[Math.floor(Math.random()*combos.length)]||['wasser','kaffee','toast'];
      pick.forEach(d=>k.on[d]=true);
      kTrip(k,'last');
    }
    kEval(k);
  }
  return k;
}

/* Panel */
function kMeter(k){
  const short=!k.fuse&&k.trip&&k.trip.kind==='kurz';
  const w=k.fuse?kWatt(k):(k.trip?k.trip.watt:0), a=amp(w);
  const max=k.imax/0.8;                       // Grenze liegt bei 80 % der Skala
  const pct=short?100:Math.min(100,a/max*100), over=a>k.imax;
  const col=short?'#d93636':over?(k.fuse?'#f08c00':'#d93636'):'#1a9e55';
  const aus=!k.fuse&&k.trip;
  const v = aus ? `Gemessen: ${short?`weit mehr als ${k.imax} A`:`${fmt(a,1)} A`}`
                : `${fmt(a,1)} A von ${k.imax} A (${w} W)`;
  // Bei jedem Auslösen den erwarteten Wert danebenstellen – der Vergleich ist die eigentliche Denkarbeit
  const erwartet=aus?`<div class="dlist" style="margin-top:2px">Nach den Geräten <b>erwartet</b>: ${fmt(amp(k.trip.watt),1)} A</div>`:'';
  return `<div class="meter">
    <div class="mscale"><span class="mtick">${k.imax} A erlaubt</span></div>
    <div class="mbar"><div class="mzone"></div>
    <div class="mfill" style="width:${pct}%;background:${col}"></div><div class="mlimit"></div>
    ${short?'<div class="mover">▸▸▸</div>':''}</div>
    <div class="mval" style="color:${col}">${v}</div>${erwartet}
    ${k.fuse&&k.heat>0?`<div class="heat"><div class="hfill" style="width:${Math.round(k.heat*100)}%"></div></div>
      <div class="mval" style="color:#b35c00;font-size:.98rem">🔥 Die Sicherung wird warm – gleich löst sie aus!</div>`:''}
    ${!k.fuse?`<div class="dlist">Gemessen im Moment des Auslösens. Jetzt fliesst nichts mehr.</div>`:''}</div>`;
}
function kList(k){
  const ids=(!k.fuse&&k.trip?k.trip.ids:KIDS.filter(id=>k.on[id]));
  if(!ids.length) return '';
  const rows=ids.map(id=>`${KD[id].name}: ${KD[id].w} W ÷ ${U_NETZ} V = ${fmt(amp(KD[id].w),amp(KD[id].w)<1?2:1)} A`).join('<br>');
  const w=ids.reduce((s,id)=>s+KD[id].w,0);
  return `<div class="dlist"><b>So viel brauchen die eingeschalteten Geräte:</b><br>${rows}<br><span class="sum">Zusammen: ${w} W ÷ ${U_NETZ} V = ${fmt(amp(w),1)} A</span></div>`;
}
const gefuehrt=k=>k.tab==='fall'&&k.fuehrung&&k.geloest<2;
function kResetRow(k){
  if(k.fuse) return '';

    ? `<div class="row"><button class="btn primary" data-act="kreset">🔌 Sicherung wieder einschalten</button></div>`
    : (k.spare>0

/* Geführter Modus: immer nur ein Schritt, und nur das, was dieser Schritt braucht. */
function fuehrung(k){
  const schritt = k.modus==='kurz' ? 2 : 1;
  const titel = schritt===1
    ? 'Vergleiche die beiden Zahlen: <b>gemessen</b> und <b>erwartet</b>.'
    : 'Finde das Gerät: <b>alle ausschalten</b>, <b>Sicherung ein</b>, dann <b>eines nach dem anderen</b> probieren.';
  let p=`<div class="weg"><div class="wegtitel">Schritt ${schritt} von 3</div><div class="wegtext">${titel}</div></div>`;
  p+=kMeter(k);
  p+=`<details class="rechnung"><summary>Rechnung anzeigen</summary>${kList(k)}</details>`;
  if(k.msg) p+=`<p class="msg bad">${k.msg}</p>`;
  if(schritt===1){
    p+=`<div class="mc">
      <button class="opt" data-act="kans" data-v="last">Zu viele Geräte gleichzeitig – Überlastung</button>
      <button class="opt" data-act="kans" data-v="kurz">Ein Gerät hat einen Kurzschluss</button>
      <button class="opt" data-act="kans" data-v="sich">Die Sicherung ist zu schwach – eine stärkere einsetzen</button></div>`;
  } else {
    const row=[];
    if(KURZ.some(id=>k.on[id])) row.push(`<button class="btn" data-act="kalloff">⏻ Alle Geräte ausschalten</button>`);
    if(row.length) p+=`<div class="row">${row.join('')}</div>`;
    p+=kResetRow(k);
    p+=`<div class="sub">Gefunden? Dann tippe das Gerät an:</div><div class="tgrid">`+
       KURZ.map(id=>`<button class="tbtn" data-act="kdev" data-v="${id}">${KD[id].name}</button>`).join('')+`</div>`;
    p+=`<div class="row"><button class="btn" data-act="kzurueck">↩ Keines löst allein aus? Zurück zur Ursache</button></div>`;
  }
  if(k.wrong>=2) p+=`<div class="row"><button class="btn" data-act="kgiveup">🔍 Zeig mir die Lösung</button></div>`;
  return p;
}

       ['Die Leitung in der Wand ist zu dünn.',false]];
  if(k.why===null){
    if(k.fuehrung&&k.geloest<=2) p+=`<div class="weg"><div class="wegtitel">Schritt 3 von 3</div><div class="wegtext">Begründe deine Antwort.</div></div>`;
    p+=`<div class="sub">Und woran merkst du das?</div><div class="mc">`+
       WARUM.map((o,i)=>`<button class="opt" data-act="kwhy" data-v="${i}">${o[0]}</button>`).join('')+`</div>`;
    return p;
  }
  p+=`<div class="mc">`+WARUM.map((o,i)=>{ let cl='opt';
      if(o[1]) cl+=' right'; else if(i===k.why) cl+=' wrongsel';
      return `<button class="${cl}" disabled>${o[0]}</button>`; }).join('')+`</div>`;
  p+=`<p class="msg ${WARUM[k.why][1]?'ok':'bad'}">${WARUM[k.why][1]?'Genau.':'Nicht ganz.'}</p>`;
  if(kurz){
    p+=`<p class="lead">${d.art} ${d.name} braucht eigentlich nur ${d.w} W, also ${fmt(amp(d.w),1)} A. Trotzdem löst die Sicherung sofort aus. Im Gerät hat der Strom einen Weg fast ohne Widerstand gefunden – wie beim gelben Kabel in Stufe 1. Dann fliesst ein sehr grosser Strom, und die Sicherung schaltet ab, bevor die Leitung heiss wird.</p>
        <p class="msg info">🔧 ${d.art} ${d.name} nicht mehr einschalten und reparieren lassen oder ersetzen.</p>`;
  } else {
    const ids=k.trip?k.trip.ids:[], w=ids.reduce((s,id)=>s+KD[id].w,0);
    p+=`<p class="lead">${fmt(amp(w),1)} A statt der erlaubten ${k.imax} A. Die Sicherung schützt die Leitung in der Wand: Bei zu viel Strom würde sie heiss werden und könnte einen Brand auslösen.</p>
        <p class="msg info">🔧 Nicht alles gleichzeitig: zuerst Wasser kochen, dann toasten. Oder ein Gerät an einen anderen Stromkreis hängen.</p>`;
  }
  return p+`<div class="row"><button class="btn primary" data-act="knew">Neuer Fall →</button></div>`;
}
/* Der Erkunden-Teil führt beim ersten Mal durch drei Schritte. */
const ERKWEG=k=>[
 'Der <b>Kühlschrank</b> läuft immer. Seine <b>Leistung</b> ist 150 W. Bei 230 V fliessen dadurch 0,65 A. Tippe jetzt den <b>Wasserkocher</b> an.',
 'Der Wasserkocher hat <b>2000 W</b> – viel mehr. Schau in der Anzeige, wie die <b>Stromstärke</b> gestiegen ist. Tippe jetzt die <b>Kaffeemaschine</b> an.',
 `Die Ströme <b>zählen zusammen</b>. Schalte weiter Geräte ein, bis die Sicherung auslöst – sie erlaubt höchstens ${k.imax} A.`,
 'Zusammen brauchten die Geräte mehr Strom, als die Sicherung erlaubt. <b>Je mehr Watt ein Gerät hat, desto mehr Ampere fliessen</b> – und die Ampere aller Geräte zählen zusammen. Jetzt kannst du frei ausprobieren.'][Math.min(k.erk,4)-1];
function kErkTick(k){
  if(k.tab!=='erk'||!k.fuehrung) return;
  if(k.erkFertig){ if(k.erk===4) k.erk=5; return; }
  let n=1;
  if(k.on.wasser) n=2;
  if(k.on.wasser&&k.on.kaffee) n=3;
  if(!k.fuse) n=4;
  k.erk=Math.max(k.erk,n);
  if(k.erk===4) k.erkFertig=true;
}
function kitchenClick(id){
  if(gefuehrt(K)&&K.phase==='search'&&K.modus!=='kurz'){
    K.msg='Im ersten Schritt musst du nichts umschalten – vergleiche nur die beiden Zahlen in der Anzeige.'; return; }
  if(id==='fuse'){ if(!K.fuse&&(K.typ==='ls'||K.spare>0)) kitchenAct('kreset',null); return; }
  if(K.phase!=='search') return;
  if(KD[id].always){ K.msg='Der Kühlschrank läuft immer – den schaltet man nicht aus.'; return; }
  K.on[id]=!K.on[id]; K.msg=''; kEval(K); kErkTick(K);
}
function kitchenAct(act,b){
  switch(act){
    case 'ktab': K=newKitchen(b.dataset.v,K); break;
    case 'kfuse': { K.imax=+b.dataset.v; K.heat=0; K.msg=''; break; }
    case 'ktyp': { K.typ=b.dataset.v; K.msg=''; break; }
    case 'kbuy': { K.spare=3; K.msg=''; break; }
    case 'kalloff': { KURZ.forEach(id=>K.on[id]=false); K.heat=0; K.msg=''; break; }
    case 'kreset': { if(K.typ==='schmelz'){ if(!K.spare) break; K.spare--; }
      K.resets++; K.fuse=true; K.trip=null; K.heat=0; K.msg=''; kEval(K);
      if(!K.fuse) K.msg=K.typ==='ls'?'Sie fliegt sofort wieder raus! Schalte zuerst etwas aus.'
                                     :'Die neue Sicherung ist sofort wieder durchgebrannt! Schalte zuerst etwas aus.';
      else if(kRatio(K)>1) K.msg='Achtung: Es sind immer noch zu viele Geräte eingeschaltet.'; break; }
    case 'kans': { const v=b.dataset.v;
      if(v==='sich'){ K.wrong++; K.msg='Nein. Die Sicherung ist nicht der Fehler, sondern der Schutz. Eine stärkere einzusetzen wäre gefährlich: Dann fliesst mehr Strom, als die Leitung in der Wand aushält.'; K.pick=null; }
      else if(v==='kurz'){ K.pick='kurz'; K.modus='kurz'; K.msg=''; }
      else { if(K.fault.type==='last'){ K.phase='done'; K.geloest++; } else { K.wrong++; K.msg='Nicht ganz. Schau nochmals: Reicht die Summe der eingeschalteten Geräte überhaupt für eine Überlastung?'; } K.pick=null; }
      break; }
    case 'kdev': { const d=b.dataset.v;
      if(K.fault.type==='kurz'&&K.fault.dev===d){ K.phase='done'; K.geloest++; }
      else if(K.fault.type==='kurz'){ K.wrong++; K.msg=`Nein, ${KD[d].name} ist es nicht. Schalte die Geräte einzeln ein – bei welchem löst die Sicherung sofort aus?`; }
      else { K.wrong++; K.msg='Kein Gerät hat einen Kurzschluss. Zähle zusammen, wie viel Strom die eingeschalteten Geräte zusammen brauchen.'; }
      K.pick=null; break; }
    case 'kwhy': K.why=+b.dataset.v; break;
    case 'kfuehr': K.fuehrung=!K.fuehrung; break;
    case 'kzurueck': K.modus=null; K.pick=null; K.msg=''; break;
    case 'kgiveup': K.phase='done'; K.gaveup=true; K.pick=null; K.msg=''; break;
    case 'knew': K=newKitchen('fall',K); break;
    case 'erkweiter': K.erkFertig=true; K.erk=4; break;
  }
}

function curStufe(){ return mode==='circ'?TASKS[cur].stufe:mode; }
function renderTabs(){
  document.getElementById('tabs').innerHTML=STUFEN.map(([n,l])=>
    `<button class="tab ${curStufe()===n?'on':''}" data-stufe="${n}">${n} · ${l}</button>`).join('');
  const on=document.querySelector('.tabs .tab.on');
  if(on&&on.parentElement.scrollWidth>on.parentElement.clientWidth) on.scrollIntoView({block:'nearest',inline:'center'});
}
function renderBar(){
  if(mode===6){ document.getElementById('bar').innerHTML=`<span class="t">Stufe 6 · Küche${K.tab==='fall'?' · Fall '+K.caseNo:''}</span>
     <span class="dots"><button class="icon" data-act="ktab" data-v="${K.tab}" title="${K.tab==='fall'?'Neuer Fall':'Neu starten'}">↺ ${K.tab==='fall'?'Neuer Fall':'Neu starten'}</button></span>`; return; }
  if(mode!=='circ'){ const h=HS[mode];
    document.getElementById('bar').innerHTML=`<span class="t">Stufe ${mode} · Fall ${h.caseNo}${h.solved?` · ${h.solved} gelöst`:''}</span>
     <span class="dots"><button class="icon" data-act="hnew" title="Neuer Fall">↺ Neuer Fall</button></span>`;
    return; }
  const t=TASKS[cur], idx=TASKS.map((x,i)=>i).filter(i=>TASKS[i].stufe===t.stufe);
  document.getElementById('bar').innerHTML=`<span class="t">Stufe ${t.stufe} · Aufgabe ${idx.indexOf(cur)+1}/${idx.length}</span>
   <span class="dots">${idx.map((i,k)=>`<button class="dot ${i===cur?'on':''} ${S[i].done?'done':''}" data-go="${i}">${k+1}</button>`).join('')}
   <button class="icon" data-act="reset" title="Aufgabe neu starten">↺</button></span>`;
}
/* ===== Direktlinks: …#4-pruefen öffnet gleich die vierte Stufe =====
   replaceState statt location.hash, sonst sammelt der Zurück-Knopf jeden
   Stufenwechsel als eigenen Schritt. */
const KUERZEL={1:'fehler-sehen',2:'vorhersagen',3:'eingrenzen',4:'pruefen',5:'ausschliessen',6:'ueberlastung'};
let hashStumm=false;
/* Die gewünschte Stufe wird hier gelesen, bevor irgendein render() laufen
   kann – sonst überschreibt das erste render() die Adresse mit Stufe 1. */
const STARTHASH=location.hash||'';
let startFertig=false;
function adresse(){
  if(hashStumm||!startFertig) return;
  const n=curStufe(), k=KUERZEL[n];
  if(!k) return;
  const h='#'+n+'-'+k;
  // In einer Vorschau (eingebettete Seite) darf die Adresse nicht geändert
  // werden – das Werkzeug soll deswegen nicht stehen bleiben.
  if(location.hash!==h){ try{ history.replaceState(null,'',h); }catch(e){} }
}
function ausAdresse(){
  const m=/^#?(\d)/.exec(startFertig?(location.hash||''):STARTHASH);
  if(!m) return false;
  const n=Number(m[1]);
  if(!KUERZEL[n]) return false;
  hashStumm=true;
  if(n>=4) startHouse(n); else { mode='circ'; cur=TASKS.findIndex(x=>x.stufe===n); }
  hashStumm=false;
  return true;
}
addEventListener('hashchange',()=>{ if(ausAdresse()) render(); });

function render(){ adresse(); renderTabs(); renderBar();
  if(!document.getElementById('einst').hidden)
    document.getElementById('einstText').innerHTML=einstInhalt();
  if(mode===6){
    document.getElementById('stage').innerHTML=kitchenSVG(K);
    document.getElementById('panel').innerHTML=kitchenPanel(K);
    return; }
  if(mode!=='circ'){
    document.getElementById('stage').innerHTML=houseSVG(HS[mode]);
    document.getElementById('panel').innerHTML=housePanel(HS[mode]);
    return; }
  document.getElementById('stage').innerHTML=renderSVG();
  document.getElementById('panel').innerHTML=renderPanel(); }

/* ---------- Interaktion ---------- */
function flash(id){ S[cur].flash=id; const c=cur; setTimeout(()=>{ if(S[c].flash===id){S[c].flash=null; if(c===cur) render();} },750); }
function toggle(set,id){ set.has(id)?set.delete(id):set.add(id); }

document.getElementById('stage').addEventListener('click',e=>{
  if(mode===6){ const el=e.target.closest('[data-k]'); if(el){ kitchenClick(el.dataset.k); render(); } return; }
  if(mode!=='circ'){ const el=e.target.closest('[data-h]'); if(el){ houseClick(el.dataset.h); render(); } return; }
  const t=TASKS[cur], st=S[cur];
  const swEl=e.target.closest('[data-sw]');
  if(swEl){
    if(t.stufe===2&&st.phase==='predict'){ st.msg='Den Schalter kannst du nach dem Prüfen umlegen.'; render(); return; }
    st.sw[swEl.dataset.sw]=!st.sw[swEl.dataset.sw]; render(); return;
  }
  const el=e.target.closest('[data-el]'); if(!el) return;
  const id=el.dataset.el, type=typeOf(t,id);
  if(t.stufe<3){
    if(st.phase==='predict'){
      if(type==='lamp'){ toggle(st.pred,id); st.msg=''; }
      else st.msg='Tippe die Lämpchen an – hier geht es nur darum, welche leuchten.';
      render(); return; }
    if(st.phase!=='find') return;
    if(id===t.fault){ st.phase='question'; st.halo={[id]:'ok'}; st.msg=''; }
    else { st.wrong++; st.msg=`${cap(nameOf(t,id))} ist in Ordnung.`; flash(id); }
    render(); return;
  }
  if(st.phase!=='mark') return;
  if(type==='battery'){ st.msg='Die Batterie ist neu und in Ordnung.'; flash(id); render(); return; }
  toggle(st.marks,id); st.msg=''; render();
});

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-stufe],[data-go]'); if(!b||b.closest('#stage')) return;
  if(b.dataset.stufe){ const n=+b.dataset.stufe;
    if(n>=4) startHouse(n); else { mode='circ'; cur=TASKS.findIndex(x=>x.stufe===n); }
    render(); hilfeBeimErstenMal(); return; }
  if(mode===6){ if(b.dataset.act){ kitchenAct(b.dataset.act,b); render(); } return; }
  if(mode!=='circ'){ if(b.dataset.act){ houseAct(b.dataset.act,b); render(); } return; }
  const t=TASKS[cur], st=S[cur];
  if(b.dataset.go){ cur=+b.dataset.go; return render(); }
  switch(b.dataset.act){
    case 'reset': S[cur]=initState(t); break;
    case 'predict': {
      const sim=simulate(t.circuit,brokenOf(t,st),st.sw); st.predRes={};
      for(const L in sim.lamps) st.predRes[L]=(st.pred.has(L)===sim.lamps[L]);
      st.phase='find'; st.msg=''; break; }
    case 'mc': st.mc=+b.dataset.i; break;
    case 'repair': st.fixed=true; st.halo={}; st.phase='done'; st.done=true; break;
    case 'check': {
      st.check=candidates(t); st.halo={};
      st.marks.forEach(x=>st.halo[x]=st.check.has(x)?'ok':'bad');
      st.check.forEach(x=>{ if(!st.marks.has(x)) st.halo[x]='miss'; });
      st.phase='checked'; break; }
    case 'retry': st.phase='mark'; st.halo={}; break;
    case 'reveal': st.phase='revealed'; st.halo={}; break;
    case 'next': cur++; break;
  }
  render();
});

setInterval(()=>{ if(mode===6&&kTick(0.2)){ kErkTick(K); render(); } },200);

/* Vollbild: auf dem Tablet fällt die Adressleiste weg, im Unterricht lenkt weniger ab */
const ICON_FS_ON  = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const ICON_FS_OFF = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
/* Nicht am Gerät festmachen, sondern nachfragen, ob der Browser es kann.
   Auf dem iPhone sagt Safari nein, auf dem iPad je nach Version ja.
   Als Web-App vom Home-Bildschirm ist ohnehin schon alles Vollbild. */
const fsMoeglich=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
const fsCan=!standalone&&fsMoeglich&&!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
const fsBtn=document.getElementById('fsBtn');
function fsLabel(){
  const on=!!fsEl();
  document.documentElement.classList.toggle('fsmode',on);
  fsBtn.innerHTML=(on?ICON_FS_OFF:ICON_FS_ON)+`<span>${on?'Vollbild beenden':'Vollbild'}</span>`;
  fsBtn.setAttribute('aria-label',on?'Vollbild beenden':'Vollbild');
  fsBtn.title=on?'Vollbild beenden':'Vollbild';
  render();
}
if(fsCan){
  fsBtn.hidden=false; fsLabel();
  fsBtn.onclick=()=>{ const d=document, el=d.documentElement;
    if(fsEl()) (d.exitFullscreen||d.webkitExitFullscreen).call(d);
    else (el.requestFullscreen||el.webkitRequestFullscreen).call(el); };
  document.addEventListener('fullscreenchange',fsLabel);
  document.addEventListener('webkitfullscreenchange',fsLabel);
}

/* ---------- Kurzanleitung pro Stufe ---------- */
const HELP={
 1:['Fehler sehen','<p>Der Strom braucht einen <b>geschlossenen Weg</b>: vom Pluspol der Batterie durch das Lämpchen zurück zum Minuspol.</p><p>Hier stimmt jedes Mal etwas nicht. <b>Tippe im Bild auf die Stelle mit dem Fehler.</b> Danach kommt eine Frage dazu, und zum Schluss reparierst du.</p>'],
 2:['Vorhersagen','<p>Neu: Du sagst <b>zuerst voraus</b>, welche Lämpchen leuchten. Tippe sie an und drücke auf «Prüfen». Solange zeigen die Lämpchen ein Fragezeichen.</p><p>Danach suchst du den Fehler wie in Stufe 1.</p>'],
 3:['Eingrenzen','<p>Neu: Der Fehler ist <b>unsichtbar</b>. Von aussen sehen alle Kabel gut aus.</p><p>Probiere den Schalter aus und <b>markiere alle Stellen</b>, an denen der Fehler sein könnte. Das Programm sagt dir dann, welche wirklich dazu passen.</p>'],
 4:['Prüfen','<p>Ein Zimmer statt eines Stromkreises. Genau <b>ein Teil</b> ist kaputt, und man sieht ihm nichts an.</p>'+
   '<p>Wähle <b>Prüfschritte</b>: nachschauen, die Prüflampe einstecken, ein Teil austauschen. Jedes Ergebnis steht im Protokoll. Teile mit grünem Häkchen sind sicher in Ordnung.</p>'+
   '<p>Die <b>Prüflampe</b> ist eine Lampe, von der du sicher weisst, dass sie funktioniert. Wo sie leuchtet, kommt Strom an – wo sie dunkel bleibt, fehlt er. Darum ist sie dein Werkzeug.</p>'+
   '<p>Wenn du sicher bist: im Bild auf das kaputte Teil tippen.</p>'],
 5:['Ausschliessen','<p>Wie Stufe 4, aber mit mehr Geräten – und <b>ohne Häkchen</b>.</p><p>Hier zählt, was noch <b>funktioniert</b>: Läuft der Bildschirm, ist der Weg bis zur Steckerleiste in Ordnung. Achtung: Ein Gerät, das gar nicht eingeschaltet ist, sagt dir nichts.</p>'],
 6:['Überlastung','<p><b>Eine Küche, eine Sicherung.</b> Alle Geräte hängen an derselben Leitung.</p>'+
   '<p>Jedes Gerät zeigt zwei Zahlen: die <b>Leistung</b> in Watt (W) und die <b>Stromstärke</b> in Ampere (A), die dabei fliesst. Aus der Leistung und der Spannung (230 Volt) rechnest du die Stromstärke aus:</p>'+
   '<p style="text-align:center"><b>Stromstärke = Leistung ÷ Spannung</b><br><span style="color:#5A6672">I = P ÷ U</span></p>'+
   '<p><b>Je mehr Watt ein Gerät hat, desto mehr Strom braucht es.</b> Alle eingeschalteten Geräte zusammen dürfen nicht mehr Strom ziehen, als die Sicherung erlaubt – sonst wird die Leitung in der Wand heiss.</p>'+
   '<p>Zwei Ursachen sehen im ersten Moment gleich aus: Bei <b>Überlastung</b> wird die Sicherung zuerst warm und löst dann aus. Ein <b>Kurzschluss</b> löst sofort aus, obwohl das Gerät wenig Strom bräuchte.</p>'+
   '<p><b>So gehst du bei der Fehlersuche vor:</b></p><ol style="margin:6px 0;padding-left:20px;line-height:1.5">'+
   '<li>Gemessenen und erwarteten Strom vergleichen.</li>'+
   '<li>Gleich → Überlastung. Gemessen viel grösser → Kurzschluss.</li>'+
   '<li>Beim Kurzschluss alles ausschalten und die Geräte einzeln ausprobieren.</li>'+
   '<li>Antworten und begründen.</li></ol>']
};
const hilfeMem=new Set();   // falls der Browser localStorage sperrt (z. B. bei lokalen Dateien)
const hilfeGesehen=n=>{ if(hilfeMem.has(n)) return true;
  try{ return localStorage.getItem('stromkreis-hilfe-'+n)==='1'; }catch(e){ return false; } };
const hilfeMerken=n=>{ hilfeMem.add(n);
  try{ localStorage.setItem('stromkreis-hilfe-'+n,'1'); }catch(e){} };
function zeigeHilfe(n){
  const [t,txt]=HELP[n]||HELP[1];
  document.getElementById('hilfeTitel').textContent=`Stufe ${n} · ${t}`;
  document.getElementById('hilfeText').innerHTML=txt;
  document.getElementById('hilfe').hidden=false; hilfeMerken(n);
}
document.getElementById('helpBtn').onclick=()=>zeigeHilfe(curStufe());
document.getElementById('hilfe').addEventListener('click',e=>{
  if(e.target.id==='hilfe'||e.target.closest('[data-hilfe="zu"]')) document.getElementById('hilfe').hidden=true; });
/* Einstellungen. Die Knöpfe darin tragen dieselben data-act wie im Panel, also
   erledigt sie der allgemeine Klick-Empfänger weiter unten. «Von vorne beginnen»
   schliesst das Fenster, damit man gleich sieht, was passiert ist. */
function einstOeffnen(auf){
  const m=document.getElementById('einst');
  if(auf) document.getElementById('einstText').innerHTML=einstInhalt();
  m.hidden=!auf;
}
document.getElementById('einstBtn').onclick=()=>einstOeffnen(true);
document.getElementById('einst').addEventListener('click',e=>{
  if(e.target.id==='einst'||e.target.closest('[data-einst="zu"]')){ einstOeffnen(false); return; }
  const b=e.target.closest('[data-act]');
  if(b&&['reset','hnew','ktab'].includes(b.dataset.act)) setTimeout(()=>einstOeffnen(false),0);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(!document.getElementById('einst').hidden){ e.preventDefault(); einstOeffnen(false); return; }
  if(!document.getElementById('hilfe').hidden){ e.preventDefault(); document.getElementById('hilfe').hidden=true; }
});
function hilfeBeimErstenMal(){ const n=curStufe(); if(!hilfeGesehen(n)) zeigeHilfe(n); }

/* Lupe für kleine Bildschirme */
const zoomBtn=document.getElementById('zoomBtn');
zoomBtn.onclick=()=>{ const st=document.getElementById('stage');
  const an=st.classList.toggle('zoom'); zoomBtn.textContent=an?'🔎':'🔍';
  zoomBtn.title=an?'Bild verkleinern':'Bild vergrössern';
  if(an) requestAnimationFrame(()=>{ st.scrollLeft=(st.scrollWidth-st.clientWidth)/2;
    st.scrollTop=(st.scrollHeight-st.clientHeight)*0.62; });
  else render(); };

/* Fenstergrösse ändert den Bildausschnitt */
let fitT=null;
const refit=()=>{ clearTimeout(fitT); fitT=setTimeout(render,80); };
addEventListener('resize',refit);
addEventListener('orientationchange',refit);

ausAdresse();
startFertig=true;
render();
requestAnimationFrame(render);   // zweiter Durchgang, sobald das Layout steht
hilfeBeimErstenMal();
</script>
