<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grössen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Grössen im Stromkreis</title>
<style>
:root{--bg:#E6ECF1;--paper:#F8FAFB;--ink:#1D2935;--muted:#5A6672;--line:#C6D0D9;--btn:#FFFFFF;
  --accent:#2E6DB4;--ok:#23794A;--bad:#B8322A}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* Muss vor allen display-Regeln stehen: sonst überschreibt eine Klasse das hidden-Attribut */
[hidden]{display:none !important}
button{font:inherit}
html,body{height:100%}
body{margin:0;font-family:system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;font-size:16px;line-height:1.45;
  background:var(--bg);color:var(--ink);overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header,.top,.card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wrap{max-width:1700px;margin:0 auto;padding:12px 16px 16px;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:18px;box-sizing:border-box}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px 14px;flex:0 0 auto}
.top h1{grid-column:1;grid-row:1;justify-self:start}
.top .tabs{grid-column:2;grid-row:1;justify-self:center}
.top .tools{grid-column:3;grid-row:1;justify-self:end}
.top h1{justify-self:start}
.top .fsbtn{justify-self:end}
h1{font-size:1.5rem;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
/* Die sechs Stufen: gleich breit, jede mit eigenem Rand */
.top .tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;margin:0;
  border:1px solid var(--line);border-radius:14px;padding:3px;background:var(--paper)}
.top .tabs .tab{border:0;background:transparent;color:var(--ink);height:38px;padding:0 8px;font-size:.9rem;
  display:flex;align-items:center;justify-content:center;border-radius:11px;
  white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis}
.top .tabs .tab:hover:not(:disabled){background:#EEF2F7}
.top .tabs .tab.on,.top .tabs .tab.on:hover{background:var(--ink);color:var(--paper)}
.subtabs{display:flex;gap:6px;margin:6px 0 2px}
.tools{display:flex;align-items:center;gap:12px}
.fsbtn{margin-left:0;display:inline-flex;align-items:center;justify-content:center;gap:7px;font:inherit;font-size:.92rem;height:36px;
  border:1px solid var(--line);background:var(--btn);color:var(--muted);padding:0 14px;border-radius:999px;cursor:pointer}
.fsbtn:hover{border-color:var(--accent);color:var(--accent)}
.hilfebtn{width:36px;height:36px;padding:0;border-radius:999px;font-weight:700;font-size:.92rem;justify-content:center}
/* Zurück zur Übersicht – gleiche Form wie «?» und «⚙» */
/* Haus statt Pfeil: Ein Pfeil kann auch «einen Schritt zurück» heissen.
   Als Zeichnung statt als Schriftzeichen, damit es auf jedem Gerät gleich
   sitzt. Spiegelsymmetrisch, also waagrecht von selbst mittig; senkrecht ist
   die Zeichnung leicht angehoben, weil Wände und Tür mehr Tinte tragen als das Dach. */
.heim{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.heim svg{display:block}
/* Wie beim Vollbild-Knopf: Solange Platz ist, steht das Wort dabei –
   ein Pfeil allein sagt nicht, wohin er führt, und auf dem Tablet
   gibt es keinen Mauszeiger, der den Tooltip zeigt. */
@media (max-width:767px){.heim{width:36px;padding:0;border-radius:999px}.heim span{display:none}}
/* Ganz schmale Geraete: Die vier runden Knoepfe muessen neben den Titel passen. */
@media (max-width:430px){.tools{gap:8px}}
.stagewrap{position:relative}
/* Schwebende Bedienung über dem Zeichenfeld: weisse Pille mit Schatten,
   damit sie klar nicht zum Stromkreis gehört – gleiche Sprache wie die Lupe. */
.chip{position:absolute;right:10px;top:10px;z-index:2;display:inline-flex;align-items:center;gap:6px;
  font:inherit;font-size:.9rem;font-weight:600;height:34px;padding:0 14px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--line);background:#fff;color:var(--muted);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.an{border-color:var(--accent);color:#fff;background:var(--accent)}
.chip.an:hover{background:#2559a0;border-color:#2559a0;color:#fff}
/* Der Knopf richtet sich nach dem BILD, nicht nach dem Fenster: im Hochformat ist
   das Fenster breit und das Bild trotzdem schmal. Darum wird die Stufe in
   renderChip() aus der gemessenen Bildbreite bestimmt. */
.chip.kurz{padding:0 12px}
.chip.nur{width:40px;height:40px;padding:0;justify-content:center;font-size:1.15rem;right:10px;top:10px}  /* gleiche Grösse und Kante wie die Lupe unten rechts */
@media (max-width:520px){.chip{font-size:.84rem;right:8px;top:8px}.chip:not(.nur){height:30px;padding:0 11px}}
.zoombtn{display:none;position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;
  border:1.5px solid var(--ink);background:#fff;font-size:1.1rem;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#stage.zoom{overflow:auto}
#stage.zoom svg{width:210%;height:auto;max-height:none}
.modal{position:fixed;inset:0;z-index:60;background:rgba(18,24,30,.45);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.mcard{background:var(--paper);border-radius:14px;padding:14px 16px 16px;max-width:440px;width:100%;
  max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.mhead b{font-size:1.05rem}
.mcard p{margin:7px 0;line-height:1.5}
.fsmode .wrap{max-width:none}
@media (max-width:1560px){
  .top{grid-template-columns:1fr auto}
  .top .tools{grid-column:2}
  .top .tabs{grid-column:1 / -1;grid-row:2;justify-self:stretch;width:100%}
}
@media (max-width:960px){
  .top .tabs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .top .tabs .tab{padding:0 4px}
}
.tab{border:1px solid var(--line);background:var(--btn);border-radius:999px;padding:7px 13px;font-size:.92rem;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab:disabled{opacity:.45;cursor:default}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;
  flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.stagewrap{flex:0 0 auto;min-height:0}
.side{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
#stage{min-height:0;width:100%;height:100%}
.panel{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:4px;margin:0}
/* Stufe, Wassermodell und Neu starten bleiben immer auf einer Zeile */
.bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:nowrap;flex:0 0 auto;min-width:0}
.bar .t{font-weight:600;color:var(--muted);flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;justify-content:flex-end;flex:0 0 auto}
.icon{border:none;background:none;font-size:.95rem;font-weight:600;cursor:pointer;padding:4px 6px;color:var(--muted);white-space:nowrap}
.icon.an{color:var(--accent)}
#stage svg{width:100%;height:100%;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
[data-sw],[data-sw0],[data-sw2],[data-sw3],[data-lampe],[data-uhrtip]{cursor:pointer}
.lead{margin:6px 0;font-size:1.02rem;line-height:1.45}
.msg{padding:8px 11px;border-radius:12px;margin:6px 0;line-height:1.45}
.msg.ok{background:#e6f6ec;color:#11683a}
.msg.bad{background:#fdecec;color:#9b1c1c}
.msg.info{background:#eef4fd;color:#1d4d99}
.mc{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.opt{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--btn);font-size:.97rem;cursor:pointer;color:var(--ink)}
.opt:disabled{cursor:default}
.opt.pick{border-color:var(--accent);background:#eef4fd;box-shadow:inset 0 0 0 1px var(--accent)}
.opt.right{border-color:var(--ok);background:#e6f6ec}
.opt.wrongsel{border-color:var(--bad);background:#fdecec}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--btn);font:inherit;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.sub{font-weight:700;color:var(--muted);font-size:.9rem;margin:10px 0 4px}
.weg{background:#eef4fd;border-radius:12px;padding:8px 12px 10px;margin:8px 0}
.wegtitel{font-weight:700;font-size:.9rem;color:#1d4d99;margin-bottom:2px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.zurueck{font:inherit;font-size:.85rem;font-weight:600;color:#1d4d99;background:#fff;border:1px solid #c3d6ef;border-radius:9px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.zurueck:hover{border-color:var(--accent)}
.wegtext{line-height:1.45;color:var(--ink)}
.einst{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.einst summary{cursor:pointer;color:var(--muted);font-size:.92rem;font-weight:600;list-style:none}
.einst summary::-webkit-details-marker{display:none}
.einst summary::before{content:"▸ "}
.einst[open] summary::before{content:"▾ "}
.dlist{font-size:.93rem;color:#4a5560;line-height:1.55;margin:4px 0}
/* Bedienung und Anzeigen der Stufe 0 */
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:7px 0}
.ctl .lab{font-size:.9rem;color:var(--muted);font-weight:600}
.ctl .tab{padding:6px 12px}
/* Führung: der eine erlaubte Knopf bekommt einen Ring – sonst sucht man ihn */
.bedien.dran .tab:not(:disabled),.bedien.dran .btn:not(:disabled){box-shadow:0 0 0 3px #bcd4f2;border-color:var(--accent)}
.bedien.dran .lab2{color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem;margin:6px 0;table-layout:fixed}
.tbl th,.tbl td{border:1px solid var(--line);padding:3px 4px;text-align:right;overflow:hidden}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{background:#eef2f7;font-weight:700;color:var(--muted)}
.tbl.t4 tr.jetzt td{background:#eef4fd;font-weight:700;color:var(--ink)}
.dauer{display:flex;justify-content:space-between;gap:10px;margin:6px 0 2px;font-size:.95rem;color:#4a5560}
.dauer b{color:var(--ink)}
.skala.schluss{border-top:1px solid var(--line);padding-top:8px;margin-top:12px}
/* Drei Lautstärken: blau = jetzt tun · sandfarben = merken · schlicht = nachschlagen */
.merke{background:#f6f2e9;border-left:4px solid #d9bd6a;border-radius:0 10px 10px 0;padding:8px 12px;margin:8px 0;line-height:1.45;color:#4a4232}
.bedien{background:#f2f5f8;border-radius:12px;padding:4px 10px 7px;margin:8px 0}
.bedien .lab2{display:block;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:6px 0 0}
.nach{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
.nach>b{display:block;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.nachkopf{display:flex;align-items:center;gap:7px;width:100%;min-height:38px;padding:6px 2px;border:0;background:none;font:inherit;
  font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;text-align:left}
.nachkopf:hover{color:var(--accent)}
.nachkopf span{font-size:.9rem;line-height:1}
.nach .merke{margin:6px 0}
.zuord{background:transparent;border-radius:0;padding:0;margin:8px 0;font-size:.93rem;line-height:1.45}
.zuord b{display:block;color:var(--muted);font-size:.88rem;margin-bottom:2px}
.zuord div{display:flex;gap:6px;color:#33404c}
.zuord span{flex:0 0 38%;font-weight:600}
/* Messfeld der Stufe 2: Ladung, Zeit, Ergebnis */
.mess{display:grid;grid-template-columns:1fr 1fr 1.1fr;border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0;overflow:hidden}
.mess div{padding:5px 11px;border-left:1px solid var(--line)}
.mess div:first-child{border-left:0}
.mess span{display:block;font-size:.74rem;color:var(--muted);line-height:1.2}
.mess b{font-size:1.02rem}
.mess .erg{background:#eef4fd}
.mess .erg b{color:#1d4d99}
/* Spannungen zum Vergleich – nur zur Einordnung, nichts zum Einstellen */
.skala{background:transparent;border:0;padding:0;margin:8px 0;font-size:.93rem}
.skala b{display:block;font-size:.88rem;color:var(--muted);margin-bottom:2px}
.skala div{display:flex;justify-content:space-between;gap:10px;color:#4a5560;line-height:1.55}
.skala div span{font-weight:700;color:#33404c;white-space:nowrap}
.skala p{margin:7px 0 0;font-size:.88rem;color:var(--muted);line-height:1.45}
/* Offene Fragen sind in Stufe 0 der Auftrag, nicht Nachschlagewerk – darum im blauen Kasten */
.wegfrag{margin-top:8px;border-top:1px solid #cddffa;padding-top:6px}
.wegfrag>b{display:block;font-size:.88rem;color:#1d4d99;margin-bottom:2px}
.fragl{margin:2px 0 0;padding-left:18px;font-size:.93rem;line-height:1.5;color:#33404c}
.fraghin{margin:5px 0 0;font-size:.88rem;color:#5b6b80;font-style:italic}
/* Steckbrief der Grösse: Name, Zeichen, Einheit */
.steck{display:grid;grid-template-columns:1.7fr .6fr 1fr .6fr;border-radius:10px;background:#eef2f7;margin:6px 0;overflow:hidden}
.steck div{padding:4px 11px;border-left:1px solid #dbe3ec}
.steck div:first-child{border-left:0}
.steck b{color:#33404c}
.steck span{display:block;font-size:.74rem;color:var(--muted);line-height:1.2}
.steck b{font-size:1.02rem}
.dq{transform-box:fill-box;transform-origin:center}
.dq.fl{animation:dp .6s ease-in-out 4}
@keyframes dp{0%,100%{transform:scale(1)}50%{transform:scale(1.9)}}
@media (min-width:941px) and (max-height:900px){.wrap{padding-top:8px;gap:12px;padding-bottom:10px}.top{gap:6px 14px}.top .tabs .tab{height:34px}}
@media (min-width:941px) and (max-height:820px){.wrap{padding-top:6px;gap:10px;padding-bottom:8px}.top{gap:5px 14px}.top .tabs .tab{height:32px}
  .msg{font-size:.93rem;line-height:1.38}}
@media (min-width:941px) and (max-height:720px){.msg{font-size:.88rem;line-height:1.32}}
@media (min-width:941px) and (max-height:670px){.wrap{padding-top:5px;gap:10px;padding-bottom:8px}}
@media (min-width:700px) and (min-aspect-ratio:11/10){
  .card{flex-direction:row;gap:14px}
  /* Bildbreite folgt der Bildschirmhöhe (Seitenverhältnis 5:3), begrenzt durch den Platz für den Text */
  .stagewrap{flex:0 0 auto;min-width:0;height:100%;
    width:min(calc((100vh - 104px) * 5 / 3), calc(100% - clamp(320px, 28%, 430px) - 14px));
    width:min(calc((100dvh - 104px) * 5 / 3), calc(100% - clamp(320px, 28%, 430px) - 14px))}
  .side{flex:1 1 0;min-width:0}
}
@media (max-width:699px){.zoombtn{display:block}}
@media (max-width:699px), (max-aspect-ratio:11/10){
  .stagewrap{width:100%;height:min(38vh, calc((100vw - 48px) * 0.6));height:min(38dvh, calc((100vw - 48px) * 0.6))}
  /* Mit Wassermodell braucht das Bild im Hochformat mehr Platz */
  .wasser .stagewrap{height:min(50vh, calc((100vw - 48px) * 0.78));height:min(50dvh, calc((100vw - 48px) * 0.78))}
}
@media (max-width:600px){
  .fsbtn span{display:none}
  .fsbtn{width:36px;padding:0;border-radius:999px}
  h1{font-size:1.15rem}
  .h1lg{display:none}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;font-size:.86rem;padding:6px 10px}
  .wrap{padding:12px 12px 16px}
  .stagewrap{height:min(34vh, calc((100vw - 40px) * 0.6));height:min(34dvh, calc((100vw - 40px) * 0.6))}
}
@media (max-width:520px){.top .tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Sehr schmale Telefone (320 px): Der Titel weicht, damit die vier Knöpfe
   vollständig danebenpassen und keiner abgeschnitten wird. Steht zuunterst,
   weil sonst die 600-px-Regel weiter unten gewinnen würde. */
@media (max-width:360px){h1{font-size:1rem}}
/* Handy: Reiter auf Fingergrösse. */
@media (max-width:640px){.tab{min-height:44px;display:inline-flex;align-items:center}}
/* Handy: auch die Kopfknöpfe auf Fingergrösse. */
@media (max-width:640px){.fsbtn{height:44px}.hilfebtn,.fsbtn.rund{width:44px}}
@media (max-width:640px){.heim{width:44px}.zoombtn{width:44px;height:44px}.nachkopf{min-height:44px}}
@media (max-width:640px){.fsbtn{min-width:44px}.chip{min-height:44px}.icon{min-width:40px;min-height:40px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 title="Stand 23.09.2026">Grössen<span class="h1lg"> im Stromkreis</span></h1>
    <div class="tabs" id="tabs"></div>
    <div class="tools">
      <a class="fsbtn heim" href="index.html" title="Zur Übersicht" aria-label="Zur Übersicht"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.65 12 2.45l9 7.2"/><path d="M5.6 8.45v10h12.8v-10"/><path d="M9.9 18.45v-5.2h4.2v5.2"/></svg><span>Übersicht</span></a>
      <button class="fsbtn" id="fsBtn" hidden aria-label="Vollbild"></button>
      <button class="fsbtn hilfebtn" id="einstBtn" aria-label="Einstellungen" title="Einstellungen">⚙</button>
      <button class="fsbtn hilfebtn" id="helpBtn" aria-label="Anleitung" title="Anleitung">?</button>
    </div>
  </div>
  <div class="card">
    <div class="stagewrap"><div id="stage"></div>
      <button class="chip" id="wasserBtn" data-act="wasser" title="Wassermodell ein- oder ausblenden"></button>
      <button class="zoombtn" id="zoomBtn" title="Bild vergrössern">🔍</button></div>
    <div class="side">
      <div class="panel" id="panel"></div>
    </div>
  </div>
</div>
<div id="einst" class="modal" hidden>
  <div class="mcard">
    <div class="mhead"><b>⚙ Einstellungen</b><button class="icon" data-einst="zu" aria-label="Schliessen">✕</button></div>
    <div id="einstText"></div>
    <div class="row"><button class="btn primary" data-einst="zu">Fertig</button></div>
  </div>
</div>
<div id="hilfe" class="modal" hidden>
  <div class="mcard">
    <div class="mhead"><b id="hilfeTitel"></b><button class="icon" data-hilfe="zu" aria-label="Schliessen">✕</button></div>
    <div id="hilfeText"></div>
    <div class="row"><button class="btn primary" data-hilfe="zu">Alles klar</button></div>
  </div>
</div>

<script>
/* ============================================================
   Grössen im Stromkreis
   Stufe 1 · Ladung  (Stufen 2–5 folgen)
   Ein Punkt = 0,1 C. Das Lämpchen braucht 0,3 A,
   also kommen an jeder Stelle 3 Punkte pro Sekunde vorbei (Echtzeit).
   ============================================================ */

const STUFEN=[[0,'Hell oder dunkel?'],[1,'Ladung'],[2,'Stromstärke'],[3,'Spannung'],[4,'Widerstand'],[5,'Leistung']];
const BEREIT=[0,1,2,3,4,5];                     // Stufen, die schon gebaut sind
const G={stufe:0, wasser:false, fuehrung:true, einstOffen:false, ladung:false, mess:false, nachOffen:false};
const fmt1=x=>x.toFixed(1).replace('.',',');
const fmt2=x=>(Math.abs(x)<0.995?x.toFixed(2):x.toFixed(2).replace(/0$/,'')).replace('.',',');

/* ---------- Bildausschnitt an die Fenstergrösse anpassen (wie Fehlersuche) ---------- */
let VB={x:0,y:0,w:800,h:480};
function fitVB(cx,cy,cw,ch,topShare,maxExtra){
  const el=document.getElementById('stage'), r=el?el.getBoundingClientRect():null;
  let ar=(r&&r.width>4&&r.height>4)?r.width/r.height:cw/ch;
  ar=Math.max(0.55,Math.min(4.5,ar));

function step(dt){
  if(G.stufe===0) return step0(dt);
  if(G.stufe===2) return step2(dt);
  if(G.stufe===3) return step3(dt);
  if(G.stufe===4) return step4(dt);
  if(G.stufe===5) return step5(dt);
  if(G.stufe!==1) return;
  const st=S1; let neu=false;
  const vorher=kontakt(st);
  if(easeSw(st,dt)){ hebelZeichnen(st); if(kontakt(st)!==vorher) neu=true; }
  if(kontakt(st)){
    const o0=st.off, o1=o0+VPX*dt;
    let c=Math.floor((o1-Z1)/D)-Math.floor((o0-Z1)/D);
    st.off=o1%LEN;
    if(st.tab==='auf'&&st.phase==='run'&&st.task.run==='count'&&st.q+c>=st.task.target){
      c=st.task.target-st.q; st.closed=false; st.phase='why'; neu=true;
    }
    st.q+=c;
    if(st.tab==='erk'&&erkGefuehrt()&&st.erk===2&&st.q>=20){ st.erk=3; neu=true; }
    draw();
  }
  if(st.runT>0){ st.runT-=dt; if(st.runT<=0){ st.runT=0; st.flash=false; st.phase='why'; neu=true; } }
  if(neu) render();
}

function konf0(){

  const an = kontakt(s) && !unterbrochen && s.vorrat>0;
  return {n,par,drin,m,an,
    iHaupt: an?(par?m:1/n):0,                  // in Einheiten von 0,3 A
    iZweig: an?(par?1:1/n):0,

const MESSP=(()=>{const ns='http://www.w3.org/2000/svg',sv=document.createElementNS(ns,'svg'),p=document.createElementNS(ns,'path');
  sv.setAttribute('width','0'); sv.setAttribute('height','0');

  sv.appendChild(p); document.body.appendChild(sv); return p;})();
function bahn(pts,f,ph){
  const d=rpath(pts); MESSP.setAttribute('d',d);
  const L=MESSP.getTotalLength(), lut=[];
  for(let s=0;s<=Math.ceil(L);s++){ const q=MESSP.getPointAtLength(Math.min(s,L));
    lut.push([Math.round(q.x*10)/10,Math.round(q.y*10)/10]); }
  const N=Math.max(2,Math.round(L/30)), D=L/N;
  return {d,L,N,D,lut,f:f||0,ph:(ph||0)*D,o:(ph||0)*D};
}
/* Der Stand jeder Bahn wird MITGEZÄHLT, nicht aus «Zeit mal Tempo» gerechnet.
   Sonst springt beim Anhalten (Tempo 0) alles auf den Anfang zurück.
   Über den Pfad-String findet eine neu gebaute Bahn ihren alten Stand wieder. */
const STAND=new Map();
const pAt=(b,s)=>b.lut[Math.round(((s%b.L)+b.L)%b.L)]||b.lut[0];
const dotOff=b=>b.o;

const raeder0=K=>plaetze(K.n,K.par).filter((p,k)=>K.par?K.drin.includes(k):true);
let BH={key:'',v:null};
/* Eine einzige Bahnenliste – Stromkreis und Wassermodell laufen darauf gleich.
   Bei parallel trägt jedes Stück der Waagrechten nur den Strom der Zweige,
   die noch dahinter liegen. So entsteht und verschwindet an keiner
   Verzweigung ein Punkt. */
/* Das Tempo steckt NICHT in der Bahn, sondern kommt erst beim Bewegen dazu.
   Sonst müssten beim Ein- und Ausschalten alle Bahnen neu vermessen werden –
   und das dauert so lange, dass es sich wie eine Verzögerung anfühlt. */
const tempo0=K=>K.par?K.iZweig*3:K.iHaupt*3;
function bahnen0(){
  const K=konf0();
  // nur was die GEOMETRIE ändert, gehört in den Schlüssel
  const key=K.par?`p${K.n}${K.drin.join(',')}`:'s';
  if(BH.key===key) return BH.v;
  const B=[];
  if(!K.par){
    const x=ZX[1][0];
    B.push(bahn(ZULEIT.concat([[x,GTOP],[x,GBOT]],ABLEIT),1));
  } else {
    const X=ZX[K.n];
    // wie viele Zweige ab Stelle j noch folgen
    const rest=j=>K.drin.filter(k=>k>=j).length;
    B.push(bahn(ZULEIT.concat([[X[0],GTOP]]),rest(0)));
    for(let j=0;j<K.n-1;j++) B.push(bahn([[X[j],GTOP],[X[j+1],GTOP]],rest(j+1)));
    K.drin.forEach((k,i)=>B.push(bahn([[X[k],GTOP],[X[k],GBOT]],1,i/Math.max(1,K.m))));
    for(let j=K.n-1;j>0;j--) B.push(bahn([[X[j],GBOT],[X[j-1],GBOT]],rest(j)));
    B.push(bahn([[X[0],GBOT]].concat(ABLEIT),rest(0)));
  }
  B.forEach(b=>{ if(STAND.has(b.d)) b.o=STAND.get(b.d); });
  BH={key,v:{L:B,W:B}}; return BH.v;

  <rect data-vor x="${QX-59.5}" y="${QY-27.5}" width="${Math.round(VORB*vb*10)/10}" height="11" rx="5.5" fill="${vb<0.2?'#d8322b':'#23794A'}"/>

function step0(dt){
  const s=S0; let neu=false;
  const vorher=kontakt(s);
  if(easeSw(s,dt)){ hebelZeichnen(s); if(kontakt(s)!==vorher) neu=true; }
  const K=konf0();
  if(K.an){
    const B=bahnen0();
    s.S+=dt;
    s.aRad+=dt*K.iZweig*78; s.aPumpe+=dt*K.iHaupt*54;
    const T=tempo0(K);
    B.L.forEach(b=>{ b.o+=dt*b.f*T*b.D; STAND.set(b.d,b.o); });
    s.q[0]+=K.iHaupt*0.3*dt;
    if(K.par) K.drin.forEach((k,j)=>{ s.q[j+1]+=K.iZweig*0.3*dt; });
    if(s.raffer){
      const r=raffTempo(), dv=dt*r*K.pGes*P1/VORRAT_WH;     // Abnahme proportional zur Gesamtleistung
      if(dv>0&&s.vorrat-dv<=0){ s.std+=dt*r*(s.vorrat/dv); s.vorrat=0; s.raffer=false; s.leer=true; neu=true; }
      else { s.std+=dt*r; s.vorrat-=dv; }

/* ---------- Ablauf der Aufgaben ---------- */
function skriptAn(sk){ const s=S0; s.skript=sk; s.si=-1; s.erg={}; skriptWeiter(); }
function skriptWeiter(){
  const s=S0; s.si++;
  if(s.si>=s.skript.length){ s.skript=null; s.raffer=false; s.phase='done'; return; }
  const sc=s.skript[s.si];
  if(sc.set){ if(sc.set.art!==undefined) s.art=sc.set.art;
    if(sc.set.n!==undefined) s.n=sc.set.n;
    if(sc.set.raus!==undefined) rausSetzen0(sc.set.raus);
    if(sc.set.closed!==undefined) s.closed=sc.set.closed; }
  s.vorrat=1; s.std=0; s.leer=false; s.raffer=!!sc.leer;   // jede Vorführung mit frischer Batterie
  s.sT=sc.t||0;

function skriptSchritt(dt){

  if(sc.leer){ if(s.vorrat<=0){ if(sc.merke) s.erg[sc.merke]=s.std; skriptWeiter(); return true; } return false; }
  s.sT-=dt; if(s.sT<=0){ skriptWeiter(); return true; }
  return false;

function step2(dt){
  const s=S2; let neu=false;
  const vorher=kontakt(s);
  if(easeSw(s,dt)){ hebelZeichnen(s); if(kontakt(s)!==vorher) neu=true; }
  if(kontakt(s)){ s.off=(s.off+I2()*10*D*dt)%LEN; }
  if(s.laeuft){
    if(!s.closed){ s.laeuft=false; s.msg='Bei offenem Schalter fliesst nichts – die Messung wurde gestoppt.'; neu=true; }
    else if(kontakt(s)){ s.q+=I2()*dt; s.t+=dt;
      const sc=s.skript&&s.skript[s.si];
      if(sc&&sc.bis&&s.t>=sc.bis){ s.q=I2()*sc.bis; s.t=sc.bis; s.laeuft=false; neu=true; } }
  }
  if(kontakt(s)||s.laeuft) draw2();
  if(s.skript) neu=skript2(dt)||neu;
  if(neu) render();
}
function skript2(dt){
  const s=S2, sc=s.skript[s.si];
  if(sc.bis){ if(!s.laeuft&&s.t>=sc.bis){ weiter2(); return true; } return false; }
  s.sT-=dt; if(s.sT<=0){ weiter2(); return true; }
  return false;
}
function weiter2(){
  const s=S2; s.si++;
  if(s.si>=s.skript.length){ s.skript=null; s.laeuft=false; s.phase='done'; return; }
  const sc=s.skript[s.si];
  if(sc.set){ if(sc.set.v!==undefined) s.v=sc.set.v; if(sc.set.mess!==undefined) s.mess=sc.set.mess;
              if(sc.set.closed!==undefined) s.closed=sc.set.closed; }
  if(sc.bis){ s.q=0; s.t=0; s.laeuft=true; }
  s.sT=sc.t||0;
}

      if(v==='auf'&&!st.fertig){ if(!st.task||st.phase==='done') newTask(); else taskSetup(); }
      else { st.closed=false; st.q=0; }
      break;
    case 'reset':
      G.einstOffen=false;
      if(G.stufe===5){
        S5.msg=''; S5.justDone=false; S5.skript=null; S5.closed=false; S5.off=0; S5.raffer=false; vorratNeu();
        if(S5.tab==='erk'){ if(!S5.erkFertig){ S5.erk=1; S5.gelaufen=[false,false,false]; } S5.u=0; } else task5Setup();
        break;
      }
      if(G.stufe===4){
        S4.msg=''; S4.justDone=false; S4.skript=null; S4.closed=false; S4.off=0;
        if(S4.tab==='erk'){ if(!S4.erkFertig){ S4.erk=1; S4.probiert=[false,false,false]; } S4.d=0; } else task4Setup();
        break;
      }
      if(G.stufe===3){
        S3.msg=''; S3.justDone=false; S3.skript=null; S3.closed=false; S3.off=0;
        if(S3.tab==='erk'){ if(!S3.erkFertig){ S3.erk=1; S3.vergl=false; } S3.u=0; S3.vpos='lampe'; } else task3Setup();
        break;
      }
      if(G.stufe===2){
        S2.msg=''; S2.justDone=false; S2.skript=null; S2.laeuft=false; S2.q=0; S2.t=0; S2.closed=false; S2.off=0;
        if(S2.tab==='erk'){ if(!S2.erkFertig) S2.erk=1; S2.v=1; S2.mess='vor'; } else task2Setup();
        break;
      }
      if(G.stufe===0){
        S0.msg=''; S0.justDone=false; S0.skript=null; S0.raffer=false; S0.raus=[false,false,false];
        S0.closed=false; S0.vorrat=1; S0.std=0; S0.leer=false; nullZaehler0(); standNull0();
        if(S0.tab==='erk'){ if(!S0.erkFertig){ S0.erk=1; S0.vergl=false; S0.gelaufen={ser:false,par:false}; } S0.art='ser'; S0.n=1; } else task0Setup();
        break;
      }
      if(st.tab==='erk'){ st.closed=false; st.q=0; st.msg=''; st.justDone=false; if(!st.erkFertig) st.erk=1; }
      else taskSetup();
      break;
    case 'erkZur': erkZurueck(); break;
    case 'nachAuf': G.nachOffen=!G.nachOffen;
      // nach dem Neuzeichnen die Kopfzeile nach oben holen, damit das Aufgeklappte sichtbar wird
      if(G.nachOffen) requestAnimationFrame(()=>{ const k=document.querySelector('#panel .nachkopf');
        if(k) k.scrollIntoView({block:'start',behavior:'smooth'}); });
      break;
    case 'wasser': G.wasser=!G.wasser; break;
    case 'zeigLadung': G.ladung=!G.ladung; break;
    case 'zeigMess': G.mess=!G.mess; break;
    case 'fuehr':
      G.fuehrung=!G.fuehrung;
      if(G.fuehrung){
        st.erkFertig=false; st.erk=1; st.geloest=0; st.justDone=false; if(st.tab==='erk'){ st.closed=false; st.q=0; }
        S0.erkFertig=false; S0.erk=1; S0.vergl=false; S0.gelaufen={ser:false,par:false}; S0.geloest=0; S0.justDone=false;
        S2.erkFertig=false; S2.erk=1; S2.geloest=0; S2.justDone=false;
        S3.erkFertig=false; S3.erk=1; S3.vergl=false; S3.geloest=0; S3.justDone=false;
        S4.erkFertig=false; S4.erk=1; S4.probiert=[false,false,false]; S4.geloest=0; S4.justDone=false;
        S5.erkFertig=false; S5.erk=1; S5.gelaufen=[false,false,false]; S5.geloest=0; S5.justDone=false;
      }
      break;
    /* ---- Stufe 0 ---- */
    case 'tab0':
      if(v===S0.tab) break;
      S0.tab=v; S0.msg=''; S0.justDone=false; S0.skript=null; S0.raffer=false;
      if(v==='auf'&&!S0.fertig){ if(!S0.task||S0.phase==='done') newTask0(); else task0Setup(); }
      break;
    case 'art': S0.art=v; S0.raus=[false,false,false]; nullZaehler0(); vorratFrisch0(); erk0Pruefen(); break;
    case 'anz': S0.n=+v; S0.raus=[false,false,false]; nullZaehler0(); vorratFrisch0(); erk0Pruefen(); break;
    case 'raff': S0.raffer=!S0.raffer; if(S0.raffer&&S0.vorrat<=0) S0.msg='Die Batterie ist leer – wechsle sie zuerst.'; break;
    case 'neueBat': S0.vorrat=1; S0.std=0; S0.leer=false; S0.msg=''; break;
    case 'cmp0':
      if(+v===1){ S0.erk=4; S0.msg=''; vorratFrisch0(); S0.gelaufen={ser:false,par:false}; }
      else S0.msg='Schau nochmals hin: Vergleiche mit der Helligkeit des einzelnen Lämpchens vom Anfang.';
      break;
    case 'cmp0b':
      if(+v===1){ S0.erk=5; S0.erkFertig=true; S0.justDone=true; S0.msg=''; }
      else S0.msg='Vergleiche nochmals die Stunden: Wie lange lief sie parallel, wie lange in Serie?';
      break;
    case 'pick0': if(S0.phase==='predict'||S0.phase==='ready'){ S0.pick=+v; S0.phase='ready'; S0.msg=''; } break;
    case 'prove0': S0.phase='run'; nullZaehler0(); standNull0(); skriptAn(S0.task.sk); break;
    case 'next0': S0.geloest++; if(S0.taskNo>=ORDER0.length) S0.fertig=true; else newTask0(); break;
    case 'neuRunde0': S0.fertig=false; S0.taskNo=0; newTask0(); break;
    /* ---- Stufe 2 ---- */
    case 'tab2':
      if(v===S2.tab) break;
      S2.tab=v; S2.msg=''; S2.justDone=false; S2.skript=null; S2.laeuft=false; S2.q=0; S2.t=0;
      if(v==='auf'&&!S2.fertig){ if(!S2.task||S2.phase==='done') newTask2(); else task2Setup(); }
      break;
    case 'verbr': S2.v=+v; S2.q=0; S2.t=0; S2.laeuft=false; S2.msg=''; break;
    case 'ampos': S2.mess=v; break;
    case 'mess2': messUm(); return;
    case 'mnull': S2.q=0; S2.t=0; S2.laeuft=false; S2.msg=''; break;
    case 'cmp2':
      if(+v===1){ S2.erk=4; S2.erkFertig=true; S2.justDone=true; S2.msg=''; }
      else S2.msg='Vergleiche nochmals: Was steht im Amperemeter, und was ergibt Ladung ÷ Zeit?';
      break;
    case 'pick2': if(S2.phase==='predict'||S2.phase==='ready'){ S2.pick=+v; S2.phase='ready'; S2.msg=''; } break;
    case 'prove2': S2.phase='run'; S2.q=0; S2.t=0; S2.si=-1; S2.skript=S2.task.sk; weiter2(); break;
    case 'next2': S2.geloest++; if(S2.taskNo>=ORDER2.length) S2.fertig=true; else newTask2(); break;
    case 'neuRunde2': S2.fertig=false; S2.taskNo=0; newTask2(); break;
    /* ---- Stufe 3 ---- */
    case 'tab3':
      if(v===S3.tab) break;
      S3.tab=v; S3.msg=''; S3.justDone=false; S3.skript=null;
      if(v==='auf'&&!S3.fertig){ if(!S3.task||S3.phase==='done') newTask3(); else task3Setup(); }
      break;
    case 'ubat': S3.u=+v; S3.msg=''; erk3Pruefen(); break;
    case 'vpos': S3.vpos=v; S3.msg=''; erk3Pruefen(); break;
    case 'cmp3':
      if(+v===1){ S3.erk=4; S3.erkFertig=true; S3.justDone=true; S3.msg=''; }
      else S3.msg='Vergleiche nochmals: Was stand am Lämpchen, was steht jetzt an der Batterie?';
      break;
    case 'pick3': if(S3.phase==='predict'||S3.phase==='ready'){ S3.pick=+v; S3.phase='ready'; S3.msg=''; } break;
    case 'prove3': S3.phase='run'; S3.si=-1; S3.skript=S3.task.sk; weiter3(); break;
    case 'next3': S3.geloest++; if(S3.taskNo>=ORDER3.length) S3.fertig=true; else newTask3(); break;
    case 'neuRunde3': S3.fertig=false; S3.taskNo=0; newTask3(); break;
    /* ---- Stufe 4 ---- */
    case 'tab4':
      if(v===S4.tab) break;
      S4.tab=v; S4.msg=''; S4.justDone=false; S4.skript=null;
      if(v==='auf'&&!S4.fertig){ if(!S4.task||S4.phase==='done') newTask4(); else task4Setup(); }
      break;
    case 'draht': S4.d=+v; S4.msg=''; erk4Pruefen(); break;
    case 'cmp4':
      if(+v===1){ S4.erk=4; S4.erkFertig=true; S4.justDone=true; S4.msg=''; }
      else S4.msg='Schau nochmals in die Tabelle: Wie viel Strom fliesst beim dicken, wie viel beim dünnen Draht?';
      break;
    case 'pick4': if(S4.phase==='predict'||S4.phase==='ready'){ S4.pick=+v; S4.phase='ready'; S4.msg=''; } break;
    case 'prove4': S4.phase='run'; S4.si=-1; S4.skript=S4.task.sk; weiter4(); break;
    case 'next4': S4.geloest++; if(S4.taskNo>=ORDER4.length) S4.fertig=true; else newTask4(); break;
    case 'neuRunde4': S4.fertig=false; S4.taskNo=0; newTask4(); break;
    /* ---- Stufe 5 ---- */
    case 'tab5':
      if(v===S5.tab) break;
      S5.tab=v; S5.msg=''; S5.justDone=false; S5.skript=null; S5.raffer=false;
      if(v==='auf'&&!S5.fertig){ if(!S5.task||S5.phase==='done') newTask5(); else task5Setup(); }
      break;
    case 'ubat5': S5.u=+v; S5.msg=''; S5.raffer=false; vorratNeu(); erk5Pruefen(); break;   // jeder Vergleich ist ein bewusster Lauf
    case 'raff5': S5.raffer=!S5.raffer; if(S5.raffer&&S5.leer) vorratNeu(); S5.msg=''; break;
    case 'vneu5': vorratNeu(); S5.raffer=false; S5.msg=''; break;
    case 'cmp5':
      if(+v===1){ S5.erk=4; S5.erkFertig=true; S5.justDone=true; S5.msg=''; }
      else S5.msg='Vergleiche nochmals die Stunden: Wie lange hielt die eine Batterie, wie lange die andere?';
      break;
    case 'pick5': if(S5.phase==='predict'||S5.phase==='ready'){ S5.pick=+v; S5.phase='ready'; S5.msg=''; } break;
    case 'prove5':
      if(S5.task.rechnen){ S5.phase='done'; break; }
      S5.phase='run'; S5.si=-1; S5.skript=S5.task.sk; weiter5(); break;
    case 'next5': S5.geloest++; if(S5.taskNo>=ORDER5.length) S5.fertig=true; else newTask5(); break;
    case 'neuRunde5': S5.fertig=false; S5.taskNo=0; newTask5(); break;
    case 'null': st.q=0; st.justDone=false; break;
    case 'cmp':
      if(+v===1){ st.erk=4; st.erkFertig=true; st.justDone=true; st.msg=''; }
      else st.msg='Schau nochmals genau hin: Vergleiche die Zahlen bei ① und ②.';
      break;
    case 'pick': if(st.phase==='predict'||st.phase==='ready'){ st.pick=+v; st.phase='ready'; st.msg=''; } break;
    case 'prove': {
      const t=st.task; st.msg=''; st.phase='run';
      if(t.run==='count'){ st.q=0; st.closed=true; }
      else if(t.run==='close'){ st.q=0; st.closed=true; st.flash=true; st.runT=3; }
      else { st.flash=true; st.runT=2.6; }
      break; }
    case 'why': if(st.phase==='why'){ st.why=+v; st.phase='done'; } break;
    case 'next': st.geloest++; if(st.taskNo>=ORDER.length) st.fertig=true; else newTask(); break;
    case 'neuRunde': st.fertig=false; st.taskNo=0; newTask(); break;
  }
  render();
});

/* Vollbild: auf dem Tablet fällt die Adressleiste weg, im Unterricht lenkt weniger ab */
const ICON_FS_ON  = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const ICON_FS_OFF = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
/* Nicht am Gerät festmachen, sondern nachfragen, ob der Browser es kann.
   Auf dem iPhone sagt Safari nein, auf dem iPad je nach Version ja.
   Als Web-App vom Home-Bildschirm ist ohnehin schon alles Vollbild. */
const fsMoeglich=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
const fsCan=!standalone&&fsMoeglich&&!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
const fsBtn=document.getElementById('fsBtn');
function fsLabel(){
  const on=!!fsEl();
  document.documentElement.classList.toggle('fsmode',on);
  fsBtn.innerHTML=(on?ICON_FS_OFF:ICON_FS_ON)+`<span>${on?'Vollbild beenden':'Vollbild'}</span>`;
  fsBtn.setAttribute('aria-label',on?'Vollbild beenden':'Vollbild');
  fsBtn.title=on?'Vollbild beenden':'Vollbild';
  render();
}
if(fsCan){
  fsBtn.hidden=false; fsLabel();
  fsBtn.onclick=()=>{ const d=document, el=d.documentElement;
    if(fsEl()){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); return; }
    try{ const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);
      if(r&&r.catch) r.catch(()=>{ fsBtn.hidden=true; });
      // Meldet der Browser Vollbild, tut es aber nicht: Knopf verschwinden lassen
      setTimeout(()=>{ if(!fsEl()) fsBtn.hidden=true; },900);
    }catch(e){ fsBtn.hidden=true; } };
  document.addEventListener('fullscreenchange',fsLabel);
  document.addEventListener('webkitfullscreenchange',fsLabel);
}

/* ---------- Kurzanleitung pro Stufe ---------- */

   '<p>Der Balken an der Batterie zeigt ihren <b>Vorrat</b>. Was da drin steckt, klären wir später. Mit «▶ Zeitraffer» läuft die Zeit schnell, so siehst du, wie lange die Batterie hält.</p>'+

   '<p>Je <b>dünner</b> der Draht, desto <b>grösser</b> sein Widerstand – und desto <b>weniger</b> Strom fliesst. Die Tabelle füllt sich, sobald du ein Drahtstück ausprobiert hast.</p>'+

   '<p>Die <b>Zählstelle ①</b> zählt die Ladung, die <b>Stoppuhr</b> die Zeit. Tippe die Stoppuhr an, um eine Messung zu starten und zu stoppen.</p>'+

const hilfeMem=new Set();
const hilfeGesehen=n=>{ if(hilfeMem.has(n)) return true;
  try{ return localStorage.getItem('grossen-hilfe-'+n)==='1'; }catch(e){ return false; } };
const hilfeMerken=n=>{ hilfeMem.add(n);
  try{ localStorage.setItem('grossen-hilfe-'+n,'1'); }catch(e){} };
function zeigeHilfe(n){
  const [t,txt]=HELP[n]||HELP[1];
  document.getElementById('hilfeTitel').textContent=`Stufe ${n} · ${t}`;
  document.getElementById('hilfeText').innerHTML=txt;
  document.getElementById('hilfe').hidden=false; hilfeMerken(n);
}
document.getElementById('helpBtn').onclick=()=>zeigeHilfe(curStufe());
document.getElementById('hilfe').addEventListener('click',e=>{
  if(e.target.id==='hilfe'||e.target.closest('[data-hilfe="zu"]')) document.getElementById('hilfe').hidden=true; });
/* Escape schliesst immer nur das oberste Fenster – sonst verschwinden beide
   auf einmal, und man landet unerwartet wieder in der Aufgabe. */
addEventListener('keydown',e=>{ if(e.key!=='Escape') return;
  if(G.einstOffen){ e.preventDefault(); G.einstOffen=false; render(); return; }
  if(!document.getElementById('hilfe').hidden){ e.preventDefault();
    document.getElementById('hilfe').hidden=true; } });
function hilfeBeimErstenMal(){ const n=curStufe(); if(!hilfeGesehen(n)) zeigeHilfe(n); }

/* Lupe für kleine Bildschirme */
const zoomBtn=document.getElementById('zoomBtn');
zoomBtn.onclick=()=>{ const st=document.getElementById('stage');
  const an=st.classList.toggle('zoom'); zoomBtn.textContent=an?'🔎':'🔍';
  zoomBtn.title=an?'Bild verkleinern':'Bild vergrössern';
  if(an) requestAnimationFrame(()=>{ st.scrollLeft=(st.scrollWidth-st.clientWidth)/2;
    st.scrollTop=(st.scrollHeight-st.clientHeight)*0.5; });
  else render(); };

/* Fenstergrösse ändert den Bildausschnitt */
let fitT=null;
const refit=()=>{ clearTimeout(fitT); fitT=setTimeout(render,80); };
addEventListener('resize',refit);
addEventListener('orientationchange',refit);

ausAdresse();
startFertig=true;
render();
requestAnimationFrame(render);
requestAnimationFrame(frame);
hilfeBeimErstenMal();
